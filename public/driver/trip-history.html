<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Trip History</title>

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,viewport-fit=cover"
  />

  <link rel="stylesheet" href="driver.css" />

  <style>
    :root{
      --history-bg:#03152f;
      --history-navy:#061d3d;
      --history-navy-2:#0b2a53;
      --history-gold:#ffd226;
      --history-gold-2:#d9a817;
      --history-text:#ffffff;
      --history-muted:#aebdd2;
      --history-green:#26d968;
      --history-red:#ff5e61;
      --history-orange:#ff9f38;
    }

    body.trip-history-page{
      margin:0;
      height:100dvh;
      overflow:hidden;
      color:var(--history-text);
      background:
        linear-gradient(rgba(1,10,24,.52),rgba(1,10,24,.68)),
        url("assets/map-background.png")
        center top / cover
        no-repeat;
    }

    .history-shell{
      height:100dvh;
      display:flex;
      flex-direction:column;
      padding-bottom:calc(88px + env(safe-area-inset-bottom));
      overflow:hidden;
    }

    .history-header{
      flex:0 0 auto;
      padding:max(14px,env(safe-area-inset-top)) 16px 12px;
      text-align:center;
      background:
        linear-gradient(
          160deg,
          rgba(4,25,55,.98),
          rgba(2,14,32,.98)
        );
      border-bottom:3px solid var(--history-gold-2);
      box-shadow:
        0 7px 0 rgba(44,29,0,.40),
        0 11px 20px rgba(0,0,0,.20);
    }

    .history-title{
      margin:0;
      color:var(--history-gold);
      font-size:26px;
      line-height:1;
      font-weight:900;
      letter-spacing:.3px;
      text-transform:uppercase;
      text-shadow:
        0 2px 0 #8d5f00,
        0 4px 8px rgba(0,0,0,.30);
    }

    .history-subtitle{
      margin-top:6px;
      color:#d9e2ef;
      font-size:11px;
      font-weight:700;
    }

    .history-scroll{
      flex:1 1 auto;
      min-height:0;
      overflow-y:auto;
      padding:12px 14px 24px;
      scrollbar-width:none;
    }

    .history-scroll::-webkit-scrollbar{
      display:none;
    }

    .history-summary{
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
      margin-bottom:14px;
    }

    .summary-stat{
      padding:12px 14px;
      border-radius:20px;
      background:
        radial-gradient(circle at 20% 16%,rgba(91,161,255,.12),transparent 35%),
        linear-gradient(160deg,#0b2a53 0%,#061d3d 52%,#03142d 100%);
      border-top:2px solid rgba(255,224,116,.78);
      border-left:2px solid rgba(239,184,39,.62);
      border-right:2px solid rgba(102,65,0,.72);
      border-bottom:3px solid rgba(82,53,0,.88);
      box-shadow:
        0 6px 0 rgba(47,30,0,.42),
        0 11px 20px rgba(2,12,30,.23),
        inset 0 1px 0 rgba(255,255,255,.08);
    }

    .summary-stat-row{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:12px;
    }

    .summary-stat-label{
      color:#ffffff;
      font-size:13px;
      font-weight:900;
      text-transform:uppercase;
    }

    .summary-stat-value{
      color:var(--history-gold);
      font-size:30px;
      line-height:1;
      font-weight:900;
      text-shadow:0 2px 5px rgba(0,0,0,.30);
    }

    .summary-stat-range{
      margin-top:6px;
      color:var(--history-muted);
      font-size:10px;
      line-height:1.3;
      font-weight:700;
    }

    .history-loading,
    .history-empty,
    .history-error{
      padding:22px 16px;
      text-align:center;
      color:#d7e1ee;
      font-size:13px;
      font-weight:800;
      border-radius:18px;
      background:rgba(3,20,45,.86);
      border:1px solid rgba(255,210,38,.28);
    }

    .history-error{
      color:#ffb1b1;
    }

    .history-day{
      margin-top:14px;
    }

    .history-day:first-child{
      margin-top:0;
    }

    .history-day-title{
      display:flex;
      align-items:center;
      gap:10px;
      margin:0 2px 9px;
      color:var(--history-gold);
      font-size:14px;
      font-weight:900;
    }

    .history-day-title::after{
      content:"";
      height:1px;
      flex:1;
      background:
        linear-gradient(
          90deg,
          rgba(255,210,38,.70),
          rgba(255,210,38,0)
        );
    }

    .history-day-list{
      display:grid;
      gap:10px;
    }

    .history-trip-card{
      position:relative;
      overflow:hidden;
      padding:13px 14px;
      border-radius:20px;
      background:
        radial-gradient(circle at 24% 14%,rgba(76,145,240,.12),transparent 35%),
        linear-gradient(160deg,#0a294f 0%,#061c3b 53%,#03142d 100%);
      border-top:2px solid rgba(255,225,125,.60);
      border-left:2px solid rgba(226,173,38,.52);
      border-right:2px solid rgba(76,48,0,.72);
      border-bottom:3px solid rgba(59,37,0,.84);
      box-shadow:
        0 6px 0 rgba(40,25,0,.40),
        0 11px 20px rgba(2,12,30,.22),
        inset 0 1px 0 rgba(255,255,255,.07);
    }

    .history-trip-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .history-trip-number{
      min-width:0;
      color:#ffffff;
      font-size:13px;
      font-weight:900;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .history-status{
      flex:0 0 auto;
      min-width:92px;
      padding:7px 10px;
      border-radius:999px;
      text-align:center;
      font-size:10px;
      line-height:1;
      font-weight:900;
      letter-spacing:.2px;
      color:#fff;
      border:1px solid rgba(255,255,255,.16);
    }

    .history-status.completed{
      background:#14783a;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.14);
    }

    .history-status.no-show{
      color:#2b1c00;
      background:#f3c740;
      border-color:#ffdf73;
    }

    .history-status.cancelled{
      background:#a92f34;
    }

    .history-status.not-completed{
      background:#b95b16;
    }

    .history-trip-name{
      margin-top:10px;
      color:#ffffff;
      font-size:17px;
      line-height:1.2;
      font-weight:900;
    }

    .history-trip-meta{
      margin-top:10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      color:#b8c6d9;
      font-size:11px;
      font-weight:800;
    }

    .history-trip-date,
    .history-trip-time{
      white-space:nowrap;
    }

    @media(min-width:600px){
      .history-summary{
        grid-template-columns:repeat(3,1fr);
      }
    }

    @media(max-width:390px){
      .history-title{
        font-size:23px;
      }

      .history-scroll{
        padding-left:12px;
        padding-right:12px;
      }

      .summary-stat{
        border-radius:18px;
      }

      .history-trip-card{
        border-radius:18px;
      }

      .history-trip-name{
        font-size:16px;
      }

      .history-status{
        min-width:84px;
        padding:7px 8px;
        font-size:9px;
      }
    }
  </style>
</head>

<body class="trip-history-page">

  <main class="history-shell">

    <header class="history-header">
      <h1 class="history-title">Trip History</h1>
      <div class="history-subtitle">
        Final trips from the last 3 months
      </div>
    </header>

    <section class="history-scroll">

      <section class="history-summary">

        <article class="summary-stat">
          <div class="summary-stat-row">
            <span class="summary-stat-label">Today</span>
            <strong class="summary-stat-value" id="todayCount">0</strong>
          </div>
          <div class="summary-stat-range" id="todayRange">--</div>
        </article>

        <article class="summary-stat">
          <div class="summary-stat-row">
            <span class="summary-stat-label">This Week</span>
            <strong class="summary-stat-value" id="weekCount">0</strong>
          </div>
          <div class="summary-stat-range" id="weekRange">--</div>
        </article>

        <article class="summary-stat">
          <div class="summary-stat-row">
            <span class="summary-stat-label">This Month</span>
            <strong class="summary-stat-value" id="monthCount">0</strong>
          </div>
          <div class="summary-stat-range" id="monthRange">--</div>
        </article>

      </section>

      <div id="historyState" class="history-loading">
        Loading trip history...
      </div>

      <section id="historyGroups"></section>

    </section>

  </main>

  <div id="driverNav"></div>

  <script src="driver-nav.js"></script>
  <script src="trip-history.js"></script>

</body>
</html>
