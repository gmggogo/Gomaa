DESTINATION PATH:
server/public/admin/external-summary.html
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Broker Summary</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="/admin/style.css">
<link rel="stylesheet" href="/admin/header.css">

<style>
*{box-sizing:border-box}

html,body{
  width:100%;
  max-width:100%;
  overflow-x:hidden;
}

body{
  margin:0;
  font-family:Segoe UI,Arial,sans-serif;
  background:#f1f5f9;
  color:#0f172a;
}

#adminHeader{
  width:100%;
  z-index:1000;
}

.page-body{
  padding:18px 22px 30px;
}

.page-head{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:84px;
  margin-bottom:12px;
  padding:16px 20px;
  border:1px solid #e0be5a;
  border-radius:18px;
  background:linear-gradient(135deg,#fff8dc 0%,#f8e6ae 48%,#fff4cf 100%);
  box-shadow:0 8px 22px rgba(146,102,14,.13);
  text-align:center;
}

.page-title{
  margin:0;
  font-size:28px;
  line-height:1.1;
  font-weight:900;
  color:#111827;
}

.page-subtitle{
  margin-top:5px;
  font-size:13px;
  font-weight:800;
  color:#64748b;
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
  background:#fff;
  padding:12px;
  border-radius:14px;
  box-shadow:0 8px 24px rgba(15,23,42,.08);
  margin-bottom:14px;
}

.toolbar input,
.toolbar select{
  height:40px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  padding:0 10px;
  font-size:12px;
  font-weight:800;
  background:#fff;
  color:#0f172a;
  outline:none;
}

.toolbar input[type="text"]{
  min-width:230px;
  flex:1;
}

.toolbar select{min-width:115px}

.toolbar input:focus,
.toolbar select:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

.action-btn{
  height:40px;
  border:none;
  border-radius:10px;
  padding:0 16px;
  background:#0f172a;
  color:#fff;
  font-size:12px;
  font-weight:900;
  cursor:pointer;
}

.export-btn{background:#166534}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:10px;
  margin-bottom:14px;
}

.stat-card{
  background:#fff;
  border-radius:12px;
  padding:10px 12px;
  box-shadow:0 6px 16px rgba(15,23,42,.08);
  border-left:5px solid #334155;
  min-height:68px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  overflow:hidden;
}

.stat-card.total{border-left-color:#0f172a}
.stat-card.completed{border-left-color:#16a34a}
.stat-card.cancelled{border-left-color:#dc2626}
.stat-card.noshow{border-left-color:#f59e0b}
.stat-card.notcompleted{border-left-color:#64748b}
.stat-card.money{border-left-color:#059669}
.stat-card.miles{border-left-color:#2563eb}

.stat-number{
  font-size:19px;
  font-weight:900;
  line-height:1.05;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.stat-label{
  margin-top:6px;
  font-size:9px;
  color:#475569;
  font-weight:900;
  text-transform:uppercase;
}

.table-wrap{
  width:100%;
  max-width:100%;
  overflow-x:auto;
  overflow-y:visible;
  -webkit-overflow-scrolling:touch;
  background:#fff;
  border-radius:14px;
  box-shadow:0 8px 22px rgba(15,23,42,.08);
  margin-bottom:20px;
}

.summary-table{
  width:100%;
  min-width:1760px;
  table-layout:fixed;
  border-collapse:collapse;
  background:#fff;
  border-top:6px solid #000;
}

.summary-table th,
.summary-table td{
  border:1px solid #dbe3ee;
  padding:5px;
  text-align:center;
  font-size:10.5px;
  vertical-align:middle;
  line-height:1.25;
}

.summary-table th{
  background:#1f2937;
  color:#fff;
  font-weight:900;
  white-space:nowrap;
}

.col-num{width:32px}
.col-trip{width:66px}
.col-broker{width:50px}
.col-broker-trip{width:76px}
.col-service{width:60px}
.col-passenger{width:92px;text-align:left!important}
.col-phone{width:78px;text-align:left!important}
.col-address{width:205px;text-align:left!important}
.col-stops{width:230px;text-align:left!important}
.col-date{width:58px}
.col-time{width:42px}
.col-status{width:88px}
.col-miles{width:46px}
.col-passenger-status{width:94px;text-align:left!important}
.col-fees{width:70px;text-align:left!important}
.col-total{width:68px;text-align:left!important}
.col-trip-price{width:72px;text-align:left!important}
.col-count{width:44px}
.col-eye{width:34px}

.date-row td{
  background:#bfdbfe!important;
  color:#1e3a8a!important;
  font-weight:900!important;
  text-align:center!important;
  padding:6px!important;
  font-size:13px!important;
  border-top:2px solid #60a5fa!important;
  border-bottom:2px solid #60a5fa!important;
}

.trip-divider td{
  border-bottom:3px solid #000!important;
}

.shared-row td{
  background:#ede9fe!important;
}

.completed-row td{box-shadow:inset 0 0 0 9999px rgba(22,163,74,.08)}
.cancelled-row td{box-shadow:inset 0 0 0 9999px rgba(220,38,38,.07)}
.noshow-row td{box-shadow:inset 0 0 0 9999px rgba(245,158,11,.08)}
.notcompleted-row td{box-shadow:inset 0 0 0 9999px rgba(100,116,139,.08)}

.cell-box{
  display:grid;
  border:1px solid #111;
  background:#fff;
  width:100%;
  border-radius:4px;
  overflow:hidden;
}

.cell-item{
  padding:4px 5px;
  min-height:21px;
  font-weight:800;
  white-space:normal;
  word-break:break-word;
  background:#fff;
  font-size:10px;
}

.cell-item + .cell-item{
  border-top:1px solid #111;
}

.trip-number-badge{
  font-weight:900;
  color:#1d4ed8;
  font-size:9.5px;
  word-break:break-word;
}

.status-pill{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:4px 6px;
  border-radius:999px;
  font-size:9.5px;
  font-weight:900;
  border:1px solid #cbd5e1;
  white-space:nowrap;
}

.status-pill.completed{background:#bbf7d0;color:#14532d;border-color:#86efac}
.status-pill.cancelled{background:#fecaca;color:#7f1d1d;border-color:#fca5a5}
.status-pill.noshow{background:#fde68a;color:#78350f;border-color:#fcd34d}
.status-pill.notcompleted{background:#e5e7eb;color:#374151;border-color:#cbd5e1}
.status-pill.mixed{background:#ddd6fe;color:#4c1d95;border-color:#c4b5fd}

.pricing-error{
  display:inline-block;
  margin-top:3px;
  color:#b91c1c;
  font-size:8.5px;
  font-weight:900;
}

.eye-btn{
  border:none;
  background:transparent;
  color:#2563eb;
  width:28px;
  height:24px;
  cursor:pointer;
  font-size:17px;
  font-weight:900;
}

.view-overlay{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.55);
  z-index:99999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.view-box{
  background:#fff;
  width:min(760px,96vw);
  max-height:90vh;
  overflow:auto;
  border-radius:15px;
  box-shadow:0 20px 60px rgba(0,0,0,.28);
}

.view-head{
  position:sticky;
  top:0;
  background:#2563eb;
  color:#fff;
  padding:12px 15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:900;
}

.view-close{
  border:none;
  background:#fff;
  color:#0f172a;
  width:30px;
  height:30px;
  border-radius:50%;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
}

.view-body{
  padding:14px;
  display:grid;
  gap:8px;
}

.view-line{
  display:grid;
  grid-template-columns:170px 1fr;
  border:1px solid #e2e8f0;
  border-radius:9px;
  overflow:hidden;
}

.view-label{
  background:#f1f5f9;
  padding:9px;
  font-weight:900;
  color:#334155;
}

.view-value{
  padding:9px;
  font-weight:800;
  color:#0f172a;
  word-break:break-word;
  white-space:pre-line;
}

.empty-state{
  background:#fff;
  border-radius:14px;
  padding:30px;
  text-align:center;
  font-weight:900;
  color:#64748b;
}


.summary-table .col-date,
.summary-table .col-time{
  white-space:nowrap;
  font-size:9.5px;
}

.summary-table td.col-broker .cell-item,
.summary-table td.col-broker-trip .cell-item,
.summary-table td.col-service .cell-item{
  padding:3px 4px;
  font-size:9px;
  line-height:1.12;
}

.summary-table td.col-fees .cell-item,
.summary-table td.col-total .cell-item,
.summary-table td.col-trip-price .cell-item{
  text-align:right;
  white-space:nowrap;
  padding:3px 4px;
}

.trip-total-box{
  font-weight:900;
}


@media(max-width:1200px){
  .stats-grid{grid-template-columns:repeat(4,1fr)}
}

@media(max-width:768px){
  .page-body{padding:10px 8px 20px}
  .page-head{min-height:72px;padding:12px}
  .page-title{font-size:22px}
  .page-subtitle{font-size:11px}
  .toolbar{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px}
  .toolbar input[type="text"]{grid-column:1/-1}
  .toolbar input,.toolbar select,.action-btn{width:100%;min-width:0;height:34px;font-size:10.5px}
  .stats-grid{grid-template-columns:repeat(2,1fr);gap:7px}
  .summary-table th,.summary-table td{font-size:9px;padding:4px}
  .cell-item{font-size:8.8px;padding:3px 4px}
  .view-line{grid-template-columns:1fr}
}

@media print{
  @page{size:landscape;margin:6mm}
  #adminHeader,.toolbar,.eye-btn,.col-eye{display:none!important}
  .page-body{padding:8px!important}
  .table-wrap{box-shadow:none!important;overflow:visible!important}
  .summary-table{min-width:0!important;width:100%!important}
  .summary-table th,.summary-table td{font-size:5.5px!important;padding:1.4px!important;border:1px solid #000!important}
  .cell-item{font-size:5.5px!important;padding:1.2px!important}
}
</style>
</head>

<body>

<div id="adminHeader"></div>

<div class="page-body">

  <div class="page-head">
    <div>
      <h1 class="page-title">Broker Summary</h1>
      <div class="page-subtitle">
        Closed broker trips financial review by broker, service, passenger, status, miles and revenue.
      </div>
    </div>
  </div>

  <div class="toolbar">
    <input id="searchInput" type="text" placeholder="Search trip, broker, passenger, phone, pickup, dropoff...">

    <select id="brokerFilter">
      <option value="">All Brokers</option>
    </select>

    <select id="serviceFilter">
      <option value="">All Services</option>
      <option value="ST">Standard</option>
      <option value="WH">Wheelchair</option>
      <option value="SH">Shared</option>
      <option value="TX">Taxi</option>
      <option value="LM">Limousine</option>
      <option value="XL">XL</option>
    </select>

    <select id="statusFilter">
      <option value="">All Status</option>
      <option value="Completed">Completed</option>
      <option value="Cancelled">Cancelled</option>
      <option value="No Show">No Show</option>
      <option value="Not Completed">Not Completed</option>
      <option value="Mixed Closed">Mixed Closed</option>
    </select>

    <input id="fromDate" type="date">
    <input id="toDate" type="date">

    <button id="applyBtn" class="action-btn" type="button">Apply</button>
    <button id="printBtn" class="action-btn" type="button">Print</button>
    <button id="csvBtn" class="action-btn export-btn" type="button">CSV</button>
    <button id="excelBtn" class="action-btn export-btn" type="button">Excel</button>
  </div>

  <div class="stats-grid">
    <div class="stat-card total"><div class="stat-number" id="totalTrips">0</div><div class="stat-label">Total Closed</div></div>
    <div class="stat-card completed"><div class="stat-number" id="completedTrips">0</div><div class="stat-label">Completed</div></div>
    <div class="stat-card cancelled"><div class="stat-number" id="cancelledTrips">0</div><div class="stat-label">Cancelled</div></div>
    <div class="stat-card noshow"><div class="stat-number" id="noShowTrips">0</div><div class="stat-label">No Show</div></div>
    <div class="stat-card notcompleted"><div class="stat-number" id="notCompletedTrips">0</div><div class="stat-label">Not Completed</div></div>
    <div class="stat-card money"><div class="stat-number" id="totalRevenue">$0.00</div><div class="stat-label">Broker Revenue</div></div>
    <div class="stat-card miles"><div class="stat-number" id="totalMiles">0.0</div><div class="stat-label">Total Miles</div></div>
  </div>

  <div id="summaryContent"></div>

</div>

<script src="/admin/header.js"></script>
<script src="/admin/js/external-summary.js"></script>

</body>
</html>
