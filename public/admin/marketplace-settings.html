<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Marketplace Settings | GH Mobility</title>
  <link rel="stylesheet" href="/admin/style.css">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f9;color:#151515}#adminHeader{width:100%;z-index:1000}
    .page{max-width:1280px;margin:26px auto;padding:0 18px 40px}.card{background:#fff;border:1px solid #e2e5ea;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
    label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}input,select{width:100%;padding:10px 11px;border:1px solid #cfd4dc;border-radius:8px;background:#fff}.checks{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin:8px 0 14px}.checks label{margin:0;display:flex;gap:7px;align-items:center}.checks input{width:auto}
    button{border:0;border-radius:8px;padding:11px 18px;font-weight:900;cursor:pointer}.gold{background:linear-gradient(180deg,#f6c85f,#d79a00);color:#241900}.muted{color:#6a717d;font-size:13px}#message{margin-left:10px;font-weight:700}
    @media(max-width:900px){.grid2,.row{grid-template-columns:1fr}.page{padding:0 10px 30px}}
  </style>
</head>
<body>
  <div id="adminHeader"></div>
  <main class="page">
    <section style="background:#f5d77a;border:1px solid #d9ad2b;border-radius:10px;padding:13px;text-align:center;margin-bottom:16px">
      <div style="font-size:22px;font-weight:900">Marketplace Settings</div>
      <div style="font-size:13px;margin-top:4px">Long and Short engine settings only</div>
    </section>
    <section class="grid2">
      <div class="card" id="longEngine"><h2 style="margin-top:0">Long Trips Engine</h2></div>
      <div class="card" id="shortEngine"><h2 style="margin-top:0">Short Trips Engine</h2></div>
    </section>
    <section class="card"><button id="saveBtn" class="gold" type="button">Save Marketplace Settings</button><span id="message" class="muted"></span></section>
  </main>
  <script src="/admin/header.js"></script>
  <script src="/admin/js/marketplace-settings.js"></script>
</body>
</html>
