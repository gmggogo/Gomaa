<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Marketplace Settings - GH Mobility</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f5f6f8;color:#111;font-family:Arial,sans-serif}
    .page{width:min(1500px,calc(100% - 24px));margin:86px auto 30px}
    .title{background:#fff8df;border:1px solid #d9ad2b;border-radius:12px;padding:14px;text-align:center;margin-bottom:16px}
    .title h1{margin:0;font-size:24px}
    .title p{margin:5px 0 0;color:#666;font-size:13px}
    .card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;margin-bottom:16px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
    label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}
    input,select{width:100%;padding:10px;border:1px solid #cfd4da;border-radius:8px;font-size:14px;background:#fff}
    .checks{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:12px}
    .checks label{display:flex;align-items:center;gap:7px;margin:0}
    .checks input{width:auto}
    .note{font-size:12px;color:#667085;margin-top:7px;line-height:1.45}
    .gold{background:#d7a400;border:0;border-radius:8px;padding:11px 18px;font-weight:900;cursor:pointer}
    .engine-title{display:flex;justify-content:space-between;align-items:center}
    .engine-title h2{margin:0}
    .section-label{font-weight:900;margin-top:16px;border-top:1px solid #eee;padding-top:14px}
    .msg{margin-left:12px;font-size:13px;color:#555}
    @media(max-width:900px){.grid2,.row{grid-template-columns:1fr}.page{margin-top:76px}}
  </style>
</head>
<body>
  <main class="page">
    <section class="title">
      <h1>Marketplace Settings</h1>
      <p>All automatic marketplace trips must pass these filters before they can match.</p>
    </section>

    <section class="card">
      <div class="checks">
        <label><input id="enabled" type="checkbox"> Marketplace Enabled</label>
        <label>Total Daily Limit <input id="totalDailyTripLimit" type="number" min="0" value="0" style="width:100px"></label>
      </div>
      <div class="note">
        The Browser Agent evaluates new trips automatically as soon as they are discovered.
        The manual button on Marketplace is only a test/re-evaluation tool.
      </div>
    </section>

    <section class="grid2">
      <div class="card" id="longEngine">
        <div class="engine-title"><h2>Long Trips Engine</h2></div>
      </div>
      <div class="card" id="shortEngine">
        <div class="engine-title"><h2>Short Trips Engine</h2></div>
      </div>
    </section>

    <section class="card">
      <button id="saveBtn" class="gold" type="button">Save Marketplace Settings</button>
      <span id="message" class="msg"></span>
    </section>
  </main>

  <script src="/admin/header.js"></script>
  <script src="/admin/js/marketplace-settings.js"></script>
</body>
</html>
