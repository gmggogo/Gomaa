<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Form Pricing - GH Mobility</title><link rel="stylesheet" href="style.css"><style>body{margin:0;background:#f4f6f9;font-family:Arial;color:#1f2937}.wrap{padding:24px}.head{text-align:center;margin:16px 24px;padding:20px;border:1px solid #e0be5a;border-radius:18px;background:#fff4cf;font-size:28px;font-weight:900}.layout{display:grid;grid-template-columns:260px 1fr;gap:18px}.card{background:#fff;border:1px solid #d9dee7;border-radius:12px;padding:16px}.template{width:100%;text-align:left;margin:0 0 8px;padding:11px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer}.template.active{background:#263238;color:#fff}.service{display:grid;grid-template-columns:1.2fr .8fr repeat(4,.7fr);gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.service input,.service select{padding:8px;border:1px solid #ccd2db;border-radius:7px;width:100%}.save{margin-top:15px;background:#c99a2e;color:#fff;border:0;border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer}@media(max-width:900px){.layout{grid-template-columns:1fr}.service{grid-template-columns:1fr 1fr}}</style></head><body><div id="adminHeader"></div><div class="head">Smart Form Pricing</div><main class="wrap"><div class="layout"><aside class="card"><h3>Templates</h3><div id="templates"></div></aside><section class="card"><h3 id="title">Select a template</h3><div id="services"></div><button id="save" class="save" hidden>Save Pricing</button></section></div></main><script src="header.js"></script><script src="js/smart-form-pricing.js"></script></body></html>
