<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTM Marketplace Settings | GH Mobility</title>
  <link rel="stylesheet" href="/admin/header.css">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f4f6f9;color:#151515}
    .page{max-width:1280px;margin:26px auto;padding:0 18px 40px}
    .card{background:#fff;border:1px solid #e2e5ea;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
    .card h2{margin:0 0 14px;font-size:20px}
    .sub{color:#69707d;font-size:13px;margin-top:-6px;margin-bottom:16px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
    label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}
    input,select{width:100%;padding:10px 11px;border:1px solid #cfd4dc;border-radius:8px;background:#fff}
    .checks{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin:8px 0 14px}
    .checks label{margin:0;display:flex;gap:7px;align-items:center}
    .checks input{width:auto}
    button{border:0;border-radius:8px;padding:11px 18px;font-weight:900;cursor:pointer}
    .gold{background:linear-gradient(180deg,#f6c85f,#d79a00);color:#241900}
    .dark{background:#171717;color:#fff}
    .danger{background:#8f1d1d;color:#fff}
    .muted{color:#6a717d;font-size:13px}
    .connection-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
    .badge{display:inline-flex;align-items:center;padding:7px 11px;border-radius:999px;font-weight:900;font-size:12px;background:#eceff3}
    .badge.ok{background:#dff5e5;color:#126b2e}.badge.warn{background:#fff0c7;color:#7a5200}.badge.bad{background:#fde1e1;color:#8a1616}
    .login-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
    .verification{display:none;margin-top:12px;padding:12px;border:1px solid #e4c469;background:#fff9e8;border-radius:10px}
    .engine-title{display:flex;justify-content:space-between;align-items:center;gap:12px}
    #message{margin-left:10px;font-weight:700}
    @media(max-width:900px){.grid2,.row,.login-grid{grid-template-columns:1fr}.page{padding:0 10px 30px}}
  </style>
</head>
<body>
  <div id="adminHeader"></div>

  <main class="page">
    <section class="card">
      <h2>MTM Provider Portal Connection</h2>
      <div class="sub">Authorized provider login only. GH never bypasses MTM MFA and never stores an OTP.</div>
      <div class="connection-line">
        <span>Connection Status:</span>
        <span id="connectionStatus" class="badge bad">DISCONNECTED</span>
        <span id="connectionMessage" class="muted"></span>
      </div>

      <div class="login-grid">
        <div>
          <label for="mtmUsername">MTM Username</label>
          <input id="mtmUsername" autocomplete="username" placeholder="Provider Portal username">
        </div>
        <div>
          <label for="mtmPassword">MTM Password</label>
          <input id="mtmPassword" type="password" autocomplete="current-password" placeholder="Password is sent only when Connect is pressed">
        </div>
        <button id="connectBtn" class="gold" type="button">Connect MTM</button>
      </div>

      <div id="verificationBox" class="verification">
        <label for="verificationCode">MTM Verification Code</label>
        <div class="login-grid">
          <input id="verificationCode" inputmode="numeric" autocomplete="one-time-code" placeholder="Enter the SMS code requested by MTM">
          <button id="verifyBtn" class="gold" type="button">Verify</button>
          <button id="cancelVerifyBtn" class="dark" type="button">Cancel</button>
        </div>
      </div>

      <div style="margin-top:12px">
        <button id="disconnectBtn" class="danger" type="button">Disconnect MTM</button>
      </div>
    </section>

    <section class="card">
      <h2>Marketplace General Settings</h2>
      <div class="row">
        <div>
          <label for="connectionMethod">Connection Method</label>
          <select id="connectionMethod">
            <option value="MTM_PORTAL">MTM Provider Portal</option>
            <option value="MTM_API">Official MTM API (future)</option>
          </select>
        </div>
        <div>
          <label for="dateWindowDays">Search Next Days</label>
          <input id="dateWindowDays" type="number" min="1" max="31" value="7">
        </div>
      </div>
      <div class="checks">
        <label><input id="enabled" type="checkbox"> Marketplace Enabled</label>
        <label>Total Daily Limit <input id="totalDailyTripLimit" type="number" min="0" value="0" style="width:95px"></label>
      </div>
    </section>

    <section class="grid2">
      <div class="card" id="longEngine"><div class="engine-title"><h2>Long Trips Engine</h2></div></div>
      <div class="card" id="shortEngine"><div class="engine-title"><h2>Short Trips Engine</h2></div></div>
    </section>

    <section class="card">
      <button id="saveBtn" class="gold" type="button">Save MTM Settings</button>
      <span id="message" class="muted"></span>
    </section>
  </main>

  <script src="/admin/header.js"></script>
  <script src="/admin/js/mtm-marketplace-settings.js"></script>
</body>
</html>
