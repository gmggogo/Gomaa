<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Smart Forms Organizations</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f5f8;color:#18202b}.page{width:min(1200px,calc(100% - 32px));margin:28px auto}.head{padding:22px;border-radius:14px;color:#fff;background:linear-gradient(135deg,#173f66,#0d3155)}.card{margin-top:16px;border:1px solid #dbe3ea;border-radius:12px;background:#fff;overflow:hidden}.card-head{padding:14px 16px;border-bottom:1px solid #e3e9ee;background:#fafcfd;font-weight:900}.body{padding:16px}.grid{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:end}label{display:block;margin-bottom:6px;font-size:12px;font-weight:900}input,select{width:100%;min-height:42px;padding:9px 10px;border:1px solid #cbd6df;border-radius:8px;background:#fff}button{min-height:42px;padding:9px 14px;border:0;border-radius:8px;font-weight:900;cursor:pointer}.primary{color:#fff;background:#173f66}.danger{color:#fff;background:#ad3131}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #e8edf1;text-align:left}th{background:#f5f8fa;font-size:11px;text-transform:uppercase}.message{display:none;margin-top:12px;padding:10px;border-radius:8px;font-weight:800}.message.show{display:block}.ok{background:#d8f4e6}.err{background:#fae1e1}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="page">
<section class="head"><h1>Smart Forms Organizations</h1><p>Platform Admin controls the paid organizations available to each company.</p></section>
<div id="message" class="message"></div>
<section class="card"><div class="card-head">Company</div><div class="body"><label>Select Company</label><select id="tenantSelect"></select></div></section>
<section class="card"><div class="card-head">Add Organization</div><div class="body"><div class="grid">
<div><label>Name</label><input id="organizationName" placeholder="Aetna"></div>
<div><label>Type</label><select id="organizationType"><option value="INSURANCE">Insurance</option><option value="BROKER">Broker</option><option value="FACILITY">Facility</option><option value="COMPANY">Company</option><option value="OTHER">Other</option></select></div>
<div><label>Code</label><input id="organizationCode" placeholder="AET"></div>
<button id="addBtn" class="primary">+ Add</button>
</div></div></section>
<section class="card"><div class="card-head">Organizations</div><div class="body" style="overflow:auto"><table><thead><tr><th>Name</th><th>Type</th><th>Code</th><th>Status</th><th>Actions</th></tr></thead><tbody id="organizationBody"></tbody></table></div></section>
</main>
<script src="/platform-admin/smart-form-organizations.js"></script>
</body>
</html>
