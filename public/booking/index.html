<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Booking – Sunbeam Transportation</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="/core/branding.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{

  font-family:Arial;

  background:linear-gradient(135deg,#dbeafe,#eff6ff);

  margin:0;

  padding:20px;

  color:#111827;

}

.box{

  background:#eff6ff;

  padding:20px;

  border:1px solid #bfdbfe;

  border-radius:14px;

  max-width:750px;

  margin:auto;

  box-shadow:0 5px 20px rgba(0,0,0,.08);

  position:relative;

}

.langBox{

  position:absolute;

  top:15px;

  right:15px;

  display:flex;

  gap:6px;

}

.langBox button{

  padding:3px 8px;

  font-size:11px;

  border-radius:20px;

  border:1px solid #cbd5e1;

  background:#f1f5f9;

  cursor:pointer;

}

.langBox .active{

  background:#2563eb;

  color:#fff;

}

h2{
  margin-top:0;
}

label{

  margin-top:12px;

  display:block;

  font-size:13px;

  font-weight:bold;

}

input,
textarea{

  width:100%;

  padding:12px;

  margin-top:5px;

  border:1px solid #93c5fd;

  border-radius:9px;

  font-size:16px;

  background:#ffffff;

  box-shadow:0 2px 7px rgba(37,99,235,.08);

}

textarea{
  min-height:90px;
}

.row{

  display:flex;

  gap:10px;

}

.row div{
  flex:1;
}

.actions{

  margin-top:20px;

  display:flex;

  gap:10px;

}

button{

  flex:1;

  padding:14px;

  border:none;

  border-radius:8px;

  cursor:pointer;

  font-weight:bold;

  font-size:15px;

}

.recalc{
  background:#dc2626;
  color:#fff;
}

.confirm{
  background:#2563eb;
  color:#fff;
}

.confirm:disabled{

  opacity:.7;

  cursor:not-allowed;

}

.vehicleBox{

  margin-top:5px;

  padding:12px;

  background:linear-gradient(135deg,#2563eb,#1d4ed8);

  color:#ffffff;

  border:1px solid #1d4ed8;

  border-radius:9px;

  font-weight:bold;

  box-shadow:0 4px 12px rgba(37,99,235,.22);

  text-align:center;

  font-size:16px;

}

.result{

  margin-top:20px;

  padding:15px;

  background:#ecfdf5;

  border:1px solid #22c55e;

  border-radius:10px;

  text-align:center;

  display:none;

}



/* =========================
   DYNAMIC BOOKING DATA
   Additive only — existing page logic remains unchanged.
========================= */

.dynamicBookingSection{
  display:none;
  margin-top:16px;
  padding-top:4px;
}

.dynamicBookingSection.show{
  display:block;
}

.dynamicBookingTitle{
  margin:8px 0 2px;
  padding:9px 11px;
  border-radius:8px;
  background:#dbeafe;
  border:1px solid #60a5fa;
  color:#1e3a8a;
  font-size:13px;
  font-weight:bold;
}

.dynamicBookingGrid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:0 10px;
}

.dynamicField.full{
  grid-column:1 / -1;
}

.dynamicRequired{
  color:#dc2626;
  margin-left:3px;
}

.dynamicField select{
  width:100%;
  padding:12px;
  margin-top:5px;
  border:1px solid #93c5fd;
  border-radius:9px;
  font-size:16px;
  background:#fff;
  box-shadow:0 2px 7px rgba(37,99,235,.08);
}

.dynamicField input:focus,
.dynamicField textarea:focus,
.dynamicField select:focus{
  outline:none;
  border-color:#2563eb;
  box-shadow:0 0 0 2px rgba(37,99,235,.10);
}

@media(max-width:620px){
  .dynamicBookingGrid{
    grid-template-columns:1fr;
  }

  .dynamicField.full{
    grid-column:auto;
  }
}

</style>
</head>

<body>

<div class="box">

  <div class="langBox">

    <button
      id="enBtn"
      onclick="setLang('en')"
    >
      English
    </button>

    <button
      id="esBtn"
      onclick="setLang('es')"
    >
      Español
    </button>

  </div>

  <h2 id="title">
    Confirm Booking
  </h2>

  <label id="pickupL">
    Pickup
  </label>

  <input
    id="pickup"
    readonly
  >

  <div id="stopsBox"></div>

  <label id="dropoffL">
    Dropoff
  </label>

  <input
    id="dropoff"
    readonly
  >

  <div class="row">

    <div>

      <label id="distanceL">
        Distance
      </label>

      <input
        id="miles"
        readonly
      >

    </div>

    <div>

      <label id="priceL">
        Price
      </label>

      <input
        id="price"
        readonly
      >

    </div>

  </div>

  <label id="vehicleL">
    Service Type
  </label>

  <div
    id="vehicleDisplay"
    class="vehicleBox"
  ></div>

  <label>
    Client Name
  </label>

  <input id="name">

  <label>
    Phone
  </label>

  <input id="phone">

  <label>
    Email
  </label>

  <input
    id="email"
    type="email"
  >

  <div class="row">

    <div>

      <label>
        Date
      </label>

      <input
        type="date"
        id="date"
      >

    </div>

    <div>

      <label>
        Time
      </label>

      <input
        type="time"
        id="time"
      >

    </div>

  </div>

  <div
    id="dynamicBookingSection"
    class="dynamicBookingSection"
  >
    <div class="dynamicBookingTitle">
      Additional Booking Information
    </div>

    <div
      id="dynamicBookingGrid"
      class="dynamicBookingGrid"
    ></div>
  </div>

  <label>
    Notes
  </label>

  <textarea id="notes"></textarea>


  <div class="actions">

    <button
      class="recalc"
      onclick="recalculate()"
    >
      Recalculate
    </button>

    <button
      class="confirm"
      onclick="confirmBooking()"
      id="payBtn"
    >
      Pay Now
    </button>

  </div>

  <div
    id="resultBox"
    class="result"
  ></div>

</div>

<script>

/* =========================
   TENANT CONTEXT
========================= */

const pageParams =
new URLSearchParams(
  window.location.search
);

function cleanTenantSlug(value){

  return String(value || "")
    .trim()
    .toLowerCase();

}

function resolveTenantSlug(){

  const fromQuery =
  cleanTenantSlug(
    pageParams.get("tenant") ||
    pageParams.get("tenantSlug")
  );

  if(fromQuery){
    return fromQuery;
  }

  try{

    const pending =
    JSON.parse(
      localStorage.getItem(
        "pendingTrip"
      ) || "null"
    );

    const fromTrip =
    cleanTenantSlug(
      pending?.tenantSlug ||
      pending?.tenant ||
      ""
    );

    if(fromTrip){
      return fromTrip;
    }

  }catch(err){
    console.log(err);
  }

  return cleanTenantSlug(
    localStorage.getItem(
      "tenantSlug"
    ) || ""
  );

}

const TENANT_SLUG =
resolveTenantSlug();

if(TENANT_SLUG){

  localStorage.setItem(
    "tenantSlug",
    TENANT_SLUG
  );

}

/* =========================
   LANGUAGE
========================= */

let lang = "en";

function setLang(l){

  lang = l;

  applyLang();

}

function applyLang(){

  if(lang === "es"){

    title.innerText =
    "Confirmar Reserva";

    pickupL.innerText =
    "Origen";

    dropoffL.innerText =
    "Destino";

    distanceL.innerText =
    "Distancia";

    priceL.innerText =
    "Precio";

    vehicleL.innerText =
    "Servicio";

    payBtn.innerText =
    "Pagar";

  }

  else{

    title.innerText =
    "Confirm Booking";

    pickupL.innerText =
    "Pickup";

    dropoffL.innerText =
    "Dropoff";

    distanceL.innerText =
    "Distance";

    priceL.innerText =
    "Price";

    vehicleL.innerText =
    "Service Type";

    payBtn.innerText =
    "Pay Now";

  }

  enBtn.classList.toggle(
    "active",
    lang === "en"
  );

  esBtn.classList.toggle(
    "active",
    lang === "es"
  );

}

applyLang();

/* =========================
   LOAD
========================= */

const tripData = JSON.parse(
  localStorage.getItem(
    "pendingTrip"
  )
);

if(!tripData){

  alert("Session expired");

  location.href =
  TENANT_SLUG
    ? `/getquote/index.html?tenant=${encodeURIComponent(TENANT_SLUG)}`
    : "/getquote/index.html";

}

if(TENANT_SLUG){

  tripData.tenantSlug =
  TENANT_SLUG;

  localStorage.setItem(
    "pendingTrip",
    JSON.stringify(
      tripData
    )
  );

}

/* =========================
   FILL
========================= */

pickup.value =
tripData.pickup || "";

dropoff.value =
tripData.dropoff || "";

miles.value =
tripData.distance || "";

price.value =
tripData.price || "";

/* =========================
   SERVICE FIX
========================= */

const raw = String(

  tripData.serviceKey ||

  tripData.vehicleType ||

  ""

).trim().toUpperCase();

const SERVICE_MAP = {

  STANDARD:"STANDARD",

  WHEELCHAIR:"WHEELCHAIR",

  WHEEL:"WHEELCHAIR",

  XL:"XL",

  TAXI:"TAXI",

  LIMO:"LIMO",

  LIMOSINE:"LIMO"

};

const serviceKey =

SERVICE_MAP[raw] ||

raw ||

"STANDARD";

vehicleDisplay.innerText =
serviceKey;

/* =========================
   STOPS
========================= */

function renderStops(){

  const box =
  document.getElementById(
    "stopsBox"
  );

  box.innerHTML = "";

  if(Array.isArray(tripData.stops)){

    tripData.stops.forEach((s,i)=>{

      box.innerHTML += `

        <label>
          Stop ${i+1}
        </label>

        <input
          value="${s}"
          readonly
        >

      `;

    });

  }

}

renderStops();

/* =========================
   SYSTEM TIME
========================= */

function getSystemTime(){

  const timezone =

    localStorage.getItem(
      "systemTimezone"
    ) ||

    "America/Phoenix";

  return new Date(

    new Date().toLocaleString(
      "en-US",
      {
        timeZone:timezone
      }
    )

  );

}

/* =========================
   MINUTES UNTIL
========================= */

function minutesUntilTrip(
  date,
  time
){

  const now =
  getSystemTime();

  const parts =
  date.split("-");

  const trip =
  new Date(

    Number(parts[0]),

    Number(parts[1]) - 1,

    Number(parts[2]),

    Number(
      time.split(":")[0]
    ),

    Number(
      time.split(":")[1]
    )

  );

  return (

    trip.getTime()

    -

    now.getTime()

  ) / 60000;

}


/* =========================
   DYNAMIC BOOKING DATA
   GET QUOTE ONLY

   This layer only adds fields configured by Platform Admin.
   Existing pricing, service, route, payment and trip flow are unchanged.
========================= */

let GET_QUOTE_DYNAMIC_FIELDS = [];

/*
  These values already have permanent controls on this page.
  Never render a duplicate dynamic input for them.
*/
const EXISTING_GET_QUOTE_FIELD_KEYS =
new Set([
  "tripNumber",
  "clientName",
  "clientPhone",
  "clientEmail",
  "pickup",
  "stops",
  "dropoff",
  "tripDate",
  "tripTime",
  "notes",
  "serviceType"
]);

function bookingDataApiUrl(){

  if(TENANT_SLUG){

    return (
      "/api/public/tenant/" +
      encodeURIComponent(TENANT_SLUG) +
      "/booking-data/get-quote"
    );
  }

  return (
    "/api/public/tenant/default/" +
    "booking-data/get-quote"
  );
}

function dynamicInputType(
  fieldType
){

  const type =
  String(
    fieldType || "TEXT"
  )
  .trim()
  .toUpperCase();

  if(type === "NUMBER") return "number";
  if(type === "DATE") return "date";
  if(type === "TIME") return "time";
  if(type === "PHONE") return "tel";
  if(type === "EMAIL") return "email";

  return "text";
}

function dynamicElementId(field){

  if(
    field.source === "CUSTOM" &&
    Number(field.slot)
  ){
    return (
      "booking_custom_" +
      Number(field.slot)
    );
  }

  return (
    "booking_standard_" +
    String(field.key || "")
      .replace(
        /[^a-zA-Z0-9_-]/g,
        "_"
      )
  );
}

function createDynamicField(
  field
){

  const wrap =
  document.createElement("div");

  wrap.className =
    "dynamicField";

  if(
    String(field.fieldType || "")
      .toUpperCase() === "LONG_TEXT"
  ){
    wrap.classList.add("full");
  }

  const label =
  document.createElement("label");

  label.htmlFor =
    dynamicElementId(field);

  label.textContent =
    field.label || "Additional Information";

  if(field.required === true){

    const star =
    document.createElement("span");

    star.className =
      "dynamicRequired";

    star.textContent = " *";

    label.appendChild(star);
  }

  let input;

  const fieldType =
  String(
    field.fieldType || "TEXT"
  )
  .trim()
  .toUpperCase();

  if(fieldType === "LONG_TEXT"){

    input =
    document.createElement(
      "textarea"
    );

  }
  else if(fieldType === "DROPDOWN"){

    input =
    document.createElement(
      "select"
    );

    const emptyOption =
    document.createElement(
      "option"
    );

    emptyOption.value = "";
    emptyOption.textContent =
      field.required === true
        ? "Select..."
        : "Select (optional)...";

    input.appendChild(
      emptyOption
    );

    (
      Array.isArray(field.options)
        ? field.options
        : []
    )
    .forEach(option=>{

      const el =
      document.createElement(
        "option"
      );

      el.value =
        String(option);

      el.textContent =
        String(option);

      input.appendChild(el);
    });

  }
  else if(fieldType === "YES_NO"){

    input =
    document.createElement(
      "select"
    );

    const emptyOption =
    document.createElement(
      "option"
    );

    emptyOption.value = "";
    emptyOption.textContent =
      field.required === true
        ? "Select..."
        : "Select (optional)...";

    input.appendChild(
      emptyOption
    );

    [
      ["Yes","Yes"],
      ["No","No"]
    ]
    .forEach(([value,text])=>{

      const el =
      document.createElement(
        "option"
      );

      el.value = value;
      el.textContent = text;

      input.appendChild(el);
    });

  }
  else{

    input =
    document.createElement(
      "input"
    );

    input.type =
      dynamicInputType(
        fieldType
      );
  }

  input.id =
    dynamicElementId(field);

  input.dataset.bookingField =
    "true";

  input.dataset.bookingKey =
    field.key || "";

  input.dataset.bookingLabel =
    field.label || "";

  input.dataset.bookingSource =
    field.source || "";

  input.dataset.bookingSlot =
    field.slot || "";

  input.dataset.bookingType =
    fieldType;

  input.dataset.bookingRequired =
    field.required === true
      ? "true"
      : "false";

  if(field.placeholder){
    input.placeholder =
      field.placeholder;
  }

  if(field.required === true){
    input.required = true;
  }

  wrap.appendChild(label);
  wrap.appendChild(input);

  return wrap;
}

function renderDynamicBookingFields(){

  const section =
  document.getElementById(
    "dynamicBookingSection"
  );

  const grid =
  document.getElementById(
    "dynamicBookingGrid"
  );

  if(
    !section ||
    !grid
  ){
    return;
  }

  grid.innerHTML = "";

  const visible =
  GET_QUOTE_DYNAMIC_FIELDS
  .filter(field=>{

    const key =
    String(
      field?.key || ""
    ).trim();

    return (
      field &&
      field.label &&
      !EXISTING_GET_QUOTE_FIELD_KEYS
        .has(key)
    );
  });

  if(!visible.length){

    section.classList.remove(
      "show"
    );

    return;
  }

  visible.forEach(field=>{

    grid.appendChild(
      createDynamicField(field)
    );
  });

  section.classList.add(
    "show"
  );
}

async function loadDynamicBookingFields(){

  try{

    const response =
    await fetch(
      bookingDataApiUrl(),
      {
        cache:"no-store"
      }
    );

    if(!response.ok){

      console.log(
        "BOOKING DATA LOAD SKIPPED:",
        response.status
      );

      GET_QUOTE_DYNAMIC_FIELDS = [];

      renderDynamicBookingFields();

      return;
    }

    const data =
    await response.json();

    GET_QUOTE_DYNAMIC_FIELDS =
      Array.isArray(data?.fields)
        ? data.fields
        : [];

    renderDynamicBookingFields();

  }
  catch(err){

    /*
      Do not block the existing Get Quote flow
      if Booking Data cannot be loaded.
    */
    console.log(
      "GET QUOTE BOOKING DATA ERROR:",
      err
    );

    GET_QUOTE_DYNAMIC_FIELDS = [];

    renderDynamicBookingFields();
  }
}

function collectDynamicBookingData(){

  const fields =
  Array.from(
    document.querySelectorAll(
      '[data-booking-field="true"]'
    )
  );

  return fields.map(input=>({

    source:
      input.dataset.bookingSource ||
      "",

    key:
      input.dataset.bookingKey ||
      "",

    slot:
      Number(
        input.dataset.bookingSlot ||
        0
      ) || null,

    label:
      input.dataset.bookingLabel ||
      "",

    fieldType:
      input.dataset.bookingType ||
      "TEXT",

    required:
      input.dataset.bookingRequired ===
      "true",

    value:
      String(
        input.value ?? ""
      ).trim()

  }));
}

function validateDynamicBookingData(){

  const values =
  collectDynamicBookingData();

  const missing =
  values.find(item =>
    item.required === true &&
    !item.value
  );

  if(missing){

    alert(
      `Please fill ${missing.label}`
    );

    const input =
    Array.from(
      document.querySelectorAll(
        '[data-booking-field="true"]'
      )
    )
    .find(el =>
      (
        el.dataset.bookingKey ||
        ""
      ) === missing.key &&
      (
        Number(
          el.dataset.bookingSlot ||
          0
        ) || null
      ) === missing.slot
    );

    input?.focus();

    return {
      ok:false,
      values
    };
  }

  return {
    ok:true,
    values
  };
}


/* =========================
   RESET
========================= */

function recalculate(){

  localStorage.removeItem(
    "pendingTrip"
  );

  location.href =
  TENANT_SLUG
    ? `/getquote/index.html?tenant=${encodeURIComponent(TENANT_SLUG)}&service=${encodeURIComponent(serviceKey)}`
    : `/getquote/index.html?service=${encodeURIComponent(serviceKey)}`;

}

/* =========================
   SUBMIT
========================= */

async function confirmBooking(){

  const btn =
  document.getElementById(
    "payBtn"
  );

  btn.disabled = true;

  btn.innerText =
  "Processing...";

  const name =
  document.getElementById(
    "name"
  ).value.trim();

  const phone =
  document.getElementById(
    "phone"
  ).value.trim();

  const email =
  document.getElementById(
    "email"
  ).value.trim();

  const date =
  document.getElementById(
    "date"
  ).value;

  const time =
  document.getElementById(
    "time"
  ).value;

  const notes =
  document.getElementById(
    "notes"
  ).value;


  const dynamicBooking =
  validateDynamicBookingData();

  if(!dynamicBooking.ok){

    btn.disabled = false;

    btn.innerText =
    "Pay Now";

    return;
  }

  const customBookingData =
  dynamicBooking.values;

  /* =========================
     CLEAN PRICE
  ========================= */

  const cleanPrice = Number(

    String(tripData.price)
    .replace(/[^0-9.]/g,"")

  );

  /* =========================
     VALIDATION
  ========================= */

  if(

    !name ||
    !phone ||
    !email ||
    !date ||
    !time ||

    !tripData.pickup ||
    !tripData.dropoff ||

    !cleanPrice ||

    String(cleanPrice) === "0"

  ){

    alert(
      "Please fill all required fields"
    );

    btn.disabled = false;

    btn.innerText =
    "Pay Now";

    return;

  }

  /* =========================
     BUILD TRIP DATE
  ========================= */

  const parts =
  date.split("-");

  const tripDateTime =
  new Date(

    Number(parts[0]),

    Number(parts[1]) - 1,

    Number(parts[2]),

    Number(
      time.split(":")[0]
    ),

    Number(
      time.split(":")[1]
    )

  );

  /* =========================
     INVALID DATE
  ========================= */

  if(

    isNaN(
      tripDateTime.getTime()
    )

  ){

    alert(
      "Invalid date/time"
    );

    btn.disabled = false;

    btn.innerText =
    "Pay Now";

    return;

  }

  /* =========================
     PREVENT PAST TIME
  ========================= */

  const now =
  getSystemTime();

  if(

    tripDateTime.getTime()

    <=

    now.getTime()

  ){

    alert(
      "Trip date/time already passed"
    );

    btn.disabled = false;

    btn.innerText =
    "Pay Now";

    return;

  }

  /* =========================
     DYNAMIC WARNING
  ========================= */

  const tripWarningMinutes =

  Number(

    tripData.warningMinutes ||

    tripData.companyWarningMinutes ||

    localStorage.getItem(
      "tripWarningMinutes"
    )

  ) || 120;

  /* =========================
     CANCEL FEE
  ========================= */

  const cancelFee =

  Number(

    tripData.cancelFee ||

    tripData.companyCancelFee ||

    localStorage.getItem(
      "cancelFee"
    )

  ) || 0;

  const disableCancel =

  ["true","on",true,1,"1"]
  .includes(
    tripData.disableCancel
  );

  const warningEnabled =

  tripData.warningEnabled === true ||

  String(

    tripData.warningEnabled ??

    "enabled"

  )
  .trim()
  .toLowerCase() === "enabled";

  const mins =
  minutesUntilTrip(
    date,
    time
  );

  /* =========================
     WARNING
  ========================= */

if(

  disableCancel === false &&

  warningEnabled === true &&

  mins <= tripWarningMinutes

){

    let warningText = "";

    if(tripWarningMinutes < 60){

      warningText =
      `${tripWarningMinutes} minutes`;

    }

    else{

      const hrs =
      tripWarningMinutes / 60;

      warningText =

      hrs % 1 === 0

      ? `${hrs} hour(s)`

      : `${hrs.toFixed(1)} hour(s)`;

    }

    const ok = confirm(

`WARNING:

This trip is within ${warningText}.

Cancellation Fee:
$${cancelFee.toFixed(2)}

Do you want to continue?`

    );

    if(!ok){

      btn.disabled = false;

      btn.innerText =
      "Pay Now";

      return;

    }

  }

  /* =========================
     DATA
  ========================= */

  const data = {

    type:"individual",

    source:"GET_QUOTE",
    bookingSource:"GET_QUOTE",

    tenantId:
    tripData.tenantId || null,

    tenantSlug:
    TENANT_SLUG ||
    tripData.tenantSlug ||
    "",

    pickup:
    tripData.pickup,

    dropoff:
    tripData.dropoff,

    stops:
    tripData.stops || [],

    /* =========================
       SAVED COORDINATES + ROUTE
       Passed unchanged from Get Quote.
    ========================= */

    pickupLat:
    tripData.pickupLat ?? null,

    pickupLng:
    tripData.pickupLng ?? null,

    dropoffLat:
    tripData.dropoffLat ?? null,

    dropoffLng:
    tripData.dropoffLng ?? null,

    stopCoords:
    Array.isArray(tripData.stopCoords)
      ? tripData.stopCoords
      : [],

    miles:
    Number(tripData.miles || 0),

    distanceMeters:
    Number(tripData.distanceMeters || 0),

    durationSeconds:
    Number(tripData.durationSeconds || 0),

    estimatedMinutes:
    Number(tripData.estimatedMinutes || 0),

    googleRoute:
    tripData.googleRoute || {},

    optimizedRoute:
    tripData.optimizedRoute ||
    tripData.googleRoute ||
    {},

    routePath:
    Array.isArray(tripData.routePath)
      ? tripData.routePath
      : [],

    routePoints:
    Array.isArray(tripData.routePoints)
      ? tripData.routePoints
      : [
          tripData.pickup,
          ...(tripData.stops || []),
          tripData.dropoff
        ],

    routeLocked:
    tripData.routeLocked === true,

    routeFinalized:
    tripData.routeFinalized === true,

    routeSource:
    tripData.routeSource ||
    "getquote-browser-directions",

    priceAmount:
    cleanPrice,

    clientName:
    name,

    clientPhone:
    phone,

    clientEmail:
    email,

    serviceKey:
    serviceKey,

    vehicleTypeFromQuote:
    serviceKey,

    tripDate:
    date,

    tripTime:
    time,

    warningMinutes:
    tripWarningMinutes,

    cancelFee:
    cancelFee,

    disableCancel:
    disableCancel,

    warningEnabled:
    warningEnabled
      ? "enabled"
      : "disabled",

    notes:
    notes,

    /*
      Dynamic Booking Data is additive.
      Existing trip fields remain unchanged.
    */
    customBookingData:
    customBookingData

  };

  /* =========================
     SAVE
  ========================= */

  try{

    const res =
    await fetch(
      "/api/trips",
      {
        method:"POST",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:JSON.stringify(data)
      }
    );

    const trip =
    await res.json();

    console.log(
      "TRIP RESPONSE:",
      trip
    );

    if(

      !trip ||

      !trip._id

    ){

      alert(

        trip.message ||

        "Trip create failed"

      );

      btn.disabled = false;

      btn.innerText =
      "Pay Now";

      return;

    }

    /*
      IMPORTANT:
      The Trip created by the server is only a PENDING PAYMENT draft.
      Do not show "Trip Created Successfully" before Stripe is completed.
      The booking becomes confirmed only after the card is saved successfully.
    */

    location.href =
      TENANT_SLUG
        ? `/booking/payment.html?tripId=${trip._id}&tenant=${encodeURIComponent(TENANT_SLUG)}`
        : `/booking/payment.html?tripId=${trip._id}`;

  }

  catch(err){

    console.log(err);

    alert("Server error");

    btn.disabled = false;

    btn.innerText =
    "Pay Now";

  }

}


/* =========================
   BRANDING
========================= */

window.addEventListener(
  "DOMContentLoaded",
  async ()=>{

    /*
      Load optional Get Quote fields independently.
      A failure here never blocks the current booking flow.
    */
    await loadDynamicBookingFields();

    try{

      if(
        window.Branding &&
        TENANT_SLUG
      ){

        await Branding.load();

        const companyName =
        Branding.getCompanyName?.() ||
        Branding.tenant?.name ||
        "";

        if(companyName){

          document.title =
          `Booking – ${companyName}`;

        }

      }

    }catch(err){

      console.log(
        "BOOKING BRANDING ERROR:",
        err
      );

    }

  }
);

</script>
