<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Get Quote</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  font-family:Arial,sans-serif;
  background:#f8fafc;
  margin:0;
  color:#111827;
}

.page{
  max-width:900px;
  margin:auto;
  padding:15px;
}

@media(max-width:600px){

  .page{
    padding:10px;
  }

  h1{
    font-size:24px;
  }

  #map{
    height:250px;
  }

}

/* ================= HERO ================= */

.hero{
  background:linear-gradient(135deg,#0f172a,#2563eb);
  color:#fff;
  border-radius:20px;
  padding:22px;
  text-align:center;
  position:relative;
  overflow:hidden;
}

.lang-btn{
  position:absolute;
  right:12px;
  top:12px;
  background:#fff;
  color:#111;
  padding:7px 12px;
  border-radius:10px;
  font-size:12px;
  cursor:pointer;
  font-weight:bold;
}

/* ================= PRICING ================= */

.pricing-wrap{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:18px;
}

.pricing-card{
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.20);
  border-radius:18px;
  padding:14px;
  backdrop-filter:blur(6px);
  transition:.25s;
}

.pricing-card.active{
  border:2px solid #fff;
  background:rgba(255,255,255,.18);
  box-shadow:0 0 22px rgba(255,255,255,.20);
  transform:scale(1.02);
}

.pricing-card.last-center{
  grid-column:1 / -1;
  width:48%;
  margin:auto;
}

.pricing-title{
  text-align:center;
  font-size:16px;
  font-weight:900;
  margin-bottom:12px;
  color:#fff;
}

.pricing-table{
  width:100%;
  border-collapse:collapse;
}

.pricing-table th{
  font-size:11px;
  font-weight:700;
  color:#dbeafe;
  padding-bottom:6px;
}

.pricing-table td{
  font-size:13px;
  font-weight:800;
  color:#fff;
  text-align:center;
}

@media(max-width:600px){

  .pricing-wrap{
    grid-template-columns:1fr;
  }

  .pricing-card.last-center{
    width:100%;
  }

  .pricing-table th{
    font-size:10px;
  }

  .pricing-table td{
    font-size:11px;
  }

}

/* ================= CARD ================= */

.card{
  background:#fff;
  border-radius:18px;
  padding:15px;
  margin-top:15px;
  box-shadow:0 5px 18px rgba(0,0,0,0.08);
}

/* ================= INPUT ================= */

input{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-bottom:10px;
  font-size:16px;
  box-sizing:border-box;
}

/* ================= BUTTON ================= */

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  margin-top:8px;
  cursor:pointer;
  transition:.25s;
}

.btn-primary{
  background:#2563eb;
  color:#fff;
}

.btn-success{
  background:#22c55e;
  color:#fff;
}

.btn-stop{
  background:#f97316;
  color:#fff;
}

/* ================= VEHICLES ================= */

.vehicle-pricing{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-bottom:15px;
}

.vehicle-option{
  background:linear-gradient(135deg,#ffffff,#f1f5f9);
  border:2px solid #e2e8f0;
  border-radius:18px;
  padding:14px;
  text-align:center;
  cursor:pointer;
  transition:.25s;
}

.vehicle-option.active{
  border-color:#2563eb;
  background:linear-gradient(135deg,#eff6ff,#dbeafe);
  box-shadow:0 0 20px rgba(37,99,235,.22);
  transform:scale(1.03);
}

.vehicle-option img{
  width:62px;
  height:40px;
  object-fit:contain;
  margin:auto;
  display:block;
  margin-bottom:6px;
}

.vehicle-emoji{
  font-size:34px;
  margin-bottom:6px;
}

.vehicle-option b{
  display:block;
  font-size:14px;
}

.vehicle-pricing .vehicle-option:last-child:nth-child(odd){
  grid-column:1 / -1;
  width:48%;
  margin:auto;
}

@media(max-width:600px){

  .vehicle-pricing{
    grid-template-columns:1fr;
  }

  .vehicle-pricing .vehicle-option:last-child:nth-child(odd){
    width:100%;
  }

}

/* ================= STOP ================= */

.stop-row{
  display:flex;
  gap:6px;
}

.remove-btn{
  background:#ef4444;
  color:#fff;
  width:55px;
  margin-top:0;
  margin-bottom:10px;
}

/* ================= MAP ================= */

#map{
  height:300px;
  border-radius:14px;
}

/* ================= RESULT ================= */

.quote-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:15px;
}

.quote-grid div{
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:#fff;
  padding:14px;
  border-radius:12px;
  text-align:center;
}

.quote-grid b{
  display:block;
  margin-top:6px;
  font-size:20px;
}

#distance{
  color:#60a5fa;
}

#time{
  color:#fb923c;
}

#price{
  color:#4ade80;
}

#stopsCount{
  color:#facc15;
}

.hidden{
  display:none;
}

.loading-services{
  text-align:center;
  padding:20px;
  color:#fff;
}

.btn-success.active{
  animation:blinkBtn .7s infinite;
}

@keyframes blinkBtn{

  0%{
    opacity:1;
  }

  50%{
    opacity:.5;
    box-shadow:0 0 25px #22c55e;
  }

  100%{
    opacity:1;
  }

}

</style>
</head>

<body>

<div class="page">

<div class="hero">

<div
class="lang-btn"
onclick="toggleLang()"
id="langBtn"
>
English / Spanish
</div>

<h1 id="title">
Get Quote
</h1>

<div
style="
margin-top:10px;
font-weight:bold;
font-size:15px;
"
>
Payment Calculation
</div>

<div id="pricing">
Loading Services...
</div>

</div>

<div class="card">

<div
class="vehicle-pricing"
id="vehicleContainer"
>
<div class="loading-services">
Loading...
</div>
</div>

<label id="pickupLabel">
Pickup
</label>

<input id="pickup">

<div id="stops"></div>

<button
class="btn-stop"
onclick="addStop()"
>
+ Add Stop
</button>

<label id="dropLabel">
Dropoff
</label>

<input id="dropoff">

<button
class="btn-primary"
onclick="calculate()"
>
Calculate
</button>

<button
class="btn-success hidden"
id="bookBtn"
onclick="bookTrip()"
>
Booking Now
</button>

<div
id="priceBox"
class="hidden"
>

<div class="quote-grid">

<div>
Distance
<b id="distance"></b>
</div>

<div>
Stops
<b id="stopsCount"></b>
</div>

<div>
Time
<b id="time"></b>
</div>

<div>
Price
<b id="price">$0</b>
</div>

</div>

</div>

</div>

<div class="card">
<div id="map"></div>
</div>

</div>

<script>

let lang = "en";

let selectedService = null;
let servicesData = [];

let currentTenant = null;

function getTenantSlug(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const querySlug =
    String(
      params.get("tenant") ||
      ""
    )
    .trim()
    .toLowerCase();

  if(querySlug){
    return querySlug;
  }

  return String(
    localStorage.getItem(
      "tenantSlug"
    ) || ""
  )
  .trim()
  .toLowerCase();
}

function tenantApiPath(action){

  const slug =
    getTenantSlug();

  if(slug){

    return (
      "/api/public/tenant/" +
      encodeURIComponent(slug) +
      "/" +
      action
    );
  }

  return (
    "/api/public/tenant/default/" +
    action
  );
}

let map;
let directionsService;
let directionsRenderer;

let calculatedRouteData = null;

/* ================= TRANSLATE ================= */

const words = {

  en:{
    base:"Base",
    mile:"Mile",
    hourly:"Hourly",
    noShow:"NoShow",
    cancel:"Cancel",
    wait:"Wait"
  },

  es:{
    base:"Base",
    mile:"Milla",
    hourly:"Hora",
    noShow:"NoShow",
    cancel:"Cancelar",
    wait:"Espera"
  }

};

/* ================= IMAGES ================= */

function getServiceImage(serviceKey){

  if(serviceKey === "ST"){
    return "11.jpeg";
  }

  if(serviceKey === "XL"){
    return "10.jpeg";
  }

  return "";

}

function getServiceEmoji(serviceKey){

  if(serviceKey === "ST") return "🚗";
  if(serviceKey === "XL") return "🚐";
  if(serviceKey === "TX") return "🚕";
  if(serviceKey === "LM") return "🚘";
  if(serviceKey === "WH") return "🦽";

  return "🚘";

}

/* ================= LOAD SERVICES ================= */

async function loadServices(){

  const container =
  document.getElementById(
    "vehicleContainer"
  );

  const pricingBox =
  document.getElementById(
    "pricing"
  );

  try{

    const res =
    await fetch(
      tenantApiPath(
        "services"
      ),
      {
        cache:"no-store"
      }
    );

    const data =
    await res.json();

    if(!res.ok){

      throw new Error(
        data?.message ||
        "Failed To Load Services"
      );
    }

    currentTenant =
      data.tenant || null;

    if(currentTenant?.slug){

      localStorage.setItem(
        "tenantSlug",
        currentTenant.slug
      );
    }

    if(currentTenant?.id){

      localStorage.setItem(
        "tenantId",
        String(
          currentTenant.id
        )
      );
    }

    if(currentTenant?.timezone){

      localStorage.setItem(
        "systemTimezone",
        currentTenant.timezone
      );
    }

    if(currentTenant?.name){

      document.title =
        currentTenant.name +
        " - Get Quote";
    }

    servicesData =
      Array.isArray(
        data.services
      )
        ? data.services
        : [];

  const activeServices =
servicesData.filter(service=>{

  const key =
  String(service.serviceKey || "")
  .toUpperCase();

  if(
    key === "SH" ||
    key === "SHARED"
  ){
    return false;
  }

  return service.enabled === true;

});

const pricingServices =
activeServices.filter(service=>{

  return service.showPricingCard !== false;

});

/* ================= PRICING ================= */

pricingBox.innerHTML = `

<div class="pricing-wrap">

${pricingServices.map((service,index)=>{

const mode =
String(
  service.pricingMode || ""
).toUpperCase();

const title =
lang === "es"
? (service.titleEs || service.title || "")
: (service.title || "");

let headers = "";
let values = "";

if(mode === "HOURLY"){

  headers = `
  <th>${words[lang].hourly}</th>
  <th>${words[lang].noShow}</th>
  <th>${words[lang].cancel}</th>
  <th>${words[lang].wait}</th>
  `;

  values = `
  <td>$${Number(service.hourlyRate || 0)}/hr</td>
  <td>$${Number(service.noShowFee || 0)}</td>
  <td>$15</td>
  <td>15m</td>
  `;

}else{

  headers = `
  <th>${words[lang].base}</th>
  <th>${words[lang].mile}</th>
  <th>${words[lang].noShow}</th>
  <th>${words[lang].cancel}</th>
  <th>${words[lang].wait}</th>
  `;

  values = `
  <td>$${Number(service.baseFare || 0)}</td>
  <td>$${Number(service.perMile || 0)}/mi</td>
  <td>$${Number(service.noShowFee || 0)}</td>
  <td>$15</td>
  <td>15m</td>
  `;

}

return `

<div
class="
pricing-card
${
  index === pricingServices.length - 1 &&
  pricingServices.length % 2 !== 0
  ? "last-center"
  : ""
}
"
id="price-card-${service.serviceKey}"
>

<div class="pricing-title">
${title}
</div>

<table class="pricing-table">

<tr>
${headers}
</tr>

<tr>
${values}
</tr>

</table>

</div>

`;

}).join("")}

</div>

`;

if(pricingServices.length === 0){

  pricingBox.innerHTML = "";

}

/* ================= VEHICLES ================= */

container.innerHTML = "";

activeServices.forEach(service=>{

const serviceKey =
String(
service.serviceKey || ""
).toUpperCase();

const title =
lang === "es"
? (service.titleEs || service.title || serviceKey)
: (service.title || serviceKey);

const image =
getServiceImage(serviceKey);

const emoji =
getServiceEmoji(serviceKey);

const card =
document.createElement("div");

card.className =
"vehicle-option";

let mediaHtml = "";

if(image){

mediaHtml =
`<img src="${image}">`;

}else{

mediaHtml =
`
<div class="vehicle-emoji">
${emoji}
</div>
`;

}

card.innerHTML = `
${mediaHtml}
<b>${title}</b>
`;

card.onclick = function(){

selectService(
service,
card
);

};

container.appendChild(card);

});

}catch(err){

console.log(err);

container.innerHTML =
  `<div class="loading-services">
    No services available.
  </div>`;

pricingBox.innerHTML = "";

}

}

/* ================= SELECT ================= */

function selectService(service,card){

selectedService =
String(
service.serviceKey || ""
).toUpperCase();

document
.querySelectorAll(".vehicle-option")
.forEach(el=>{
  el.classList.remove("active");
});

card.classList.add("active");

document
.querySelectorAll(".pricing-card")
.forEach(el=>{
  el.classList.remove("active");
});

const selectedPriceCard =
document.getElementById(
`price-card-${selectedService}`
);

if(selectedPriceCard){
selectedPriceCard.classList.add("active");
}

resetUI();

}

/* ================= LANGUAGE ================= */

function toggleLang(){

if(lang==="en"){

lang="es";

langBtn.innerText =
"Spanish / English";

title.innerText =
"Cotizar Viaje";

pickupLabel.innerText =
"Origen";

dropLabel.innerText =
"Destino";

}else{

lang="en";

langBtn.innerText =
"English / Spanish";

title.innerText =
"Get Quote";

pickupLabel.innerText =
"Pickup";

dropLabel.innerText =
"Dropoff";

}

loadServices();

}

/* ================= MAP ================= */

function initGoogle(){

map =
new google.maps.Map(
document.getElementById("map"),
{
center:{
lat:33.4484,
lng:-112.0740
},

zoom:11,

mapTypeControl:true,

fullscreenControl:true,

streetViewControl:false
}
);

directionsService =
new google.maps.DirectionsService();

directionsRenderer =
new google.maps.DirectionsRenderer({

suppressMarkers:false,

preserveViewport:false,

polylineOptions:{
strokeColor:"#2563eb",
strokeOpacity:1,
strokeWeight:6
}

});

directionsRenderer.setMap(map);

}

/* ================= STOP ================= */

function addStop(){

const row =
document.createElement("div");

row.className =
"stop-row";

const input =
document.createElement("input");

input.placeholder =
lang==="es"
? "Parada"
: "Stop";

input.addEventListener(
"input",
resetUI
);

const remove =
document.createElement("button");

remove.innerText = "X";

remove.className =
"remove-btn";

remove.onclick = function(){

row.remove();

resetUI();

};

row.appendChild(input);
row.appendChild(remove);

document
.getElementById("stops")
.appendChild(row);

}

/* ================= RESET ================= */

function resetUI(){

calculatedRouteData = null;

bookBtn.classList.add("hidden");

bookBtn.classList.remove("active");

priceBox.classList.add("hidden");

}

pickup.addEventListener(
"input",
resetUI
);

dropoff.addEventListener(
"input",
resetUI
);

/* =========================
   SYSTEM REGION
========================= */

function getSystemRegion(){

  return (

    localStorage.getItem(
      "systemRegion"
    ) ||

    "Arizona"

  );

}

/* =========================
   SYSTEM TIMEZONE
========================= */

function getSystemTimezone(){

  return (

    localStorage.getItem(
      "systemTimezone"
    ) ||

    "America/Phoenix"

  );

}

/* =========================
   FIX REGION
========================= */

function fixRegion(address){

  address =
  String(address || "")
  .trim();

  if(address === ""){
    return "";
  }

  const region =
  getSystemRegion();

  if(
    !address
    .toLowerCase()
    .includes(
      region.toLowerCase()
    )
  ){

    return `${address}, ${region}`;

  }

  return address;

}

/* ================= CALCULATE ================= */

function calculate(){

if(!selectedService){

alert("Select service");
return;

}

const pickupVal =
fixRegion(pickup.value);

const dropVal =
fixRegion(dropoff.value);

if(!pickupVal || !dropVal){

alert("Enter valid address");
return;

}

const stopsInputs =
Array
.from(
document.querySelectorAll(
".stop-row input"
)
)
.filter(i=>i.value)
.map(i=>({
  location:fixRegion(i.value)
}));

directionsService.route({

origin:pickupVal,

destination:dropVal,

waypoints:stopsInputs,

travelMode:"DRIVING",

drivingOptions:{
departureTime:new Date(),
trafficModel:"bestguess"
}

}, async function(res,status){

if(status !== "OK"){

alert("Address not valid");
return;

}

directionsRenderer.setDirections(res);

const bounds =
new google.maps.LatLngBounds();

res.routes[0].legs.forEach(leg=>{

bounds.extend(
leg.start_location
);

bounds.extend(
leg.end_location
);

});

map.fitBounds(bounds);

const route =
  res?.routes?.[0] || null;

const legs =
  Array.isArray(route?.legs)
    ? route.legs
    : [];

const firstLeg =
  legs[0] || null;

const lastLeg =
  legs[legs.length - 1] || null;

function pointValue(point,key){

  if(!point){
    return null;
  }

  try{

    const value =
      typeof point[key] === "function"
        ? point[key]()
        : point[key];

    const num =
      Number(value);

    return Number.isFinite(num)
      ? num
      : null;

  }catch(err){

    return null;
  }
}

const pickupLat =
  pointValue(
    firstLeg?.start_location,
    "lat"
  );

const pickupLng =
  pointValue(
    firstLeg?.start_location,
    "lng"
  );

const dropoffLat =
  pointValue(
    lastLeg?.end_location,
    "lat"
  );

const dropoffLng =
  pointValue(
    lastLeg?.end_location,
    "lng"
  );

const stopCoords =
  stopsInputs.map(
    (stop,index)=>{

      const leg =
        legs[index] || null;

      return {
        address:
          fixRegion(
            String(
              stop?.location || ""
            )
          ),

        lat:
          pointValue(
            leg?.end_location,
            "lat"
          ),

        lng:
          pointValue(
            leg?.end_location,
            "lng"
          )
      };
    }
  );

const routePath =
  Array.isArray(
    route?.overview_path
  )
    ? route.overview_path.map(
        point=>({
          lat:
            pointValue(
              point,
              "lat"
            ),
          lng:
            pointValue(
              point,
              "lng"
            )
        })
      )
      .filter(
        point=>
          Number.isFinite(point.lat) &&
          Number.isFinite(point.lng)
      )
    : [];

calculatedRouteData = {
  pickupLat,
  pickupLng,
  dropoffLat,
  dropoffLng,
  stopCoords,
  routePath,

  distanceMeters:0,
  durationSeconds:0,
  estimatedMinutes:0,
  miles:0,

  googleRoute:{
    summary:
      route?.summary || "",

    waypointOrder:
      Array.isArray(
        route?.waypoint_order
      )
        ? route.waypoint_order
        : [],

    legs:
      legs.map(
        (leg,index)=>({
          legIndex:index,

          startAddress:
            leg?.start_address || "",

          endAddress:
            leg?.end_address || "",

          startLat:
            pointValue(
              leg?.start_location,
              "lat"
            ),

          startLng:
            pointValue(
              leg?.start_location,
              "lng"
            ),

          endLat:
            pointValue(
              leg?.end_location,
              "lat"
            ),

          endLng:
            pointValue(
              leg?.end_location,
              "lng"
            ),

          distanceText:
            leg?.distance?.text || "",

          distanceMeters:
            Number(
              leg?.distance?.value || 0
            ),

          durationText:
            leg?.duration?.text || "",

          durationSeconds:
            Number(
              leg?.duration?.value || 0
            )
        })
      ),

    routePath
  }
};

let meters = 0;
let sec = 0;

res.routes[0].legs.forEach(l=>{

meters += l.distance.value;
sec += l.duration.value;

});

const miles =
meters / 1609;

const mins =
Math.round(sec / 60);

const stops =
stopsInputs.length;

if(calculatedRouteData){

  calculatedRouteData.miles =
    Number(miles || 0);

  calculatedRouteData.distanceMeters =
    Number(meters || 0);

  calculatedRouteData.durationSeconds =
    Number(sec || 0);

  calculatedRouteData.estimatedMinutes =
    Number(mins || 0);
}

try{

const pricingRes =
await fetch(
tenantApiPath(
  "calculate"
),
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

serviceKey:
selectedService,

miles:miles,

minutes:mins,

stops:stops

})
}
);

const pricingData =
await pricingRes.json();

/* =========================
SAVE WARNING POLICY
========================= */

window.selectedWarningPolicy = {

  warningMinutes:
  Number(
    pricingData.service?.warningMinutes || 0
  ),

  cancelFee:
  Number(
    pricingData.service?.cancelFee || 0
  ),

  noShowFee:
  Number(
    pricingData.service?.noShowFee || 0
  ),

  disableCancel:

  pricingData.disableCancel === true,

  warningEnabled:

  String(
    pricingData.service?.warningEnabled || "enabled"
  ).toLowerCase()

};

if(!pricingData.success){

alert("Pricing error");
return;

}

const pricingMode =
String(
pricingData.pricingMode || ""
).toUpperCase();

/*
  IMPORTANT:
  Server is the single source of truth for pricing.

  GetQuoteEngine already calculates:
  - Limousine Initial Duration
  - Limousine Initial Price
  - Quarter / Full Hour after initial duration
  - Mile pricing
  - Shared pricing

  Do NOT recalculate HOURLY price here in the browser,
  otherwise Limousine Initial Package will be ignored.
*/
const totalPrice =
Number(
  pricingData.total || 0
);

distance.innerText =
miles.toFixed(2) + " mi";

stopsCount.innerText =
stops;

time.innerText =
mins + " min";

price.innerText =
"$" +
Number(totalPrice).toFixed(2);

priceBox.classList.remove("hidden");

bookBtn.classList.remove("hidden");

bookBtn.classList.add("active");

}catch(err){

console.log(err);

alert("Server pricing failed");

}

});

}

/* ================= BOOK ================= */

function bookTrip(){

const pickupVal =
fixRegion(pickup.value);

const dropVal =
fixRegion(dropoff.value);

const stops =
Array
.from(
document.querySelectorAll(
".stop-row input"
)
)
.filter(i=>i.value)
.map(i=>fixRegion(i.value));

/* =========================
TRIP DATA
========================= */

const tripData = {

  tenantId:
    currentTenant?.id ||
    localStorage.getItem(
      "tenantId"
    ) ||
    "",

  tenantSlug:
    currentTenant?.slug ||
    getTenantSlug() ||
    "",

  pickup: pickupVal,

  dropoff: dropVal,

  stops: stops,

  distance:
  document.getElementById(
    "distance"
  ).innerText,

  price:
  document.getElementById(
    "price"
  ).innerText,

  serviceKey:
  selectedService,

  vehicleType:
  selectedService,

  pickupLat:
    calculatedRouteData?.pickupLat ?? null,

  pickupLng:
    calculatedRouteData?.pickupLng ?? null,

  dropoffLat:
    calculatedRouteData?.dropoffLat ?? null,

  dropoffLng:
    calculatedRouteData?.dropoffLng ?? null,

  stopCoords:
    Array.isArray(
      calculatedRouteData?.stopCoords
    )
      ? calculatedRouteData.stopCoords
      : [],

  miles:
    Number(
      calculatedRouteData?.miles || 0
    ),

  distanceMeters:
    Number(
      calculatedRouteData?.distanceMeters || 0
    ),

  durationSeconds:
    Number(
      calculatedRouteData?.durationSeconds || 0
    ),

  estimatedMinutes:
    Number(
      calculatedRouteData?.estimatedMinutes || 0
    ),

  googleRoute:
    calculatedRouteData?.googleRoute || {},

  optimizedRoute:
    calculatedRouteData?.googleRoute || {},

  routePath:
    Array.isArray(
      calculatedRouteData?.routePath
    )
      ? calculatedRouteData.routePath
      : [],

  routePoints:[
    pickupVal,
    ...stops,
    dropVal
  ],

  routeLocked:true,
  routeFinalized:true,
  routeSource:"getquote-browser-directions",

  /* =========================
     WARNING POLICY
  ========================= */

  warningMinutes:

  Number(
    window.selectedWarningPolicy
    ?.warningMinutes || 0
  ),

  cancelFee:

  Number(
    window.selectedWarningPolicy
    ?.cancelFee || 0
  ),

noShowFee:

Number(
  window.selectedWarningPolicy
  ?.noShowFee || 0
),

disableCancel:

Boolean(
  window.selectedWarningPolicy
  ?.disableCancel
),

warningEnabled:

String(
  window.selectedWarningPolicy
  ?.warningEnabled || "enabled"
)
.toLowerCase(),

};

/* =========================
SAVE
========================= */

localStorage.setItem(

  "pendingTrip",

  JSON.stringify(tripData)

);

/* =========================
REDIRECT
========================= */

const tenantSlug =
  currentTenant?.slug ||
  getTenantSlug();

window.location.href =
  tenantSlug
    ? (
        "/booking/index.html?tenant=" +
        encodeURIComponent(
          tenantSlug
        )
      )
    : "/booking/index.html";

}

const data =
await res.json();

const script =
document.createElement("script");

script.src =
`https://maps.googleapis.com/maps/api/js?key=${data.googleKey}`;

script.async = true;

document.head.appendChild(script);

script.onload =
initGoogle;

}
