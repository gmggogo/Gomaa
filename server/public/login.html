<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title id="pageTitle">
Staff Login
</title>

<style>

body{

  margin:0;

  min-height:100vh;

  display:flex;

  justify-content:center;

  align-items:center;

  background:
  radial-gradient(
    circle at center,
    #1e3cff 0%,
    #001b7a 100%
  );

  font-family:
  Arial,
  sans-serif;

  padding:20px;

}

/* LOGIN CARD */

.login-card{

  width:360px;

  max-width:100%;

  padding:40px 30px;

  border-radius:20px;

  background:
  rgba(255,255,255,0.05);

  backdrop-filter:blur(10px);

  box-shadow:
  0 0 40px rgba(0,0,0,0.4);

  text-align:center;

  display:flex;

  flex-direction:column;

  align-items:center;

}

/* LOGO */

.logo{

  width:150px;

  max-height:110px;

  margin-bottom:18px;

  object-fit:contain;

}

/* TITLE */

.title{

  color:#ffffff;

  font-size:20px;

  letter-spacing:2px;

  margin-bottom:10px;

  font-weight:bold;

}

/* COMPANY NAME */

.company-name{

  min-height:18px;

  margin-top:-3px;
  margin-bottom:8px;

  color:#facc15;

  font-size:13px;

  font-weight:800;

  letter-spacing:.3px;

}

/* TIME */

.az-time{

  font-size:12px;

  color:#ddd;

  margin-bottom:25px;

  min-height:16px;

  line-height:1.6;

}

/* INPUTS */

.login-card input{

  width:100%;

  padding:12px;

  margin-bottom:15px;

  border:none;

  border-radius:8px;

  font-size:14px;

  outline:none;

  text-align:center;

}

/* BUTTON */

.login-card button{

  width:100%;

  padding:12px;

  border:none;

  border-radius:8px;

  background:#facc15;

  color:#000;

  font-weight:bold;

  cursor:pointer;

  transition:0.3s;

  font-size:15px;

}

.login-card button:hover{

  background:#ffdd33;

}

#msg{

  margin-top:10px;

  color:white;

  font-size:13px;

}

/* MOBILE */

@media (max-width:480px){

  body{

    align-items:flex-start;

    padding-top:60px;

  }

  .login-card{

    width:100%;

    padding:30px 20px;

  }

  .logo{

    width:135px;

    max-height:100px;

  }

  .title{

    font-size:18px;

  }

  .login-card input{

    font-size:15px;

  }

}

</style>

</head>

<body>

<div class="login-card">

  <img
  id="staffTenantLogo"
  class="logo app-logo"
  alt="Company Logo">

  <div class="title">
    STAFF LOGIN
  </div>

  <div
    id="staffTenantName"
    class="company-name">
  </div>

  <div
    id="azTime"
    class="az-time">
  </div>

  <input
    type="text"
    id="username"
    placeholder="Username">

  <input
    type="password"
    id="password"
    placeholder="Password">

  <button onclick="login()">
    Sign In
  </button>

  <div id="msg"></div>

</div>

<script src="/core/branding.js"></script>

<script>

/* =========================================================
   STAFF LOGIN TENANT BRANDING
   Uses the same tenant resolution as staff login.js
========================================================= */

function cleanTenantSlugForBranding(value){

  return String(value || "")
    .trim()
    .toLowerCase();
}

function tenantSlugForBranding(){

  /* 1) Query: /login.html?tenant=sony */
  const params =
    new URLSearchParams(
      window.location.search
    );

  const querySlug =
    cleanTenantSlugForBranding(
      params.get("tenant") ||
      params.get("tenantSlug")
    );

  if(querySlug){

    sessionStorage.setItem(
      "loginTenantSlug",
      querySlug
    );

    localStorage.setItem(
      "tenantSlug",
      querySlug
    );

    return querySlug;
  }

  /* 2) Referrer: /sony -> Staff Login */
  try{

    if(document.referrer){

      const ref =
        new URL(
          document.referrer
        );

      if(
        ref.origin ===
        window.location.origin
      ){

        const firstPart =
          cleanTenantSlugForBranding(
            ref.pathname
              .split("/")
              .filter(Boolean)[0]
          );

        const reserved =
          new Set([
            "admin",
            "dispatcher",
            "driver",
            "company",
            "platform-admin",
            "booking",
            "api",
            "core",
            "assets",
            "uploads"
          ]);

        if(
          firstPart &&
          !reserved.has(firstPart) &&
          !firstPart.includes(".")
        ){

          sessionStorage.setItem(
            "loginTenantSlug",
            firstPart
          );

          localStorage.setItem(
            "tenantSlug",
            firstPart
          );

          return firstPart;
        }
      }
    }

  }catch(err){

    console.log(
      "LOGIN BRAND TENANT ERROR:",
      err
    );
  }

  /* 3) Same-tab fallback */
  return cleanTenantSlugForBranding(
    sessionStorage.getItem(
      "loginTenantSlug"
    ) ||
    localStorage.getItem(
      "tenantSlug"
    )
  );
}

/* =========================
   APPLY TENANT BRANDING
========================= */

async function loadStaffTenantBranding(){

  tenantSlugForBranding();

  let data = {};

  try{

    if(
      window.Branding &&
      typeof Branding.load === "function"
    ){

      await Branding.load();

      data =
        Branding.data || {};
    }

  }catch(err){

    console.log(
      "STAFF LOGIN BRANDING ERROR:",
      err
    );
  }

  const companyName =
    data.companyName ||
    localStorage.getItem(
      "companyName"
    ) ||
    "";

  const mainLogo =
    data.mainLogo ||
    (
      typeof window.Branding?.getMainLogo === "function"
        ? window.Branding.getMainLogo()
        : ""
    ) ||
    localStorage.getItem(
      "appLogo"
    ) ||
    "/assets/logo.png";

  const logo =
    document.getElementById(
      "staffTenantLogo"
    );

  const nameEl =
    document.getElementById(
      "staffTenantName"
    );

  if(logo){
    logo.src = mainLogo;
  }

  if(nameEl){
    nameEl.textContent =
      companyName;
  }

  if(companyName){

    document.title =
      companyName + " Staff Login";

    localStorage.setItem(
      "companyName",
      companyName
    );
  }

  if(mainLogo){

    localStorage.setItem(
      "appLogo",
      mainLogo
    );
  }
}

/* =========================
   CLOCK
========================= */

function updateStaffClock(){

  const el =
    document.getElementById(
      "azTime"
    );

  if(!el) return;

  const timezone =
    window.Branding?.data?.timezone ||
    "America/Phoenix";

  const now =
    new Date();

  const date =
    now.toLocaleDateString(
      "en-US",
      {
        timeZone:timezone,
        weekday:"short",
        month:"short",
        day:"numeric",
        year:"numeric"
      }
    );

  const time =
    now.toLocaleTimeString(
      "en-US",
      {
        timeZone:timezone,
        hour:"numeric",
        minute:"2-digit",
        second:"2-digit",
        hour12:true
      }
    );

  el.innerHTML = `
    <div style="
      font-size:13px;
      font-weight:700;
      color:#e2e8f0;
      margin-bottom:4px;
    ">
      ${date}
    </div>

    <div style="
      font-size:18px;
      font-weight:900;
      color:#facc15;
    ">
      ${time}
    </div>
  `;
}

async function initStaffLoginBranding(){

  await loadStaffTenantBranding();

  updateStaffClock();

  setInterval(
    updateStaffClock,
    1000
  );
}

window.addEventListener(
  "DOMContentLoaded",
  initStaffLoginBranding
);

</script>

<!-- KEEP CURRENT WORKING STAFF LOGIN LOGIC -->
<script src="login.js"></script>

</body>
</html>
