<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Staff Login</title>

<style>

body{

  margin:0;

  min-height:100vh;

  display:flex;

  justify-content:center;

  align-items:center;

  background:
  radial-gradient(
    circle at center,
    #1e3cff 0%,
    #001b7a 100%
  );

  font-family:
  Arial,
  sans-serif;

  padding:20px;

}

/* LOGIN CARD */

.login-card{

  width:360px;

  max-width:100%;

  padding:40px 30px;

  border-radius:20px;

  background:
  rgba(255,255,255,0.05);

  backdrop-filter:blur(10px);

  box-shadow:
  0 0 40px rgba(0,0,0,0.4);

  text-align:center;

  display:flex;

  flex-direction:column;

  align-items:center;

}

/* LOGO */

.logo{

  width:155px;

  max-height:125px;

  margin-bottom:18px;

  object-fit:contain;

}

/* TITLE */

.title{

  color:#ffffff;

  font-size:20px;

  letter-spacing:2px;

  margin-bottom:8px;

  font-weight:bold;

}

.company-login-name{

  min-height:18px;

  color:#facc15;

  font-size:13px;

  font-weight:800;

  margin-bottom:10px;

}

/* TIME */

.az-time{

  font-size:12px;

  color:#ddd;

  margin-bottom:25px;

  min-height:16px;

  line-height:1.6;

}

/* INPUTS */

.login-card input{

  width:100%;

  padding:12px;

  margin-bottom:15px;

  border:none;

  border-radius:8px;

  font-size:14px;

  outline:none;

  text-align:center;

}

/* BUTTON */

.login-card button{

  width:100%;

  padding:12px;

  border:none;

  border-radius:8px;

  background:#facc15;

  color:#000;

  font-weight:bold;

  cursor:pointer;

  transition:0.3s;

  font-size:15px;

}

.login-card button:hover{

  background:#ffdd33;

}

#msg{

  margin-top:10px;

  color:white;

  font-size:13px;

}

/* MOBILE */

@media (max-width:480px){

  body{

    align-items:flex-start;

    padding-top:60px;

  }

  .login-card{

    width:100%;

    padding:30px 20px;

  }

  .logo{

    width:130px;

    max-height:105px;

  }

  .title{

    font-size:18px;

  }

  .login-card input{

    font-size:15px;

  }

}

</style>

</head>

<body>

<div class="login-card">

  <img
  class="logo app-logo main-logo"
  id="staffTenantLogo"
  alt="Company Logo">

  <div class="title">
    STAFF LOGIN
  </div>

  <div
  id="staffTenantName"
  class="company-login-name">
  </div>

  <div
  id="azTime"
  class="az-time">
  </div>

  <input
  type="text"
  id="username"
  placeholder="Username"
  autocomplete="username">

  <input
  type="password"
  id="password"
  placeholder="Password"
  autocomplete="current-password">

  <button onclick="login()">
    Sign In
  </button>

  <div id="msg"></div>

</div>

<!--
  TENANT BRANDING:
  branding.js reads ?tenant=sony (or ?tenantSlug=sony)
  and loads the public design for THAT tenant before login.
-->
<script src="/core/branding.js"></script>

<script>

/* =========================
TENANT LOGIN BRANDING
========================= */

async function loadStaffTenantBranding(){

  const logo =
    document.getElementById(
      "staffTenantLogo"
    );

  const nameEl =
    document.getElementById(
      "staffTenantName"
    );

  try{

    if(
      !window.Branding ||
      typeof Branding.load !== "function"
    ){
      throw new Error(
        "Branding engine unavailable"
      );
    }

    await Branding.load();

    const companyName =
      (
        typeof Branding.getCompanyName === "function"
          ? Branding.getCompanyName()
          : Branding.data?.companyName
      ) || "";

    const mainLogo =
      (
        typeof Branding.getMainLogo === "function"
          ? Branding.getMainLogo()
          : Branding.data?.mainLogo
      ) || "/assets/logo.png";

    if(logo){
      logo.src =
        mainLogo;
    }

    if(nameEl){
      nameEl.textContent =
        companyName;
    }

    document.title =
      companyName
        ? `${companyName} Staff Login`
        : "Staff Login";

  }catch(err){

    console.log(
      "STAFF LOGIN BRANDING ERROR:",
      err
    );

    if(logo){
      logo.src =
        "/assets/logo.png";
    }

    if(nameEl){
      nameEl.textContent =
        "";
    }

    document.title =
      "Staff Login";
  }
}

/* =========================
CLOCK
========================= */

function updateStaffClock(){

  const el =
    document.getElementById(
      "azTime"
    );

  if(!el) return;

  const timezone =
    window.Branding?.data?.timezone ||
    localStorage.getItem(
      "appTimezone"
    ) ||
    "America/Phoenix";

  const now =
    new Date();

  const date =
    now.toLocaleDateString(
      "en-US",
      {
        timeZone:timezone,
        weekday:"short",
        month:"short",
        day:"numeric",
        year:"numeric"
      }
    );

  const time =
    now.toLocaleTimeString(
      "en-US",
      {
        timeZone:timezone,
        hour:"numeric",
        minute:"2-digit",
        second:"2-digit",
        hour12:true
      }
    );

  el.innerHTML = `
    <div style="
      font-size:13px;
      font-weight:700;
      color:#e2e8f0;
      margin-bottom:4px;
    ">
      ${date}
    </div>

    <div style="
      font-size:18px;
      font-weight:900;
      color:#facc15;
    ">
      ${time}
    </div>
  `;
}

window.addEventListener(
  "DOMContentLoaded",
  async ()=>{

    await loadStaffTenantBranding();

    updateStaffClock();

    setInterval(
      updateStaffClock,
      1000
    );
  }
);

</script>

<script src="login.js"></script>

</body>
</html>
