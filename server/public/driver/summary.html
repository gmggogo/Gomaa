<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Earnings Summary</title>

<link rel="stylesheet" href="driver.css">

<style>
*{box-sizing:border-box}

:root{
  --navy:#061a36;
  --navy2:#0d3768;
  --gold:#ffd21f;
  --muted:#cbd5e1;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:"Segoe UI",Arial,sans-serif;
}

body{
  color:#fff;
  background:
    linear-gradient(rgba(255,255,255,.10),rgba(255,255,255,.10)),
    url("assets/map-bg.jpeg") center/cover fixed,
    #dce9f5;
  padding-bottom:130px;
}

.summary-head{
  padding:20px 14px 15px;
  text-align:center;
  background:linear-gradient(180deg,#03182f,#071f40);
  border-bottom:4px solid var(--gold);
}

.summary-head h1{
  margin:0;
  color:var(--gold);
  font-size:30px;
  line-height:1;
  font-weight:900;
}

.summary-head div{
  margin-top:7px;
  color:#fff;
  font-size:14px;
  font-weight:800;
}

.shell{
  width:min(100%,760px);
  margin:0 auto;
  padding:12px 12px 145px;
}

.current-card{
  padding:14px;
  border-radius:20px;
  background:linear-gradient(145deg,var(--navy2),var(--navy));
  border:2px solid rgba(255,210,31,.62);
  box-shadow:0 10px 18px rgba(0,0,0,.18);
}

.current-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.current-label{
  color:#79adff;
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
}

.days-left{
  padding:6px 9px;
  border-radius:9px;
  background:#1255a2;
  color:#fff;
  font-size:10px;
  font-weight:900;
}

.current-period{
  margin-top:8px;
  color:#fff;
  font-size:18px;
  font-weight:900;
}

.current-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-top:12px;
  padding-top:11px;
  border-top:1px solid rgba(255,255,255,.18);
}

.current-stat{
  min-width:0;
  text-align:center;
}

.current-stat + .current-stat{
  border-left:1px solid rgba(255,255,255,.18);
}

.current-stat b{
  display:block;
  color:#fff;
  font-size:16px;
  font-weight:900;
}

.current-stat:last-child b{
  color:var(--gold);
}

.current-stat span{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-size:9px;
  font-weight:800;
}

.section-title{
  margin:16px 3px 8px;
  color:#071a36;
  font-size:17px;
  font-weight:900;
}

.history{
  overflow:hidden;
  border-radius:18px;
  background:rgba(255,255,255,.94);
  border:1px solid rgba(10,36,68,.10);
  box-shadow:0 7px 18px rgba(15,39,71,.08);
}

.history-row{
  display:grid;
  grid-template-columns:1.4fr .9fr .8fr;
  gap:8px;
  align-items:center;
  min-height:69px;
  padding:10px 12px;
  color:#071a36;
}

.history-row + .history-row{
  border-top:1px solid #e3e8ef;
}

.history-date{
  font-size:11px;
  font-weight:900;
  line-height:1.35;
}

.history-center{
  font-size:11px;
  font-weight:900;
  line-height:1.45;
}

.history-center span{
  display:block;
  color:#607086;
  font-size:10px;
}

.history-money{
  color:#16a34a;
  text-align:right;
  font-size:14px;
  font-weight:900;
}

.empty,
.error{
  padding:18px 12px;
  text-align:center;
  color:#607086;
  font-size:12px;
  font-weight:800;
}

.note{
  margin-top:10px;
  padding:10px 12px;
  border-radius:14px;
  background:rgba(255,255,255,.84);
  color:#34516f;
  text-align:center;
  font-size:10px;
  font-weight:800;
}

@media(max-width:390px){
  .summary-head h1{font-size:28px}
  .shell{padding-left:10px;padding-right:10px}
  .current-stat b{font-size:14px}
  .history-row{grid-template-columns:1.25fr .95fr .8fr;padding:9px 10px}
  .history-money{font-size:13px}
}
</style>
</head>

<body>

<header class="summary-head">
  <h1>EARNINGS SUMMARY</h1>
  <div>Current period &amp; last 6 months</div>
</header>

<main class="shell">

  <section class="current-card">

    <div class="current-top">
      <div class="current-label">Current Period — In Progress</div>
      <div class="days-left" id="daysLeft">—</div>
    </div>

    <div class="current-period" id="currentPeriod">
      Loading...
    </div>

    <div class="current-stats">

      <div class="current-stat">
        <b id="currentHours">0 H 00 MIN</b>
        <span>HOURS</span>
      </div>

      <div class="current-stat">
        <b id="currentTrips">0</b>
        <span>TRIPS</span>
      </div>

      <div class="current-stat">
        <b id="currentEarnings">$0.00</b>
        <span>EARNINGS</span>
      </div>

    </div>

  </section>

  <div class="section-title">
    Last 6 Months
  </div>

  <section class="history" id="historyList">
    <div class="empty">Loading...</div>
  </section>

  <div class="note">
    Closed payroll periods are shown for the rolling last 6 months.
  </div>

</main>

<div id="driverNav"></div>

<script src="driver-nav.js"></script>
<script src="summary.js"></script>

</body>
</html>
