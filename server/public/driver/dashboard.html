<!-- Replace the old dashboard header + status + dashboard-scroll block with this -->

<section class="driver-identity-header">

  <div class="driver-avatar" aria-hidden="true">
    <svg viewBox="0 0 24 24">
      <path d="M12 12a4.4 4.4 0 1 0 0-8.8 4.4 4.4 0 0 0 0 8.8zm-7.3 8.2c.5-4.1 3-6.5 7.3-6.5s6.8 2.4 7.3 6.5c.1.7-.4 1.3-1.1 1.3H5.8c-.7 0-1.2-.6-1.1-1.3z"/>
    </svg>
  </div>

  <div class="driver-identity-text">
    <div class="driver-name-header" id="driverName">Driver</div>
    <div class="driver-role-header">Driver</div>
  </div>

  <div class="driver-online-header">
    <span class="driver-online-dot"></span>
    <span>ONLINE</span>
  </div>

</section>

<header class="dashboard-header dashboard-header-clean">

  <div class="profile-logo-standalone clean-logo">
    <img
      class="logo app-logo"
      src="sunbeamllc.jpeg"
      alt="Company Logo"
    />
  </div>

  <div class="company-name">SUNSET</div>

</header>

<section class="status-pill" aria-label="Driver status">

  <div class="status-left">
    <span class="status-dot"></span>
    <span class="status-label">Status:</span>
  </div>

  <span class="status-value">ONLINE</span>

</section>

<div class="dashboard-scroll" id="dashboardScroll">

  <section class="dashboard-grid">

    <button class="dashboard-card glow-blue" id="cardTrips" type="button">
      <img class="dashboard-card-icon trips-icon" src="assets/trips.png" alt="" />
      <span class="dashboard-card-title">Trips</span>
    </button>

    <button class="dashboard-card glow-cyan" id="cardMap" type="button">
      <img class="dashboard-card-icon map-icon" src="assets/live-map.png" alt="" />
      <span class="dashboard-card-title">Live Map</span>
    </button>

    <button class="dashboard-card glow-purple" id="cardHours" type="button">
      <img class="dashboard-card-icon hours-icon" src="assets/work-hours.png" alt="" />
      <span class="dashboard-card-title">Work Hours</span>
    </button>

    <button class="dashboard-card glow-gold" id="cardEarnings" type="button">
      <img class="dashboard-card-icon earnings-icon" src="assets/earnings.png" alt="" />
      <span class="dashboard-card-title">Earnings</span>
    </button>

  </section>

  <button class="summary-card summary-final-card" id="cardSummary" type="button">
    <span class="summary-icon-crop">
      <img class="summary-final-icon" src="assets/summary.png" alt="" />
    </span>
    <span class="summary-final-text">View Summary</span>
  </button>

</div>
