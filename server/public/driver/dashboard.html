<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sunbeam Driver Dashboard</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.jpeg" />
  <link rel="stylesheet" href="driver.css" />

  <style>
    :root{
      --navy:#04172f;
      --navy-mid:#0a315e;
      --gold:#ffd226;
      --gold-deep:#765000;
      --green:#28ef70;
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      width:100%;
      min-height:100%;
    }

    body.driver-dashboard-page{
      min-height:100dvh;
      color:#fff;
      overflow-x:hidden;
      padding-bottom:145px;
    }

    .dashboard-shell{
      width:100%;
      min-height:100dvh;
      overflow-x:hidden;
    }

    /* =========================
       HEADER
    ========================= */

    .driver-header{
      width:100%;

      display:grid;
      grid-template-columns:auto minmax(0,1fr) 74px;
      align-items:center;
      gap:14px;

      padding:
        max(15px, env(safe-area-inset-top))
        18px
        16px;

      background:
        linear-gradient(
          180deg,
          #031329 0%,
          #061b38 100%
        );

      border-bottom:4px solid var(--gold);
      border-radius:0 0 34px 34px;

      box-shadow:
        0 8px 0 rgba(91,59,0,.34),
        0 14px 24px rgba(0,0,0,.22);
    }

    .driver-avatar{
      width:54px;
      height:54px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:50%;
      border:3px solid var(--gold);

      background:
        radial-gradient(
          circle at 50% 35%,
          #183f70,
          #04162f 72%
        );
    }

    .driver-avatar svg{
      width:28px;
      height:28px;
      fill:var(--gold);
    }

    .driver-info{
      min-width:0;
    }

    .driver-name{
      color:#ffffff !important;
      font-size:18px;
      line-height:1;
      font-weight:900;

      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;

      text-shadow:
        0 2px 4px rgba(0,0,0,.55);
    }

    .driver-role{
      margin-top:5px;
      color:var(--gold);
      font-size:14px;
      font-weight:900;
    }

    .driver-logo-box{
      width:74px;
      height:58px;

      display:flex;
      align-items:center;
      justify-content:center;

      overflow:hidden;

      border:0 !important;
      outline:0 !important;
      background:transparent !important;
      box-shadow:none !important;
    }

    .driver-logo-box img{
      display:block;

      width:100%;
      height:100%;

      object-fit:contain;

      background:transparent !important;
      border:0 !important;
      outline:0 !important;
      box-shadow:none !important;
      filter:none !important;
    }

    /* =========================
       COMPANY NAME
    ========================= */

    .company-name-wrap{
      width:100%;

      display:flex;
      justify-content:center;

      margin-top:24px;
      margin-bottom:24px;
    }

    .company-name-wrap .dashboard-company.company-name{
      width:100%;
      max-width:calc(100vw - 28px);

      margin:0 !important;
      padding:0 6px !important;

      color:#e5ad00 !important;
      text-align:center !important;

      font-size:clamp(18px,5.2vw,23px) !important;
      line-height:1.05 !important;
      font-weight:900 !important;
      letter-spacing:0 !important;

      white-space:nowrap !important;
      overflow:visible !important;
      text-overflow:clip !important;

      transform:none !important;

      text-shadow:
        0 2px 0 #765000,
        0 4px 7px rgba(0,0,0,.22) !important;
    }

    /* =========================
       STATUS
    ========================= */

    .status-pill{
      margin:0 18px 20px;

      min-height:60px;
      padding:0 20px;

      display:flex;
      align-items:center;
      justify-content:center;
      gap:18px;

      border-radius:30px;

      background:
        linear-gradient(
          180deg,
          #0b315d 0%,
          #04172f 100%
        );

      border:2px solid rgba(255,210,38,.84);

      box-shadow:
        0 7px 0 rgba(79,51,0,.42),
        0 13px 20px rgba(0,0,0,.18);
    }

    .status-left{
      display:flex;
      align-items:center;
      gap:9px;
    }

    .status-dot{
      width:21px;
      height:21px;

      border-radius:50%;
      background:var(--green);

      box-shadow:
        0 0 14px rgba(39,242,111,.55);
    }

    .status-label{
      color:#fff;
      font-size:17px;
      font-weight:900;
    }

    .status-value{
      color:var(--green);
      font-size:18px;
      font-weight:900;
    }

    /* =========================
       CONTENT
    ========================= */

    .dashboard-content{
      width:100%;
      max-width:100%;

      padding:0 18px 14px;

      overflow-x:hidden;
    }

    .dashboard-grid{
      width:100%;
      max-width:100%;

      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      gap:8px;
    }

    .dashboard-card{
      position:relative;

      width:100%;
      max-width:100%;

      min-width:0;

      appearance:none;
      -webkit-tap-highlight-color:transparent;

      font-family:inherit;

      cursor:pointer;
      overflow:hidden;

      min-height:82px;
      padding:8px 10px;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:8px;

      color:#fff;

      border-radius:22px;

      background:
        radial-gradient(
          circle at 24% 14%,
          rgba(74,141,232,.12),
          transparent 35%
        ),
        linear-gradient(
          160deg,
          #0a315e 0%,
          #061c3b 54%,
          #03142d 100%
        );

      border-top:3px solid #ffe27a;
      border-left:3px solid #edb72a;
      border-right:3px solid #9e6800;
      border-bottom:5px solid #6f4900;

      box-shadow:
        0 7px 0 rgba(57,36,0,.50),
        0 12px 18px rgba(2,12,30,.22),
        inset 0 1px 0 rgba(255,255,255,.08);
    }

    .dashboard-card::after{
      content:"";

      position:absolute;
      inset:7px;

      border-radius:17px;
      border:1.5px solid rgba(255,210,38,.62);

      pointer-events:none;
    }

    /* =========================
       TRIPS
    ========================= */

    #cardTrips{
      grid-column:1 / -1;

      min-height:84px;

      margin-top:0 !important;

      color:#07172d;

      background:
        radial-gradient(
          circle at 24% 15%,
          rgba(255,255,255,.52),
          transparent 32%
        ),
        linear-gradient(
          180deg,
          #ffe86f 0%,
          #ffd226 52%,
          #dda300 100%
        );

      border-top:3px solid #fff2a6;
      border-left:3px solid #ffdc45;
      border-right:3px solid #a36a00;
      border-bottom:5px solid #805300;

      box-shadow:
        0 8px 0 rgba(92,58,0,.48),
        0 14px 22px rgba(0,0,0,.22),
        inset 0 2px 0 rgba(255,255,255,.48);
    }

    #cardTrips::after{
      border:2px solid rgba(105,67,0,.42);
    }

    #cardTrips .dashboard-card-title{
      color:#07172d;
      font-size:26px;
      line-height:1;
      font-weight:900;

      text-shadow:
        0 1px 0 rgba(255,255,255,.45);
    }

    /* =========================
       OTHER BUTTONS
    ========================= */

    .dashboard-card-icon,
    .history-icon{
      position:relative;
      z-index:2;

      width:28px;
      height:28px;
      min-width:28px;
      min-height:28px;

      display:flex;
      align-items:center;
      justify-content:center;

      object-fit:contain;

      background:transparent !important;
      border:0 !important;
      box-shadow:none !important;
      filter:none !important;
    }

    .history-icon svg{
      display:block;
      width:28px;
      height:28px;
    }

    .dashboard-card-title{
      position:relative;
      z-index:2;

      color:#fff;

      font-size:17px;
      line-height:1.1;
      font-weight:900;

      text-align:center;
    }

    /* =========================
       REVIEW SUMMARY
    ========================= */

    #cardSummary{
      grid-column:1 / -1;
      position:relative;

      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;

      width:100% !important;
      max-width:100% !important;
      min-width:0 !important;

      margin:0 !important;
      padding:14px 18px !important;

      left:auto !important;
      right:auto !important;

      transform:none !important;

      min-height:68px;

      appearance:none;
      -webkit-tap-highlight-color:transparent;

      font-family:inherit;

      cursor:pointer;
      overflow:hidden;

      color:#fff;

      border-radius:22px;

      background:
        radial-gradient(
          circle at 18% 12%,
          rgba(72,140,230,.12),
          transparent 34%
        ),
        linear-gradient(
          160deg,
          #0a315e 0%,
          #061c3b 54%,
          #03142d 100%
        );

      border-top:3px solid #ffe27a;
      border-left:3px solid #edb72a;
      border-right:3px solid #9e6800;
      border-bottom:5px solid #6f4900;

      box-shadow:
        0 7px 0 rgba(57,36,0,.50),
        0 12px 18px rgba(2,12,30,.22),
        inset 0 1px 0 rgba(255,255,255,.08);

      box-sizing:border-box !important;
    }

    #cardSummary::after{
      content:"";

      position:absolute;
      inset:7px;

      border-radius:17px;
      border:1.5px solid rgba(255,210,38,.62);

      pointer-events:none;
    }

    .summary-icon-wrap{
      position:relative;
      z-index:2;

      width:28px;
      height:28px;
      min-width:28px;
      flex:0 0 28px;

      display:flex;
      align-items:center;
      justify-content:center;

      overflow:hidden;
    }

    .summary-icon{
      display:block;

      width:28px;
      height:28px;

      object-fit:contain;

      background:transparent !important;
      border:0 !important;
      box-shadow:none !important;
      filter:none !important;
    }

    .summary-title{
      position:relative;
      z-index:2;

      min-width:0;

      color:#fff;

      font-size:19px;
      line-height:1.1;
      font-weight:900;

      text-align:center;
      white-space:nowrap;
    }

    /* =========================
       MOBILE
    ========================= */

    @media(max-width:390px){

      .driver-header{
        grid-template-columns:auto minmax(0,1fr) 70px;

        padding-left:14px;
        padding-right:14px;
      }

      .driver-avatar{
        width:50px;
        height:50px;
      }

      .driver-name{
        font-size:17px;
      }

      .driver-logo-box{
        width:70px;
        height:55px;
      }

      .company-name-wrap{
        margin-top:24px;
        margin-bottom:24px;
      }

      .company-name-wrap .dashboard-company.company-name{
        font-size:clamp(17px,4.8vw,21px) !important;
        letter-spacing:0 !important;
      }

      .status-pill{
        margin-left:12px;
        margin-right:12px;
        margin-bottom:20px;
      }

      .dashboard-content{
        padding-left:12px;
        padding-right:12px;
      }

      .dashboard-grid{
        gap:7px;
      }

      .dashboard-card{
        min-height:78px;
        border-radius:21px;
        padding-top:7px;
        padding-bottom:7px;
      }

      #cardTrips{
        min-height:80px;
      }

      .dashboard-card-icon,
      .history-icon,
      .history-icon svg{
        width:26px;
        height:26px;
        min-width:26px;
        min-height:26px;
      }

      .dashboard-card-title{
        font-size:16px;
      }

      #cardTrips .dashboard-card-title{
        font-size:25px;
      }

      #cardSummary{
        min-height:64px;
        padding:8px 14px !important;
      }

      .summary-icon-wrap{
        width:28px;
        height:28px;
        flex-basis:28px;
      }

      .summary-icon{
        width:28px;
        height:28px;
      }

      .summary-title{
        font-size:18px;
      }
    }
  </style>

<style id="dashboard-approved-final-layout">
/* =========================================================
   APPROVED FINAL DASHBOARD LAYOUT
   - Trips full width gold
   - 4 navy buttons in 2 x 2
   - gaps nearly touching
   - View Summary navy, full width, slightly taller
   - no icons inside the large buttons
   - bottom nav icons remain unchanged
   ========================================================= */

body.driver-dashboard-page{
  padding-bottom:122px !important;
}

.company-name-wrap{
  margin-top:10px !important;
  margin-bottom:10px !important;
}

.status-pill{
  min-height:54px !important;
  margin:0 18px 6px !important;
  justify-content:center !important;
  gap:16px !important;
}

.status-left{
  gap:8px !important;
}

.dashboard-content{
  padding:0 18px 6px !important;
}

.dashboard-grid{
  display:grid !important;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr) !important;
  gap:2px !important;
}

/* TRIPS */
#cardTrips{
  grid-column:1 / -1 !important;
  width:100% !important;
  min-height:70px !important;
  height:70px !important;
  margin:0 !important;
  padding:6px 12px !important;
}

/* FOUR MIDDLE BUTTONS */
#cardMap,
#cardHistory,
#cardHours,
#cardEarnings{
  width:100% !important;
  min-height:102px !important;
  height:102px !important;
  margin:0 !important;
  padding:6px 8px !important;
  gap:0 !important;
}

/* Large dashboard button icons */
#cardMap .dashboard-card-icon,
#cardHistory .history-icon,
#cardHours .dashboard-card-icon,
#cardEarnings .dashboard-card-icon{
  display:flex !important;
  width:28px !important;
  height:28px !important;
  min-width:28px !important;
  min-height:28px !important;
  margin:0 0 4px !important;
}

#cardSummary .summary-icon-wrap{
  display:flex !important;
  width:32px !important;
  height:32px !important;
  min-width:32px !important;
  flex:0 0 32px !important;
}

#cardSummary .summary-icon{
  width:32px !important;
  height:32px !important;
}

/* VIEW SUMMARY — navy, same width as Trips, slightly taller */
#cardSummary{
  grid-column:1 / -1 !important;
  width:100% !important;
  max-width:100% !important;
  min-height:82px !important;
  height:82px !important;
  margin:0 !important;
  padding:8px 16px !important;

  display:flex !important;
  align-items:center !important;
  justify-content:center !important;

  color:#fff !important;

  background:
    radial-gradient(
      circle at 18% 12%,
      rgba(72,140,230,.12),
      transparent 34%
    ),
    linear-gradient(
      160deg,
      #0a315e 0%,
      #061c3b 54%,
      #03142d 100%
    ) !important;

  border-top:3px solid #ffe27a !important;
  border-left:3px solid #edb72a !important;
  border-right:3px solid #9e6800 !important;
  border-bottom:5px solid #6f4900 !important;

  box-shadow:
    0 7px 0 rgba(57,36,0,.50),
    0 12px 18px rgba(2,12,30,.22),
    inset 0 1px 0 rgba(255,255,255,.08) !important;
}

#cardSummary::after{
  border:1.5px solid rgba(255,210,38,.62) !important;
}

#cardSummary .summary-title{
  color:#fff !important;
  font-size:26px !important;
  line-height:1 !important;
}

/* Keep text sizes strong and centered */
.dashboard-card-title{
  font-size:17px !important;
  line-height:1.1 !important;
}

#cardTrips .dashboard-card-title{
  font-size:26px !important;
}

/* iPhone / narrow screens */
@media(max-width:430px){

  .company-name-wrap{
    margin-top:8px !important;
    margin-bottom:8px !important;
  }

  .status-pill{
    margin-left:12px !important;
    margin-right:12px !important;
    margin-bottom:5px !important;
    justify-content:center !important;
    gap:14px !important;
  }

  .status-left{
    gap:7px !important;
  }

  .dashboard-content{
    padding-left:12px !important;
    padding-right:12px !important;
  }

  .dashboard-grid{
    gap:1px !important;
  }

  #cardTrips{
    min-height:66px !important;
    height:66px !important;
  }

  #cardMap,
  #cardHistory,
  #cardHours,
  #cardEarnings{
    min-height:96px !important;
    height:96px !important;
  }

  #cardSummary{
    min-height:84px !important;
    height:84px !important;
  }
}
</style>

</head>

<body class="driver-dashboard-page">

  <main class="dashboard-shell">

    <section class="driver-header">

      <div class="driver-avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M12 12a4.4 4.4 0 1 0 0-8.8 4.4 4.4 0 0 0 0 8.8zm-7.3 8.2c.5-4.1 3-6.5 7.3-6.5s6.8 2.4 7.3 6.5c.1.7-.4 1.3-1.1 1.3H5.8c-.7 0-1.2-.6-1.1-1.3z"/>
        </svg>
      </div>

      <div class="driver-info">

        <div
          class="driver-name"
          id="driverName"
        >
          Driver
        </div>

        <div class="driver-role">
          Driver
        </div>

      </div>

      <div class="driver-logo-box">
        <img
          class="logo app-logo"
          alt="Company Logo"
        />
      </div>

    </section>

    <div class="company-name-wrap">
      <div class="dashboard-company company-name">
        SUNBEAM
      </div>
    </div>

    <section
      class="status-pill"
      aria-label="Driver status"
    >

      <div class="status-left">
        <span class="status-dot"></span>
        <span class="status-label">Status:</span>
      </div>

      <span class="status-value">
        ONLINE
      </span>

    </section>

    <div class="dashboard-content">

      <section class="dashboard-grid">

        <button
          class="dashboard-card"
          id="cardTrips"
          type="button"
        >
          <span class="dashboard-card-title">
            Trips
          </span>
        </button>

        <button
          class="dashboard-card"
          id="cardMap"
          type="button"
        >
          <span class="dashboard-card-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#35d6e8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 21s6-5.4 6-11a6 6 0 1 0-12 0c0 5.6 6 11 6 11z"/>
              <circle cx="12" cy="10" r="2.2"/>
            </svg>
          </span>
          <span class="dashboard-card-title">
            Live Map
          </span>
        </button>

        <button
          class="dashboard-card"
          id="cardHistory"
          type="button"
        >
          <span class="history-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#f8fafc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 3-6.7"/>
              <path d="M3 4v5h5"/>
              <path d="M12 7v5l3 2"/>
            </svg>
          </span>
          <span class="dashboard-card-title">
            Trip History
          </span>
        </button>

        <button
          class="dashboard-card"
          id="cardHours"
          type="button"
        >
          <span class="dashboard-card-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#ffd226" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="8"/>
              <path d="M12 7v5l3.5 2"/>
            </svg>
          </span>
          <span class="dashboard-card-title">
            Work Hours
          </span>
        </button>

        <button
          class="dashboard-card"
          id="cardEarnings"
          type="button"
        >
          <span class="dashboard-card-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#28ef70" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="8"/>
              <path d="M15 9.2c-.7-.8-1.7-1.2-3-1.2-1.7 0-3 .8-3 2s1.1 1.8 3 2 3 .8 3 2-1.3 2-3 2c-1.3 0-2.4-.4-3.2-1.2"/>
              <path d="M12 6v12"/>
            </svg>
          </span>
          <span class="dashboard-card-title">
            Earnings
          </span>
        </button>

        <button
          id="cardSummary"
          type="button"
        >
          <span class="summary-icon-wrap" aria-hidden="true">
            <svg class="summary-icon" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="#ffd226" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19V9"/>
              <path d="M10 19V5"/>
              <path d="M16 19v-7"/>
              <path d="M22 19V3"/>
            </svg>
          </span>
          <span class="summary-title">
            Earnings Summary
          </span>

        </button>

      </section>

    </div>

  </main>

  <div id="driverNav"></div>

  <script src="/core/branding.js"></script>

  <script>
    window.addEventListener(
      "DOMContentLoaded",
      async () => {

        if(window.Branding){
          await window.Branding.load();
        }

      }
    );
  </script>

  <script src="driver-nav.js"></script>
  <script src="dashboard.js" defer></script>
  <script src="/driver/location.js"></script>

</body>
</html>
