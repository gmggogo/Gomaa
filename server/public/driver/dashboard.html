<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sunbeam Driver Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.jpeg" />
  <link rel="stylesheet" href="driver-style.css" />
</head>

<body class="dashboard-page">

  <div class="dashboard-shell">

    <div class="dashboard-header">

      <div class="top-datetime" id="datetime"></div>

      <div class="profile-logo-box">
        <img
          class="logo app-logo"
          alt="Company Logo"
        />
      </div>

      <div class="company-name-glow">
        SUNSET
      </div>

      <div class="driver-name-inline" id="driverName">
        Driver
      </div>

    </div>

    <div class="status-pill">
      <div class="status-left">
        <span class="status-dot"></span>
        <span class="status-label">Status:</span>
      </div>
      <span class="status-value">ONLINE</span>
    </div>

    <div class="dashboard-grid">

      <div class="dashboard-card glow-blue" id="cardTrips">
        <div class="dashboard-card-icon">🚗</div>
        <div class="dashboard-card-title">Trips</div>
        <div class="dashboard-card-arrow">→</div>
      </div>

      <div class="dashboard-card glow-cyan" id="cardMap">
        <div class="dashboard-card-icon">🗺️</div>
        <div class="dashboard-card-title">Live Map</div>
        <div class="dashboard-card-arrow">→</div>
      </div>

      <div class="dashboard-card glow-purple" id="cardHours">
        <div class="dashboard-card-icon">⏱️</div>
        <div class="dashboard-card-title">Work Hours</div>
        <div class="dashboard-card-arrow">→</div>
      </div>

      <div class="dashboard-card glow-gold" id="cardEarnings">
        <div class="dashboard-card-icon">💰</div>
        <div class="dashboard-card-title">Earnings</div>
        <div class="dashboard-card-arrow">→</div>
      </div>

    </div>

    <div class="summary-card-pro" id="cardSummary">
      <div class="summary-left">
        <div class="summary-icon">📊</div>
        <div class="summary-text">View Summary</div>
      </div>
      <div class="summary-arrow">→</div>
    </div>

  </div>

  <div id="driverNav"></div>

  <script src="/core/branding.js"></script>

  <script>
    window.addEventListener(
      "DOMContentLoaded",
      async ()=>{

        if(window.Branding){
          await Branding.load();
        }

      }
    );
  </script>

  <script src="driver-nav.js"></script>
  <script src="dashboard.js" defer></script>
  <script src="/driver/location.js"></script>

</body>
</html>
