<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sunbeam Driver Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.jpeg" />
  <link rel="stylesheet" href="driver.css" />
</head>

<body class="driver-dashboard-page">

  <main class="dashboard-shell">

    <header class="dashboard-header">

      <div class="top-datetime" id="datetime"></div>

      <div class="profile-logo-box">
        <img
          class="logo app-logo"
          src="sunbeamllc.jpeg"
          alt="Company Logo"
        />
      </div>

      <div class="company-name">SUNSET</div>

      <div class="driver-name" id="driverName">
        Driver
      </div>

    </header>

    <section class="status-pill" aria-label="Driver status">
      <span class="status-dot"></span>
      <span class="status-label">Status:</span>
      <span class="status-value">ONLINE</span>
    </section>

    <section class="dashboard-grid">

      <button class="dashboard-card glow-blue" id="cardTrips" type="button">
        <img
          class="dashboard-card-icon trips-icon"
          src="assets/trips.png"
          alt=""
        />
        <span class="dashboard-card-title">Trips</span>
        <span class="dashboard-card-arrow">→</span>
      </button>

      <button class="dashboard-card glow-cyan" id="cardMap" type="button">
        <img
          class="dashboard-card-icon map-icon"
          src="assets/live-map.png"
          alt=""
        />
        <span class="dashboard-card-title">Live Map</span>
        <span class="dashboard-card-arrow">→</span>
      </button>

      <button class="dashboard-card glow-purple" id="cardHours" type="button">
        <img
          class="dashboard-card-icon hours-icon"
          src="assets/work-hours.png"
          alt=""
        />
        <span class="dashboard-card-title">Work Hours</span>
        <span class="dashboard-card-arrow">→</span>
      </button>

      <button class="dashboard-card glow-gold" id="cardEarnings" type="button">
        <img
          class="dashboard-card-icon earnings-icon"
          src="assets/earnings.png"
          alt=""
        />
        <span class="dashboard-card-title">Earnings</span>
        <span class="dashboard-card-arrow">→</span>
      </button>

    </section>

    <button class="summary-card" id="cardSummary" type="button">
      <span class="summary-left">
        <img
          class="summary-icon"
          src="assets/summary.png"
          alt=""
        />
        <span class="summary-text">View Summary</span>
      </span>

      <span class="summary-arrow">→</span>
    </button>

  </main>

  <div id="driverNav"></div>

  <script src="/core/branding.js"></script>

  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      if (window.Branding) {
        await window.Branding.load();
      }
    });
  </script>

  <script src="driver-nav.js"></script>
  <script src="dashboard.js" defer></script>
  <script src="/driver/location.js"></script>

</body>
</html>
