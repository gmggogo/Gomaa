<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sunbeam Driver Dashboard</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.jpeg" />
  <link rel="stylesheet" href="driver.css" />

  <style>
    :root{
      --navy:#04172f;
      --navy2:#0b315f;
      --gold:#ffd226;
      --gold2:#d99a00;
      --gold-dark:#7d5200;
      --white:#ffffff;
      --green:#28ef70;
    }

    *{
      box-sizing:border-box;
    }

    body.driver-dashboard-page{
      margin:0;
      min-height:100dvh;
      color:#fff;
      padding-bottom:150px;
    }

    .dashboard-shell{
      min-height:100dvh;
    }

    /* =========================
       DRIVER HEADER
    ========================= */

    .driver-identity-header{
      display:grid;
      grid-template-columns:auto 1fr auto;
      align-items:center;
      gap:12px;

      padding:
        max(15px,env(safe-area-inset-top))
        18px
        15px;

      background:
        linear-gradient(
          180deg,
          #031329 0%,
          #061b38 100%
        );

      border-bottom:
        4px solid var(--gold);

      box-shadow:
        0 7px 0 rgba(92,60,0,.34),
        0 13px 24px rgba(0,0,0,.22);
    }

    .driver-avatar{
      width:56px;
      height:56px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:50%;

      background:
        radial-gradient(
          circle at 50% 35%,
          #183f70,
          #04162f 72%
        );

      border:
        3px solid var(--gold);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        0 4px 0 rgba(70,45,0,.32);
    }

    .driver-avatar svg{
      width:30px;
      height:30px;
      fill:var(--gold);
    }

    .driver-identity-text{
      min-width:0;
    }

    /* NAME SLIGHTLY SMALLER */
    .driver-name-header{
      color:#fff;

      font-size:22px;
      line-height:1;
      font-weight:900;
      letter-spacing:.2px;

      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .driver-role-header{
      margin-top:5px;

      color:var(--gold);

      font-size:14px;
      font-weight:900;
    }

    /* LOGO TOP RIGHT */
    .driver-header-logo{
      width:124px;
      max-width:31vw;
      height:64px;

      display:flex;
      align-items:center;
      justify-content:flex-end;
    }

    .driver-header-logo img{
      display:block;
      max-width:100%;
      max-height:100%;
      object-fit:contain;

      background:transparent !important;
      border:0 !important;
      box-shadow:none !important;
      filter:none !important;
    }

    /* =========================
       COMPANY TITLE
    ========================= */

    /* MOVED DOWN A LITTLE */
    .dashboard-company{
      margin:
        34px
        18px
        18px;

      text-align:center;

      color:var(--gold);

      font-size:30px;
      line-height:1;
      font-weight:900;
      letter-spacing:1px;

      text-shadow:
        0 2px 0 #765000,
        0 4px 7px rgba(0,0,0,.22);
    }

    /* =========================
       STATUS
    ========================= */

    .status-pill{
      margin:
        0
        18px
        18px;

      min-height:62px;
      padding:
        0
        20px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      border-radius:31px;

      background:
        linear-gradient(
          180deg,
          #0b315d 0%,
          #04172f 100%
        );

      border:
        2px solid rgba(255,210,38,.82);

      box-shadow:
        0 7px 0 rgba(79,51,0,.42),
        0 13px 20px rgba(0,0,0,.18),
        inset 0 1px 0 rgba(255,255,255,.08);
    }

    .status-left{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .status-dot{
      width:22px;
      height:22px;

      border-radius:50%;

      background:var(--green);

      box-shadow:
        0 0 14px rgba(39,242,111,.55);
    }

    .status-label{
      color:#fff;
      font-size:17px;
      font-weight:900;
    }

    .status-value{
      color:var(--green);
      font-size:18px;
      font-weight:900;
    }

    /* =========================
       DASHBOARD GRID
    ========================= */

    .dashboard-scroll{
      padding:
        0
        18px
        28px;
    }

    .dashboard-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }

    .dashboard-card,
    .summary-card{
      position:relative;
      overflow:hidden;

      appearance:none;
      -webkit-tap-highlight-color:transparent;

      color:#fff;
      font-family:inherit;

      cursor:pointer;
    }

    .dashboard-card{
      min-height:176px;
      padding:20px 14px;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:12px;

      border-radius:24px;

      background:
        radial-gradient(
          circle at 24% 14%,
          rgba(74,141,232,.12),
          transparent 35%
        ),
        linear-gradient(
          160deg,
          #0a315e 0%,
          #061c3b 54%,
          #03142d 100%
        );

      border-top:
        3px solid #ffe27a;

      border-left:
        3px solid #edb72a;

      border-right:
        3px solid #9e6800;

      border-bottom:
        5px solid #6f4900;

      box-shadow:
        0 8px 0 rgba(57,36,0,.50),
        0 14px 22px rgba(2,12,30,.24),
        inset 0 1px 0 rgba(255,255,255,.08),
        inset 0 -2px 0 rgba(59,37,0,.26);
    }

    .dashboard-card::after,
    .summary-card::after{
      content:"";

      position:absolute;
      inset:7px;

      border-radius:18px;

      border:
        1.5px solid rgba(255,210,38,.62);

      pointer-events:none;
    }

    /* =========================
       MAIN TRIPS BUTTON
    ========================= */

    #cardTrips{
      grid-column:1 / -1;

      min-height:145px;

      color:#07172d;

      background:
        radial-gradient(
          circle at 24% 15%,
          rgba(255,255,255,.52),
          transparent 32%
        ),
        linear-gradient(
          180deg,
          #ffe86f 0%,
          #ffd226 52%,
          #dda300 100%
        );

      border-top:
        3px solid #fff2a6;

      border-left:
        3px solid #ffdc45;

      border-right:
        3px solid #a36a00;

      border-bottom:
        5px solid #805300;

      box-shadow:
        0 9px 0 rgba(92,58,0,.48),
        0 16px 24px rgba(0,0,0,.23),
        inset 0 2px 0 rgba(255,255,255,.48),
        inset 0 -3px 0 rgba(133,84,0,.20);
    }

    #cardTrips::after{
      border:
        2px solid rgba(105,67,0,.42);
    }

    #cardTrips .dashboard-card-title{
      color:#07172d;

      font-size:29px;
      font-weight:900;

      text-shadow:
        0 1px 0 rgba(255,255,255,.45);
    }

    .dashboard-card-title{
      position:relative;
      z-index:2;

      color:#fff;

      font-size:19px;
      line-height:1.1;
      font-weight:900;

      text-align:center;
    }

    .dashboard-card-icon{
      position:relative;
      z-index:2;

      width:54px;
      height:54px;

      object-fit:contain;

      background:transparent !important;
      border:0 !important;
      box-shadow:none !important;
      filter:none !important;
    }

    .history-icon{
      width:auto;
      height:auto;

      display:block;

      font-size:47px;
      line-height:1;

      background:transparent !important;
      box-shadow:none !important;
      filter:none !important;
    }

    /* =========================
       SUMMARY — CLEANER / BETTER
    ========================= */

    .summary-card{
      width:100%;
      min-height:118px;

      margin-top:14px;
      padding:18px 24px;

      display:grid;
      grid-template-columns:auto 1fr;
      align-items:center;
      justify-items:center;
      gap:16px;

      border-radius:23px;

      background:
        radial-gradient(
          circle at 18% 12%,
          rgba(72,140,230,.12),
          transparent 34%
        ),
        linear-gradient(
          160deg,
          #0a315e 0%,
          #061c3b 54%,
          #03142d 100%
        );

      border-top:
        3px solid #ffe27a;

      border-left:
        3px solid #edb72a;

      border-right:
        3px solid #9e6800;

      border-bottom:
        5px solid #6f4900;

      box-shadow:
        0 8px 0 rgba(57,36,0,.50),
        0 14px 22px rgba(2,12,30,.24),
        inset 0 1px 0 rgba(255,255,255,.08);
    }

    .summary-card::after{
      inset:7px;

      border-radius:17px;

      border:
        1.5px solid rgba(255,210,38,.62);
    }

    .summary-icon-crop{
      position:relative;
      z-index:2;

      width:54px;
      height:54px;

      display:flex;
      align-items:center;
      justify-content:center;

      overflow:hidden;

      border-radius:12px;
    }

    .summary-final-icon{
      width:54px;
      height:54px;

      object-fit:contain;

      background:transparent !important;
      border:0 !important;
      box-shadow:none !important;
      filter:none !important;
    }

    .summary-final-text{
      position:relative;
      z-index:2;

      justify-self:start;

      color:#fff;

      font-size:22px;
      line-height:1;
      font-weight:900;

      white-space:nowrap;
    }

    /* =========================
       CLICK FEEL
    ========================= */

    .dashboard-card:active,
    .summary-card:active{
      transform:translateY(3px);

      box-shadow:
        0 4px 0 rgba(57,36,0,.50),
        0 8px 15px rgba(2,12,30,.22);
    }

    /* =========================
       MOBILE
    ========================= */

    @media(max-width:390px){

      .driver-identity-header{
        padding-left:14px;
        padding-right:14px;
      }

      .driver-avatar{
        width:52px;
        height:52px;
      }

      .driver-name-header{
        font-size:20px;
      }

      .driver-header-logo{
        width:112px;
        height:58px;
      }

      .dashboard-company{
        margin-top:32px;
        font-size:27px;
      }

      .dashboard-scroll{
        padding-left:12px;
        padding-right:12px;
      }

      .dashboard-grid{
        gap:11px;
      }

      .dashboard-card{
        min-height:164px;
        border-radius:22px;
      }

      #cardTrips{
        min-height:138px;
      }

      .dashboard-card-title{
        font-size:17px;
      }

      #cardTrips .dashboard-card-title{
        font-size:27px;
      }

      .summary-card{
        min-height:108px;
        padding-left:20px;
        padding-right:20px;
      }

      .summary-final-text{
        font-size:20px;
      }
    }
  </style>
</head>

<body class="driver-dashboard-page">

  <main class="dashboard-shell">

    <!-- DRIVER HEADER -->
    <section class="driver-identity-header">

      <div class="driver-avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M12 12a4.4 4.4 0 1 0 0-8.8 4.4 4.4 0 0 0 0 8.8zm-7.3 8.2c.5-4.1 3-6.5 7.3-6.5s6.8 2.4 7.3 6.5c.1.7-.4 1.3-1.1 1.3H5.8c-.7 0-1.2-.6-1.1-1.3z"/>
        </svg>
      </div>

      <div class="driver-identity-text">

        <div
          class="driver-name-header"
          id="driverName"
        >
          Driver
        </div>

        <div class="driver-role-header">
          Driver
        </div>

      </div>

      <!-- COMPANY LOGO -->
      <div class="driver-header-logo">
        <img
          class="logo app-logo"
          alt="Company Logo"
        />
      </div>

    </section>

    <!-- COMPANY NAME -->
    <div class="dashboard-company company-name">
      SUNSET
    </div>

    <!-- STATUS -->
    <section
      class="status-pill"
      aria-label="Driver status"
    >

      <div class="status-left">
        <span class="status-dot"></span>
        <span class="status-label">Status:</span>
      </div>

      <span class="status-value">
        ONLINE
      </span>

    </section>

    <!-- DASHBOARD -->
    <div
      class="dashboard-scroll"
      id="dashboardScroll"
    >

      <section class="dashboard-grid">

        <!-- MAIN GOLD BUTTON -->
        <button
          class="dashboard-card"
          id="cardTrips"
          type="button"
        >
          <span class="dashboard-card-title">
            Trips
          </span>
        </button>

        <!-- LIVE MAP -->
        <button
          class="dashboard-card"
          id="cardMap"
          type="button"
        >
          <img
            class="dashboard-card-icon map-icon"
            src="assets/live-map.png"
            alt=""
          />

          <span class="dashboard-card-title">
            Live Map
          </span>
        </button>

        <!-- TRIP HISTORY -->
        <button
          class="dashboard-card"
          id="cardHistory"
          type="button"
        >
          <span
            class="dashboard-card-icon history-icon"
            aria-hidden="true"
          >🕘</span>

          <span class="dashboard-card-title">
            Trip History
          </span>
        </button>

        <!-- WORK HOURS -->
        <button
          class="dashboard-card"
          id="cardHours"
          type="button"
        >
          <img
            class="dashboard-card-icon hours-icon"
            src="assets/work-hours.png"
            alt=""
          />

          <span class="dashboard-card-title">
            Work Hours
          </span>
        </button>

        <!-- EARNINGS -->
        <button
          class="dashboard-card"
          id="cardEarnings"
          type="button"
        >
          <img
            class="dashboard-card-icon earnings-icon"
            src="assets/earnings.png"
            alt=""
          />

          <span class="dashboard-card-title">
            Earnings
          </span>
        </button>

      </section>

      <!-- VIEW SUMMARY -->
      <button
        class="summary-card"
        id="cardSummary"
        type="button"
      >

        <span class="summary-icon-crop">
          <img
            class="summary-final-icon"
            src="assets/summary.png"
            alt=""
          />
        </span>

        <span class="summary-final-text">
          View Summary
        </span>

      </button>

    </div>

  </main>

  <!-- SHARED BOTTOM NAV -->
  <div id="driverNav"></div>

  <!-- APP SCRIPTS -->
  <script src="/core/branding.js"></script>

  <script>
    window.addEventListener(
      "DOMContentLoaded",
      async () => {

        if(window.Branding){
          await window.Branding.load();
        }

      }
    );
  </script>

  <script src="driver-nav.js"></script>
  <script src="dashboard.js" defer></script>
  <script src="/driver/location.js"></script>

</body>
</html>
