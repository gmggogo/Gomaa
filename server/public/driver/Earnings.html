<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Earnings</title>

<link rel="stylesheet" href="driver.css">

<style>
:root{
  --navy:#061a36;
  --navy2:#0d3768;
  --gold:#ffd21f;
  --white:#ffffff;
  --text:#eef4ff;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:'Segoe UI',sans-serif;
}

body.earnings-page{
  color:var(--white);
  background:
    linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,.12)),
    url("assets/map-bg.jpeg") center/cover fixed,
    #dce9f5;
  padding-bottom:128px;
}

.earnings-header{
  background:linear-gradient(180deg,#03182f,#071f40);
  border-bottom:4px solid var(--gold);
  text-align:center;
  padding:22px 14px 17px;
}

.earnings-title{
  margin:0;
  color:var(--gold);
  font-size:34px;
  line-height:1;
  font-weight:900;
  letter-spacing:1px;
}

.earnings-subtitle{
  margin-top:10px;
  font-size:17px;
  font-weight:800;
  color:#fff;
}

.earnings-shell{
  width:min(100%,760px);
  margin:0 auto;
  padding:16px 14px 145px;
}

.filters{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:14px;
}

.filters button{
  min-height:56px;
  border-radius:20px;
  border:1px solid rgba(255,210,31,.62);
  background:linear-gradient(145deg,#0d3768,#061a36);
  color:#fff;
  font-size:15px;
  font-weight:900;
  box-shadow:0 9px 14px rgba(0,0,0,.20);
}

.filters button.active{
  color:#07172d;
  background:linear-gradient(145deg,#ffe159,#ffc400);
}

.earnings-summary{
  border-radius:24px;
  background:linear-gradient(145deg,#0d3768,#061a36);
  border:2px solid rgba(255,210,31,.62);
  box-shadow:0 12px 18px rgba(0,0,0,.20);
  padding:18px 22px 17px;
  margin-bottom:12px;
}

.summary-period{
  color:#d4dceb;
  font-size:15px;
  font-weight:800;
}

.summary-total{
  color:var(--gold);
  font-size:42px;
  line-height:1.05;
  font-weight:900;
  margin-top:10px;
}

.summary-label{
  margin-top:7px;
  color:#fff;
  font-size:15px;
  font-weight:900;
  text-transform:uppercase;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:10px;
}

.stat{
  min-height:102px;
  border-radius:22px;
  background:linear-gradient(145deg,#0d3768,#061a36);
  border:2px solid rgba(255,210,31,.54);
  box-shadow:0 10px 16px rgba(0,0,0,.18);
  padding:14px 16px 13px;
}

.stat small{
  display:block;
  color:#d4dceb;
  font-size:13px;
  line-height:1.2;
  font-weight:900;
  text-transform:uppercase;
}

.stat b{
  display:block;
  margin-top:7px;
  color:#fff;
  font-size:25px;
  line-height:1;
  font-weight:900;
}

#overtimeHours,
#overtimeRate{
  color:var(--gold);
}

#paymentStatus{
  font-size:22px;
}

.day-card{
  border-radius:20px;
  background:linear-gradient(145deg,#0d3768,#061a36);
  border:2px solid rgba(255,210,31,.54);
  box-shadow:0 9px 14px rgba(0,0,0,.18);
  padding:13px 16px;
  margin-top:9px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.day-date{
  color:#fff;
  font-size:15px;
  font-weight:900;
}

.day-hours{
  color:var(--gold);
  font-size:19px;
  font-weight:900;
  white-space:nowrap;
}

.running{
  color:#72f2a2;
  margin-top:4px;
  font-size:10px;
  font-weight:900;
}

.empty,
.error{
  margin-top:10px;
  padding:17px 14px;
  text-align:center;
  border-radius:20px;
  background:linear-gradient(145deg,#0d3768,#061a36);
  border:2px solid rgba(255,210,31,.54);
  color:#fff;
  font-size:14px;
  font-weight:800;
}

@media(max-width:390px){

  .earnings-header{
    padding-top:18px;
    padding-bottom:14px;
  }

  .earnings-title{
    font-size:30px;
  }

  .earnings-subtitle{
    font-size:15px;
    margin-top:7px;
  }

  .earnings-shell{
    padding:13px 11px 140px;
  }

  .filters{
    gap:8px;
    margin-bottom:11px;
  }

  .filters button{
    min-height:50px;
    font-size:13px;
    border-radius:18px;
  }

  .earnings-summary{
    padding:15px 18px 14px;
    border-radius:22px;
    margin-bottom:9px;
  }

  .summary-period{
    font-size:13px;
  }

  .summary-total{
    font-size:36px;
    margin-top:7px;
  }

  .summary-label{
    font-size:13px;
    margin-top:5px;
  }

  .stats{
    gap:8px;
  }

  .stat{
    min-height:88px;
    padding:11px 13px 10px;
    border-radius:19px;
  }

  .stat small{
    font-size:11px;
  }

  .stat b{
    font-size:22px;
    margin-top:5px;
  }

  #paymentStatus{
    font-size:19px;
  }
}
</style>
</head>

<body class="earnings-page">

<header class="earnings-header">
  <h1 class="earnings-title">EARNINGS</h1>
  <div class="earnings-subtitle">Driver earnings summary</div>
</header>

<main class="earnings-shell">

  <section class="filters">
    <button id="btn-today" class="active" type="button">TODAY</button>
    <button id="btn-week" type="button">THIS WEEK</button>
    <button id="btn-month" type="button">THIS MONTH</button>
  </section>

  <section class="earnings-summary">
    <div class="summary-period" id="periodLabel">-</div>
    <div class="summary-total" id="totalDue">$0.00</div>
    <div class="summary-label">Estimated Earnings</div>
  </section>

  <section class="stats">
    <div class="stat">
      <small>Total Hours</small>
      <b id="totalHours">0.00</b>
    </div>

    <div class="stat">
      <small>Regular Hours</small>
      <b id="regularHours">0.00</b>
    </div>

    <div class="stat">
      <small>Overtime Hours</small>
      <b id="overtimeHours">0.00</b>
    </div>

    <div class="stat">
      <small>Payment Status</small>
      <b id="paymentStatus">UNPAID</b>
    </div>

    <div class="stat">
      <small>Hourly Rate</small>
      <b id="hourlyRate">$0.00</b>
    </div>

    <div class="stat">
      <small>Overtime Rate</small>
      <b id="overtimeRate">$0.00</b>
    </div>
  </section>

  <div id="list"></div>

</main>

<div id="driverNav"></div>

<script src="driver-nav.js"></script>
<script src="Earnings.js"></script>

</body>
</html>
