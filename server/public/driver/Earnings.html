<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Earnings</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="stylesheet" href="driver.css">

<style>
:root{
  --navy:#061a36;
  --navy2:#0b315f;
  --gold:#ffd21f;
  --text:#ffffff;
  --muted:#c7d0df;
  --date:#07172d;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
}

body.earnings-page{
  color:var(--text);
  padding-bottom:150px;
}

.earnings-header{
  position:sticky;
  top:0;
  z-index:20;
  text-align:center;
  padding:22px 18px 18px;
  background:
    linear-gradient(
      180deg,
      #03152d 0%,
      #061a36 100%
    );
  border-bottom:4px solid var(--gold);
  box-shadow:0 8px 20px rgba(0,0,0,.28);
}

.earnings-title{
  margin:0;
  color:var(--gold);
  font-size:34px;
  line-height:1;
  font-weight:900;
  letter-spacing:.8px;
  text-shadow:0 2px 3px rgba(0,0,0,.45);
}

.earnings-subtitle{
  margin-top:9px;
  color:#eef3fb;
  font-size:15px;
  font-weight:700;
}

.earnings-shell{
  padding:16px 18px 30px;
}

.filters{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-bottom:16px;
}

.filters button{
  min-height:52px;
  border:1px solid rgba(255,210,31,.42);
  border-radius:16px;
  background:
    linear-gradient(
      180deg,
      #0c315d,
      #061b38
    );
  color:#fff;
  font-size:15px;
  font-weight:900;
  box-shadow:0 6px 12px rgba(0,0,0,.24);
}

.filters button.active{
  color:#06162d;
  background:
    linear-gradient(
      180deg,
      #ffe467,
      #ffc400
    );
  border-color:#ffe676;
  box-shadow:
    0 0 0 2px rgba(255,210,31,.18),
    0 7px 15px rgba(0,0,0,.30);
}

.earnings-summary{
  padding:20px 22px;
  margin-bottom:20px;
  border-radius:25px;
  background:
    linear-gradient(
      145deg,
      #0d3768 0%,
      #061a36 72%
    );
  border:2px solid rgba(255,210,31,.72);
  box-shadow:
    0 9px 0 rgba(91,61,0,.48),
    0 15px 24px rgba(0,0,0,.25);
}

.summary-period{
  color:#eef3fb;
  font-size:13px;
  font-weight:800;
}

.summary-total{
  margin-top:14px;
  color:var(--gold);
  font-size:42px;
  line-height:1;
  font-weight:900;
}

.summary-label{
  margin-top:8px;
  color:#e7edf7;
  font-size:13px;
  font-weight:900;
  text-transform:uppercase;
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-bottom:20px;
}

.stat{
  min-height:104px;
  padding:16px;
  border-radius:20px;
  background:
    linear-gradient(
      145deg,
      #0d3768 0%,
      #061a36 75%
    );
  border:2px solid rgba(255,210,31,.55);
  box-shadow:
    0 7px 0 rgba(78,52,0,.40),
    0 12px 18px rgba(0,0,0,.20);
}

.stat small{
  display:block;
  color:#cdd6e4;
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
}

.stat b{
  display:block;
  margin-top:7px;
  color:#fff;
  font-size:24px;
  font-weight:900;
}

.stat.total-due b,
.stat.ot b{
  color:var(--gold);
}

.day-card{
  padding:15px 18px;
  margin-bottom:14px;
  border-radius:20px;
  background:
    linear-gradient(
      145deg,
      #0d3768 0%,
      #061a36 75%
    );
  border:2px solid rgba(255,210,31,.62);
  box-shadow:
    0 7px 0 rgba(78,52,0,.42),
    0 12px 18px rgba(0,0,0,.20);
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
}

.day-date{
  color:#fff;
  font-size:16px;
  font-weight:900;
}

.day-hours{
  padding:9px 14px;
  border-radius:999px;
  background:var(--gold);
  color:#07172d;
  font-size:14px;
  font-weight:900;
  white-space:nowrap;
}

.running{
  margin-top:5px;
  color:#72f2a2;
  font-size:11px;
  font-weight:900;
}

.empty,
.error{
  margin-top:20px;
  padding:26px 18px;
  text-align:center;
  border-radius:22px;
  background:
    linear-gradient(
      145deg,
      #0d3768,
      #061a36
    );
  border:2px solid rgba(255,210,31,.55);
  color:#fff;
  font-weight:800;
}

@media(max-width:390px){

  .earnings-title{
    font-size:29px;
  }

  .earnings-shell{
    padding-left:12px;
    padding-right:12px;
  }

  .filters button{
    font-size:13px;
  }

  .summary-total{
    font-size:38px;
  }

  .stat{
    min-height:98px;
    padding:14px;
  }

  .stat b{
    font-size:21px;
  }

  .day-hours{
    padding:8px 11px;
    font-size:12px;
  }
}
</style>
</head>

<body class="earnings-page">

<header class="earnings-header">
  <h1 class="earnings-title">EARNINGS</h1>
  <div class="earnings-subtitle">Driver earnings summary</div>
</header>

<main class="earnings-shell">

  <section class="filters">
    <button id="btn-today" type="button">TODAY</button>
    <button id="btn-week" type="button">THIS WEEK</button>
    <button id="btn-month" type="button">THIS MONTH</button>
  </section>

  <section class="earnings-summary">
    <div class="summary-period" id="periodLabel">-</div>
    <div class="summary-total" id="totalDue">$0.00</div>
    <div class="summary-label">Estimated Earnings</div>
  </section>

  <section class="stats">

    <div class="stat">
      <small>Total Hours</small>
      <b id="totalHours">0.00</b>
    </div>

    <div class="stat">
      <small>Regular Hours</small>
      <b id="regularHours">0.00</b>
    </div>

    <div class="stat ot">
      <small>Overtime Hours</small>
      <b id="overtimeHours">0.00</b>
    </div>

    <div class="stat">
      <small>Payment Status</small>
      <b id="paymentStatus">UNPAID</b>
    </div>

    <div class="stat">
      <small>Hourly Rate</small>
      <b id="hourlyRate">$0.00</b>
    </div>

    <div class="stat ot">
      <small>Overtime Rate</small>
      <b id="overtimeRate">$0.00</b>
    </div>

  </section>

  <div id="list"></div>

</main>

<div id="driverNav"></div>

<script src="driver-nav.js"></script>
<script src="Earnings.js"></script>

</body>
</html>
