<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Driver Map</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<link rel="stylesheet" href="driver.css">

<style>
:root{
  --navy:#03152f;
  --navy2:#08234a;
  --blue:#2f7df6;
  --green:#22c55e;
  --red:#ef4444;
  --yellow:#facc15;
  --purple:#9d63ff;
  --text:#fff;
  --muted:#94a3b8;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#07162f;color:#fff}

.map-page{
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.map-top{
  flex:0 0 auto;
  padding:max(10px,env(safe-area-inset-top)) 12px 9px;
  background:linear-gradient(180deg,rgba(2,6,23,.98),rgba(3,21,47,.94));
  border-bottom:1px solid rgba(255,255,255,.08);
  z-index:20;
}

.trip-head{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  align-items:center;
}

.trip-head-left{min-width:0}
.trip-head-label{
  color:#8696ac;
  font-size:8px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
}
#navText{
  margin-top:3px;
  color:#fff;
  font-size:17px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.gps-badge{
  padding:7px 10px;
  border-radius:999px;
  color:#8ff0ad;
  background:rgba(34,197,94,.11);
  border:1px solid rgba(74,222,128,.25);
  font-size:9px;
  font-weight:900;
}

.current-stop-card{
  margin-top:8px;
  padding:10px;
  border-radius:17px;
  background:rgba(8,35,74,.90);
  border:1px solid rgba(255,255,255,.08);
}

.stop-meta{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:center;
}
.stop-type{
  padding:5px 8px;
  border-radius:999px;
  color:#7df0a3;
  background:rgba(34,197,94,.12);
  font-size:9px;
  font-weight:900;
  text-transform:uppercase;
}
.stop-type.dropoff{
  color:#ff9d9d;
  background:rgba(239,68,68,.12);
}
.stop-progress{
  color:#9fb0c5;
  font-size:9px;
  font-weight:800;
}

.stop-address{
  margin-top:7px;
  color:#fff;
  font-size:13px;
  line-height:1.35;
  font-weight:800;
}

.passenger-strip{
  margin-top:8px;
  display:flex;
  gap:6px;
  overflow-x:auto;
  scrollbar-width:none;
}
.passenger-strip::-webkit-scrollbar{display:none}
.passenger-chip{
  flex:0 0 auto;
  max-width:170px;
  padding:7px 9px;
  border-radius:12px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.07);
}
.passenger-chip strong{
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:10px;
}
.passenger-chip span{
  display:block;
  margin-top:2px;
  color:#8fa0b7;
  font-size:8px;
}

.map-wrap{
  position:relative;
  flex:1 1 auto;
  min-height:0;
  overflow:hidden;
}

#map{
  position:absolute;
  inset:0;
  background:
    linear-gradient(rgba(234,240,245,.72),rgba(234,240,245,.72)),
    url("assets/map-background.png") center/cover no-repeat;
}

.map-note{
  position:absolute;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  max-width:88%;
  padding:6px 9px;
  border-radius:999px;
  color:#53657a;
  background:rgba(255,255,255,.90);
  border:1px solid rgba(55,83,112,.13);
  font-size:8px;
  font-weight:800;
  z-index:5;
  pointer-events:none;
}

#recenterBtn{
  position:absolute;
  right:12px;
  bottom:12px;
  width:44px;
  height:44px;
  border:0;
  border-radius:50%;
  background:#061a38;
  color:#fff;
  font-size:18px;
  box-shadow:0 6px 16px rgba(0,0,0,.24);
  z-index:6;
}

.action-panel{
  flex:0 0 auto;
  padding:9px 12px calc(94px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(3,21,47,.97),rgba(2,13,31,.99));
  border-top:1px solid rgba(255,255,255,.08);
}

.action-info{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:center;
  margin-bottom:7px;
}

#waitTimer{
  min-width:74px;
  padding:8px 10px;
  border-radius:12px;
  text-align:center;
  color:#ffd43b;
  background:rgba(250,204,21,.10);
  border:1px solid rgba(250,204,21,.22);
  font-size:18px;
  font-weight:900;
  font-variant-numeric:tabular-nums;
}

.stop-status{
  color:#9babc0;
  font-size:10px;
  font-weight:800;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.btn{
  min-height:44px;
  border:0;
  border-radius:14px;
  padding:9px 10px;
  color:#fff;
  font-size:11px;
  font-weight:900;
  cursor:pointer;
}
.btn.primary{background:#2f7df6}
.btn.green{background:#169447}
.btn.red{background:#c93f3f}
.btn.gold{background:#c99718}
.btn.dark{background:#173153}
.btn.full{grid-column:1/-1}
.btn:disabled{opacity:.4;cursor:not-allowed}

#noShowBox{
  display:none;
  position:absolute;
  left:12px;
  right:12px;
  bottom:calc(96px + env(safe-area-inset-bottom));
  z-index:100;
  padding:12px;
  flex-direction:column;
  border-radius:18px;
  background:#04152f;
  border:1px solid rgba(255,255,255,.10);
  box-shadow:0 14px 30px rgba(0,0,0,.35);
}
#noShowHeader{display:flex;align-items:center;justify-content:space-between;gap:10px}
#noShowTitle{font-size:14px;font-weight:900}
#btnCloseNoShow{
  width:34px;height:34px;border:0;border-radius:10px;background:#182b49;color:#fff;font-weight:900
}
#noShowNotes{
  width:100%;
  min-height:86px;
  margin-top:9px;
  padding:10px;
  resize:none;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.10);
  background:#020d20;
  color:#fff;
  font:inherit;
}
#btnCompleteNoShow{margin-top:9px;background:#c93f3f}

@media(max-width:390px){
  #navText{font-size:15px}
  .current-stop-card{padding:9px}
  .stop-address{font-size:12px}
  .action-panel{padding-left:10px;padding-right:10px}
  .btn{min-height:42px;font-size:10px}
}
</style>
</head>

<body>

<div class="map-page">

  <header class="map-top">

    <div class="trip-head">
      <div class="trip-head-left">
        <div class="trip-head-label">Current Action</div>
        <div id="navText">Loading trip...</div>
      </div>

      <div class="gps-badge" id="gpsBadge">
        GPS
      </div>
    </div>

    <section class="current-stop-card" id="tripInfo">

      <div class="stop-meta">
        <span class="stop-type" id="stopTypeBadge">PICKUP</span>
        <span class="stop-progress" id="stopProgress">Stop 1</span>
      </div>

      <div class="stop-address" id="currentStopAddress">
        Loading stop...
      </div>

      <div class="passenger-strip" id="currentPassengers"></div>

    </section>

  </header>

  <main class="map-wrap">

    <div id="map"></div>

    <div class="map-note">
      Map display only — route order comes from server
    </div>

    <button id="recenterBtn" type="button" aria-label="Recenter map">
      ◎
    </button>

  </main>

  <section class="action-panel">

    <div class="action-info">
      <div class="stop-status" id="stopStatusText">
        Waiting for trip data
      </div>

      <div id="waitTimer" style="display:none">
        10:00
      </div>
    </div>

    <div class="actions">

      <button id="btnGoogle" class="btn primary full" type="button">
        Directions
      </button>

      <button id="btnArrived" class="btn green" type="button">
        Arrived
      </button>

      <button id="btnCallClient" class="btn dark" type="button">
        Call
      </button>

      <button id="btnStart" class="btn green" type="button">
        Picked Up
      </button>

      <button id="btnNoShow" class="btn red" type="button">
        No Show
      </button>

      <button id="btnCompleteStop" class="btn gold full" type="button">
        Complete Dropoff
      </button>

    </div>

  </section>

  <div id="noShowBox">

    <div id="noShowHeader">
      <div id="noShowTitle">Enter no show reason</div>
      <button id="btnCloseNoShow" type="button">✕</button>
    </div>

    <textarea
      id="noShowNotes"
      placeholder="Reason for no show"></textarea>

    <button id="btnCompleteNoShow" class="btn" type="button">
      Complete No Show
    </button>

  </div>

  <div id="driverNav"></div>

</div>

<script src="driver-nav.js"></script>
<script src="map.js"></script>

</body>
</html>
