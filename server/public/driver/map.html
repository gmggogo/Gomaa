<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Driver Map</title>

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,viewport-fit=cover"
>

<link rel="stylesheet" href="driver.css">

<style>
:root{
  --bg:#031329;
  --panel:#061b38;
  --panel2:#082449;
  --line:rgba(255,255,255,.09);
  --text:#ffffff;
  --muted:#93a4ba;
  --blue:#2f7df6;
  --green:#139447;
  --red:#d34242;
  --gold:#c48c12;
  --soft:#173250;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button,textarea{
  font:inherit;
}

button{
  touch-action:manipulation;
}

.map-page{
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:var(--bg);
}

/* ================= MAP ================= */

.map-wrap{
  position:relative;
  flex:0 0 48%;
  min-height:260px;
  overflow:hidden;
  background:#dce5ec;
  border-bottom:1px solid var(--line);
}

#map{
  position:absolute;
  inset:0;
}

.map-top{
  position:absolute;
  top:max(12px,env(safe-area-inset-top));
  left:12px;
  right:12px;
  z-index:7;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
  pointer-events:none;
}

.map-card{
  pointer-events:auto;
  min-width:118px;
  max-width:46%;
  padding:9px 11px;
  border-radius:15px;
  color:#fff;
  background:rgba(3,19,41,.92);
  border:1px solid rgba(255,255,255,.11);
  box-shadow:0 7px 20px rgba(0,0,0,.18);
  backdrop-filter:blur(8px);
}

.map-card-label{
  color:#87a2c2;
  font-size:9px;
  line-height:1;
  font-weight:900;
  letter-spacing:.6px;
  text-transform:uppercase;
}

#tripTimeValue{
  margin-top:5px;
  font-size:16px;
  line-height:1;
  font-weight:900;
  white-space:nowrap;
}

.map-right{
  display:flex;
  align-items:center;
  gap:7px;
  pointer-events:auto;
}

#currentActionBadge,
#gpsBadge{
  min-height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:7px 10px;
  border-radius:999px;
  font-size:9px;
  font-weight:900;
  white-space:nowrap;
  background:rgba(3,19,41,.92);
  border:1px solid rgba(255,255,255,.11);
  backdrop-filter:blur(8px);
}

#currentActionBadge{
  color:#a9cbff;
}

#gpsBadge{
  color:#7ff1a1;
}

#eyeBtn{
  width:36px;
  height:36px;
  border:1px solid rgba(255,255,255,.11);
  border-radius:50%;
  color:#fff;
  background:rgba(3,19,41,.92);
  font-size:18px;
  font-weight:900;
  backdrop-filter:blur(8px);
}

.map-bottom{
  position:absolute;
  left:12px;
  bottom:12px;
  z-index:7;
  display:flex;
  align-items:center;
  gap:7px;
  max-width:calc(100% - 80px);
}

#stopProgress{
  padding:7px 10px;
  border-radius:999px;
  color:#d7e4f6;
  background:rgba(3,19,41,.90);
  border:1px solid rgba(255,255,255,.10);
  font-size:9px;
  font-weight:900;
  white-space:nowrap;
  backdrop-filter:blur(8px);
}

#recenterBtn{
  position:absolute;
  right:12px;
  bottom:12px;
  z-index:8;
  width:46px;
  height:46px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:50%;
  color:#fff;
  background:#061a38;
  font-size:21px;
  font-weight:900;
  box-shadow:0 7px 18px rgba(0,0,0,.24);
}

/* ================= EXECUTION PANEL ================= */

.execution-panel{
  position:relative;
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  padding:0 12px calc(92px + env(safe-area-inset-bottom));
  background:
    linear-gradient(
      180deg,
      rgba(4,21,45,.99),
      rgba(2,12,27,.99)
    );
  scrollbar-width:none;
}

.execution-panel::-webkit-scrollbar{
  display:none;
}

/* ================= LOCATION ================= */

.location-block{
  padding:13px 4px 11px;
  border-bottom:1px solid var(--line);
}

.location-title{
  display:flex;
  align-items:center;
  gap:7px;
  color:#68a6ff;
  font-size:9px;
  line-height:1;
  font-weight:900;
  letter-spacing:.65px;
  text-transform:uppercase;
}

.location-pin{
  font-size:15px;
}

#currentStopAddress{
  margin-top:7px;
  color:#fff;
  font-size:14px;
  line-height:1.38;
  font-weight:800;
  overflow-wrap:anywhere;
}

#stopStatusText{
  margin-top:5px;
  color:#8fa3bb;
  font-size:9px;
  line-height:1.3;
  font-weight:700;
}

/* ================= TIMER ================= */

#waitTimer{
  display:none;
  width:100%;
  padding:15px 4px 13px;
  text-align:center;
  color:#2f82ff;
  font-size:45px;
  line-height:1;
  font-weight:900;
  letter-spacing:1px;
  font-variant-numeric:tabular-nums;
  border-bottom:1px solid var(--line);
}

/* ================= PASSENGERS ================= */

#passengersSection{
  display:none;
}

#currentPassengers{
  width:100%;
}

.passenger-row{
  min-height:66px;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:10px;
  align-items:center;
  padding:9px 2px;
  border-bottom:1px solid var(--line);
}

.passenger-row.simple{
  min-height:58px;
}

.passenger-main{
  min-width:0;
  display:flex;
  align-items:center;
  gap:9px;
}

.passenger-avatar{
  flex:0 0 38px;
  width:38px;
  height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  color:#fff;
  background:linear-gradient(180deg,#5ca0ff,#2f7df6);
  font-size:18px;
  line-height:1;
  overflow:hidden;
}

.passenger-name-wrap{
  min-width:0;
}

.passenger-name-line{
  min-width:0;
  display:flex;
  align-items:center;
  gap:7px;
}

.passenger-name-line strong{
  min-width:0;
  color:#fff;
  font-size:13px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.passenger-call{
  flex:0 0 34px;
  width:34px;
  height:34px;
  border-radius:50%;
  border:1px solid rgba(47,125,246,.35);
  color:#55a0ff;
  background:rgba(47,125,246,.08);
  font-size:15px;
  font-weight:900;
}

.passenger-state{
  display:inline-flex;
  margin-top:3px;
  padding:3px 7px;
  border-radius:999px;
  font-size:8px;
  line-height:1;
  font-weight:900;
  letter-spacing:.2px;
}

.passenger-state.picked{
  color:#84f3a3;
  background:rgba(34,197,94,.10);
  border:1px solid rgba(34,197,94,.18);
}

.passenger-state.cancelled,
.passenger-state.noshow{
  color:#ff9c9c;
  background:rgba(239,68,68,.10);
  border:1px solid rgba(239,68,68,.18);
}

.passenger-actions{
  display:flex;
  align-items:center;
  gap:7px;
}

.passenger-btn{
  min-height:39px;
  min-width:76px;
  padding:8px 10px;
  border-radius:11px;
  border:0;
  color:#fff;
  font-size:10px;
  font-weight:900;
  white-space:nowrap;
}

.passenger-btn.pickup{
  background:#2f7df6;
}

.passenger-btn.danger{
  color:#ff7777;
  background:rgba(211,66,66,.06);
  border:1px solid rgba(239,68,68,.60);
}

/* ================= PRIMARY ACTION ================= */

.primary-action-wrap{
  padding:11px 0 0;
}

#btnPrimaryAction{
  width:100%;
  min-height:47px;
  border:0;
  border-radius:14px;
  padding:10px 12px;
  color:#fff;
  font-size:11px;
  font-weight:900;
}

#btnPrimaryAction.blue{background:#2f7df6;}
#btnPrimaryAction.green{background:#139447;}
#btnPrimaryAction.gold{background:#a4740e;}
#btnPrimaryAction.red{background:#c94040;}
#btnPrimaryAction.muted{
  color:#8290a4;
  background:#12243d;
}

#btnPrimaryAction:disabled{
  cursor:not-allowed;
}

#btnStartRide{
  display:none;
  width:min(100%,540px);
  min-height:49px;
  margin:12px auto 2px;
  border:1px solid rgba(255,255,255,.05);
  border-radius:15px;
  color:#74849a;
  background:#12243a;
  font-size:13px;
  font-weight:900;
  transition:.18s ease;
}

#btnStartRide.ready{
  color:#fff;
  background:#139447;
  border-color:rgba(80,240,130,.16);
}

#btnStartRide:disabled{
  opacity:1;
}

/* ================= MODALS ================= */

.modal-backdrop{
  display:none;
  position:absolute;
  inset:0;
  z-index:1000;
  align-items:flex-end;
  justify-content:center;
  padding:12px 12px calc(92px + env(safe-area-inset-bottom));
  background:rgba(0,0,0,.48);
}

.modal-sheet{
  width:100%;
  max-width:560px;
  padding:14px;
  border-radius:20px;
  background:#071a36;
  border:1px solid rgba(255,255,255,.11);
  box-shadow:0 18px 40px rgba(0,0,0,.38);
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.modal-title{
  font-size:15px;
  font-weight:900;
}

.modal-close{
  width:34px;
  height:34px;
  border:0;
  border-radius:10px;
  color:#fff;
  background:#183251;
  font-weight:900;
}

#reasonPassenger{
  margin-top:3px;
  color:#8fa4bd;
  font-size:10px;
  font-weight:800;
}

#reasonNotes{
  width:100%;
  min-height:92px;
  margin-top:10px;
  padding:10px;
  resize:none;
  border-radius:13px;
  border:1px solid rgba(255,255,255,.10);
  color:#fff;
  background:#020e21;
  outline:none;
}

#btnSubmitReason{
  width:100%;
  min-height:45px;
  margin-top:9px;
  border:0;
  border-radius:13px;
  color:#fff;
  background:#c94040;
  font-size:11px;
  font-weight:900;
}

.details-content{
  max-height:55dvh;
  overflow-y:auto;
  margin-top:10px;
}

.detail-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.detail-grid>div{
  min-width:0;
  padding:9px;
  border-radius:12px;
  background:#0b2548;
  border:1px solid rgba(255,255,255,.07);
}

.detail-grid span{
  display:block;
  color:#8397b1;
  font-size:8px;
  font-weight:800;
}

.detail-grid strong{
  display:block;
  margin-top:3px;
  color:#fff;
  font-size:10px;
  line-height:1.3;
  overflow-wrap:anywhere;
}

.detail-passengers{
  margin-top:9px;
}

.detail-passenger{
  padding:9px 0;
  border-bottom:1px solid var(--line);
  color:#9eb0c6;
  font-size:9px;
  line-height:1.45;
}

.detail-passenger strong{
  display:block;
  color:#fff;
  font-size:11px;
  margin-bottom:3px;
}

/* ================= MOBILE ================= */

@media(max-width:390px){
  .map-wrap{
    flex-basis:45%;
    min-height:235px;
  }

  .map-card{
    min-width:108px;
    padding:8px 9px;
  }

  #tripTimeValue{
    font-size:15px;
  }

  #currentActionBadge{
    display:none;
  }

  .execution-panel{
    padding-left:10px;
    padding-right:10px;
  }

  #currentStopAddress{
    font-size:13px;
  }

  #waitTimer{
    font-size:40px;
    padding-top:13px;
    padding-bottom:12px;
  }

  .passenger-avatar{
    flex-basis:34px;
    width:34px;
    height:34px;
  }

  .passenger-name-line strong{
    font-size:12px;
  }

  .passenger-call{
    width:32px;
    height:32px;
    flex-basis:32px;
  }

  .passenger-actions{
    gap:5px;
  }

  .passenger-btn{
    min-width:69px;
    min-height:37px;
    padding:7px 8px;
    font-size:9px;
  }
}
</style>
</head>

<body>

<div class="map-page">

  <main class="map-wrap">

    <div id="map"></div>

    <div class="map-top">

      <div class="map-card">
        <div class="map-card-label">Trip Time</div>
        <div id="tripTimeValue">--:--</div>
      </div>

      <div class="map-right">
        <div id="currentActionBadge">PICKUP</div>
        <div id="gpsBadge">GPS</div>

        <button
          id="eyeBtn"
          type="button"
          aria-label="View trip details"
        >
          ◉
        </button>
      </div>

    </div>

    <div class="map-bottom">
      <div id="stopProgress">Stop 1</div>
    </div>

    <button
      id="recenterBtn"
      type="button"
      aria-label="Recenter map"
    >
      ◎
    </button>

  </main>

  <section class="execution-panel">

    <div class="location-block">

      <div class="location-title">
        <span class="location-pin">●</span>
        <span id="locationLabel">PICKUP LOCATION</span>
      </div>

      <div id="currentStopAddress">
        Loading stop...
      </div>

      <div id="stopStatusText">
        Loading trip...
      </div>

    </div>

    <div id="waitTimer">10:00</div>

    <section id="passengersSection">
      <div id="currentPassengers"></div>
    </section>

    <div class="primary-action-wrap">
      <button
        id="btnPrimaryAction"
        class="blue"
        type="button"
      >
        DIRECTIONS
      </button>
    </div>

    <button
      id="btnStartRide"
      type="button"
      disabled
    >
      START RIDE
    </button>

  </section>

  <div
    class="modal-backdrop"
    id="reasonBox"
  >

    <div class="modal-sheet">

      <div class="modal-head">
        <div>
          <div
            class="modal-title"
            id="reasonTitle"
          >
            Reason
          </div>

          <div id="reasonPassenger"></div>
        </div>

        <button
          class="modal-close"
          id="btnCloseReason"
          type="button"
        >
          ✕
        </button>
      </div>

      <textarea
        id="reasonNotes"
        placeholder="Enter reason"></textarea>

      <button
        id="btnSubmitReason"
        type="button"
      >
        SUBMIT
      </button>

    </div>

  </div>

  <div
    class="modal-backdrop"
    id="detailsBox"
  >

    <div class="modal-sheet">

      <div class="modal-head">
        <div class="modal-title">
          Trip Details
        </div>

        <button
          class="modal-close"
          id="btnCloseDetails"
          type="button"
        >
          ✕
        </button>
      </div>

      <div
        class="details-content"
        id="detailsContent"
      ></div>

    </div>

  </div>

  <div id="driverNav"></div>

</div>

<script src="driver-nav.js"></script>
<script src="map.js"></script>

</body>
</html>
