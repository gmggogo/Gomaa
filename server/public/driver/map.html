<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Driver Map</title>

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,viewport-fit=cover"
>

<link rel="stylesheet" href="driver.css">

<style>
:root{
  --bg:#031329;
  --panel:#061b38;
  --panel2:#082449;
  --line:rgba(255,255,255,.09);
  --text:#ffffff;
  --muted:#93a4ba;
  --blue:#2f7df6;
  --green:#139447;
  --red:#d34242;
  --gold:#c48c12;
  --soft:#173250;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button,textarea{
  font:inherit;
}

button{
  touch-action:manipulation;
}

.map-page{
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:var(--bg);
}

/* ================= MAP ================= */

.map-wrap{
  position:relative;
  flex:0 0 48%;
  min-height:260px;
  overflow:hidden;
  background:#dce5ec;
  border-bottom:1px solid var(--line);
}

#map{
  position:absolute;
  inset:0;
}

.map-top{
  position:absolute;
  top:max(12px,env(safe-area-inset-top));
  left:12px;
  right:12px;
  z-index:7;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
  pointer-events:none;
}

.map-card{
  pointer-events:auto;
  min-width:118px;
  max-width:46%;
  padding:9px 11px;
  border-radius:15px;
  color:#fff;
  background:rgba(3,19,41,.92);
  border:1px solid rgba(255,255,255,.11);
  box-shadow:0 7px 20px rgba(0,0,0,.18);
  backdrop-filter:blur(8px);
}

.map-card-label{
  color:#87a2c2;
  font-size:9px;
  line-height:1;
  font-weight:900;
  letter-spacing:.6px;
  text-transform:uppercase;
}

#tripTimeValue{
  margin-top:5px;
  font-size:16px;
  line-height:1;
  font-weight:900;
  white-space:nowrap;
}

.map-right{
  display:flex;
  align-items:center;
  gap:7px;
  pointer-events:auto;
}

#currentActionBadge,
#gpsBadge{
  min-height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:7px 10px;
  border-radius:999px;
  font-size:9px;
  font-weight:900;
  white-space:nowrap;
  background:rgba(3,19,41,.92);
  border:1px solid rgba(255,255,255,.11);
  backdrop-filter:blur(8px);
}

#currentActionBadge{
  color:#a9cbff;
}

#gpsBadge{
  color:#7ff1a1;
}


.map-bottom{
  position:absolute;
  left:12px;
  bottom:12px;
  z-index:7;
  display:flex;
  align-items:center;
  gap:7px;
  max-width:calc(100% - 80px);
}

#stopProgress{
  padding:7px 10px;
  border-radius:999px;
  color:#d7e4f6;
  background:rgba(3,19,41,.90);
  border:1px solid rgba(255,255,255,.10);
  font-size:9px;
  font-weight:900;
  white-space:nowrap;
  backdrop-filter:blur(8px);
}



/* ================= RETRO TOP / MAP INFO ================= */

.map-card,
#currentActionBadge,
#gpsBadge,
#stopProgress{
  border-radius:7px;
  backdrop-filter:none;

  background:
    linear-gradient(
      180deg,
      #173862 0%,
      #0b2344 58%,
      #05162d 100%
    );

  border-top:3px solid rgba(255,255,255,.98);
  border-left:3px solid rgba(255,255,255,.98);
  border-right:3px solid rgba(0,0,0,.68);
  border-bottom:3px solid rgba(0,0,0,.78);

  box-shadow:
    0 3px 0 rgba(0,0,0,.65),
    0 7px 16px rgba(0,0,0,.22),
    inset 0 0 0 1px rgba(0,0,0,.20);

  color:#fff;
  text-shadow:0 1px 0 rgba(0,0,0,.65);
}

.map-card-label{
  color:#9ebbe0;
}

#tripTimeValue{
  color:#fff;
}

#currentActionBadge{
  color:#b9d4ff;
}

#gpsBadge{
  color:#d8ffe4;

  background:
    linear-gradient(
      180deg,
      #3e8d56 0%,
      #1f6f3a 58%,
      #0e4a26 100%
    );
}

#stopProgress{
  color:#fff;
}

/* ================= EXECUTION PANEL ================= */

.execution-panel{
  position:relative;
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  padding:0 12px calc(92px + env(safe-area-inset-bottom));
  background:
    linear-gradient(
      180deg,
      rgba(4,21,45,.99),
      rgba(2,12,27,.99)
    );
  scrollbar-width:none;
}

.execution-panel::-webkit-scrollbar{
  display:none;
}

/* ================= LOCATION ================= */

.location-block{
  padding:13px 4px 11px;
  border-bottom:1px solid var(--line);
}

.location-title{
  display:flex;
  align-items:center;
  gap:7px;
  color:#68a6ff;
  font-size:9px;
  line-height:1;
  font-weight:900;
  letter-spacing:.65px;
  text-transform:uppercase;
}

.location-pin{
  font-size:15px;
}

#currentStopAddress{
  margin-top:7px;
  color:#fff;
  font-size:14px;
  line-height:1.38;
  font-weight:800;
  overflow-wrap:anywhere;
}

#stopStatusText{
  margin-top:5px;
  color:#8fa3bb;
  font-size:9px;
  line-height:1.3;
  font-weight:700;
}

/* ================= TIMER ================= */

#waitTimer{
  display:none;
  width:100%;
  padding:15px 4px 13px;
  text-align:center;
  color:#2f82ff;
  font-size:45px;
  line-height:1;
  font-weight:900;
  letter-spacing:1px;
  font-variant-numeric:tabular-nums;
  border-bottom:1px solid var(--line);
}


/* ================= RETRO LOCATION / TIMER ================= */

.location-block{
  margin-top:10px;
  padding:12px 11px;
  border-radius:7px;

  background:
    linear-gradient(
      180deg,
      #173862 0%,
      #0b2344 58%,
      #05162d 100%
    );

  border-top:3px solid #ffffff;
  border-left:3px solid #ffffff;
  border-right:3px solid #5f5f5f;
  border-bottom:3px solid #4b4b4b;

  box-shadow:
    0 3px 0 rgba(0,0,0,.65),
    inset 0 0 0 1px rgba(0,0,0,.18);
}

.location-title{
  color:#74b3ff;
  text-shadow:0 1px 0 rgba(0,0,0,.65);
}

#currentStopAddress{
  color:#fff;
  text-shadow:0 1px 0 rgba(0,0,0,.65);
}

#stopStatusText{
  color:#a8bdd7;
}

#waitTimer{
  margin-top:10px;
  border-radius:7px;
  color:#57a3ff;

  background:
    linear-gradient(
      180deg,
      #173862,
      #0b2344 58%,
      #05162d
    );

  border-top:3px solid #ffffff;
  border-left:3px solid #ffffff;
  border-right:3px solid #5a5a5a;
  border-bottom:3px solid #454545;

  box-shadow:
    0 3px 0 rgba(0,0,0,.65),
    inset 0 0 0 1px rgba(0,0,0,.18);

  text-shadow:0 1px 0 #fff;
}

/* ================= PASSENGERS ================= */

#passengersSection{
  display:none;
  padding-top:10px;
}

#currentPassengers{
  width:100%;
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
}

/*
  RETRO WINDOWS / METALLIC 3D CARD
  Every rider has one independent box.
*/
.passenger-row{
  width:100%;
  min-height:118px;
  display:block;
  padding:10px;
  border-radius:8px;

  color:#111;
  background:
    linear-gradient(
      180deg,
      #173862 0%,
      #0b2344 52%,
      #05162d 100%
    );

  border-top:3px solid #ffffff;
  border-left:3px solid #ffffff;
  border-right:3px solid #6c6c6c;
  border-bottom:3px solid #5a5a5a;

  box-shadow:
    0 4px 0 #111827,
    0 8px 16px rgba(0,0,0,.28),
    inset 0 0 0 2px rgba(0,0,0,.16);
}

.passenger-row.simple{
  min-height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.passenger-row.picked-card{
  background:
    linear-gradient(
      180deg,
      #c9f6bc 0%,
      #72cf62 55%,
      #3e9f37 100%
    );

  border-top-color:#efffe9;
  border-left-color:#efffe9;
  border-right-color:#2f6f2a;
  border-bottom-color:#245a20;
}

.passenger-row.cancelled-card,
.passenger-row.noshow-card{
  background:
    linear-gradient(
      180deg,
      #f4d4d4 0%,
      #daa0a0 55%,
      #be7777 100%
    );

  border-top-color:#fff0f0;
  border-left-color:#fff0f0;
  border-right-color:#7b4141;
  border-bottom-color:#653434;
}

.passenger-main{
  width:100%;
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.passenger-name-wrap{
  width:100%;
  min-width:0;
}

.passenger-name-line{
  width:100%;
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.passenger-name-line strong{
  display:block;
  width:100%;
  min-width:0;
  color:#fff;
  font-size:16px;
  line-height:1.2;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-shadow:0 1px 0 rgba(0,0,0,.65);
}

.passenger-actions{
  width:100%;
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
  margin-top:11px;
}

/*
  ONE BUTTON FAMILY FOR THE WHOLE DRIVER MAP:
  classic raised/beveled Windows-style controls.
*/
.passenger-btn,
#btnPrimaryAction,
#btnStartRide,
.modal-close,
#btnSubmitReason{
  border-radius:6px;

  border-top:3px solid rgba(255,255,255,.95);
  border-left:3px solid rgba(255,255,255,.95);
  border-right:3px solid rgba(0,0,0,.58);
  border-bottom:3px solid rgba(0,0,0,.70);

  box-shadow:
    0 3px 0 rgba(0,0,0,.65),
    inset 0 0 0 1px rgba(0,0,0,.22);

  font-weight:900;
  text-shadow:0 1px 0 rgba(255,255,255,.42);
  transition:
    transform .05s ease,
    filter .05s ease;
}

.passenger-btn:active:not(:disabled),
#btnPrimaryAction:active:not(:disabled),
#btnStartRide:active:not(:disabled),
.modal-close:active:not(:disabled),
#btnSubmitReason:active:not(:disabled){
  transform:translateY(2px);

  border-top-color:rgba(0,0,0,.52);
  border-left-color:rgba(0,0,0,.52);
  border-right-color:rgba(255,255,255,.78);
  border-bottom-color:rgba(255,255,255,.78);

  box-shadow:
    0 1px 0 rgba(0,0,0,.65),
    inset 0 2px 4px rgba(0,0,0,.20);
}

.passenger-btn{
  min-width:0;
  min-height:58px;
  padding:6px 5px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  color:#111;
  font-size:19px;
  line-height:1;
}

.passenger-btn span{
  display:block;
  margin-top:2px;
  font-size:10px;
  line-height:1;
  font-weight:1000;
  letter-spacing:.1px;
}

.passenger-btn.pickup{
  color:#fff;
  background:
    linear-gradient(
      180deg,
      #214f82,
      #0e315d 58%,
      #071c38
    );
}

.passenger-btn.danger{
  color:#6f0808;
  background:
    linear-gradient(
      180deg,
      #ffe1e1,
      #e9a6a6 58%,
      #c97575
    );
}

.passenger-btn.call{
  color:#ffffff;
  background:
    linear-gradient(
      180deg,
      #214f82,
      #0e315d 58%,
      #071c38
    );
}

.passenger-btn:disabled{
  opacity:.48;
  filter:grayscale(.55);
}

.passenger-final-state{
  width:100%;
  min-height:58px;
  margin-top:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;

  border-radius:5px;

  color:#0e4b14;
  background:
    linear-gradient(
      180deg,
      rgba(244,255,241,.75),
      rgba(139,205,125,.72)
    );

  border-top:3px solid rgba(255,255,255,.90);
  border-left:3px solid rgba(255,255,255,.90);
  border-right:3px solid rgba(31,91,29,.65);
  border-bottom:3px solid rgba(31,91,29,.78);

  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.15);

  font-size:22px;
  font-weight:1000;
  letter-spacing:.4px;
  text-shadow:0 1px 0 rgba(255,255,255,.75);
}

.cancelled-card .passenger-final-state,
.noshow-card .passenger-final-state{
  color:#6a0b0b;
  background:
    linear-gradient(
      180deg,
      rgba(255,239,239,.8),
      rgba(218,139,139,.74)
    );

  border-right-color:rgba(106,11,11,.58);
  border-bottom-color:rgba(106,11,11,.72);
}

/* ================= PRIMARY ACTION ================= */

.primary-action-wrap{
  padding:12px 0 0;
}

#btnPrimaryAction{
  width:100%;
  min-height:54px;
  padding:9px 12px;
  color:#111;
  font-size:11px;
  font-weight:1000;
}

#btnPrimaryAction.blue{
  color:#fff;
  background:linear-gradient(180deg,#214f82,#0e315d 58%,#071c38);
  text-shadow:0 1px 0 rgba(0,0,0,.70);
}

#btnPrimaryAction.green{
  background:linear-gradient(180deg,#dff6df,#92d092 58%,#62aa62);
}

#btnPrimaryAction.gold{
  color:#fff;
  background:linear-gradient(180deg,#214f82,#0e315d 58%,#071c38);
  text-shadow:0 1px 0 rgba(0,0,0,.70);
}

#btnPrimaryAction.red{
  background:linear-gradient(180deg,#ffd7d7,#dc8d8d 58%,#b95656);
}

#btnPrimaryAction.muted{
  color:#879ab2;
  background:linear-gradient(180deg,#18314f,#10243e 58%,#09172a);
}

#btnPrimaryAction:disabled{
  cursor:not-allowed;
  opacity:.52;
}

#btnStartRide{
  display:none;
  width:min(100%,540px);
  min-height:56px;
  margin:13px auto 3px;
  padding:8px 12px;
  color:#8092aa;
  background:linear-gradient(180deg,#173758,#0d2849 58%,#07182d);
  opacity:.55;
  pointer-events:none;
  font-size:13px;
  font-weight:1000;
}

#btnStartRide.ready{
  color:#0c4411;
  background:linear-gradient(180deg,#e2f9dd,#96d487 58%,#66ad58);
  opacity:1;
  pointer-events:auto;
}

#btnStartRide:disabled{
  color:#8092aa;
  background:linear-gradient(180deg,#173758,#0d2849 58%,#07182d);
  opacity:.55;
  pointer-events:none;
}

/* ================= MODALS ================= */

.modal-backdrop{
  display:none;
  position:absolute;
  inset:0;
  z-index:1000;
  align-items:flex-end;
  justify-content:center;
  padding:12px 12px calc(92px + env(safe-area-inset-bottom));
  background:rgba(0,0,0,.48);
}

.modal-sheet{
  width:100%;
  max-width:560px;
  padding:14px;
  border-radius:20px;
  background:#071a36;
  border:1px solid rgba(255,255,255,.11);
  box-shadow:0 18px 40px rgba(0,0,0,.38);
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.modal-title{
  font-size:15px;
  font-weight:900;
}

.modal-close{
  width:34px;
  height:34px;
  border:0;
  border-radius:10px;
  color:#fff;
  background:#183251;
  font-weight:900;
}

#reasonPassenger{
  margin-top:3px;
  color:#8fa4bd;
  font-size:10px;
  font-weight:800;
}

#reasonNotes{
  width:100%;
  min-height:92px;
  margin-top:10px;
  padding:10px;
  resize:none;
  border-radius:13px;
  border:1px solid rgba(255,255,255,.10);
  color:#fff;
  background:#020e21;
  outline:none;
}

#btnSubmitReason{
  width:100%;
  min-height:45px;
  margin-top:9px;
  border:0;
  border-radius:13px;
  color:#fff;
  background:#c94040;
  font-size:11px;
  font-weight:900;
}

.details-content{
  max-height:55dvh;
  overflow-y:auto;
  margin-top:10px;
}

.detail-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.detail-grid>div{
  min-width:0;
  padding:9px;
  border-radius:12px;
  background:#0b2548;
  border:1px solid rgba(255,255,255,.07);
}

.detail-grid span{
  display:block;
  color:#8397b1;
  font-size:8px;
  font-weight:800;
}

.detail-grid strong{
  display:block;
  margin-top:3px;
  color:#fff;
  font-size:10px;
  line-height:1.3;
  overflow-wrap:anywhere;
}

.detail-passengers{
  margin-top:9px;
}

.timer-detail-grid{
  margin-top:9px;
}

.detail-passenger{
  padding:9px 0;
  border-bottom:1px solid var(--line);
  color:#9eb0c6;
  font-size:9px;
  line-height:1.45;
}

.detail-passenger strong{
  display:block;
  color:#fff;
  font-size:11px;
  margin-bottom:3px;
}


/* ================= RETRO CONTROL OVERRIDES ================= */

.modal-close{
  color:#111;
  background:linear-gradient(180deg,#f4f4f4,#c6c6c6 58%,#929292);
}

#btnSubmitReason{
  color:#5d0808;
  background:linear-gradient(180deg,#ffdede,#df9696 58%,#b96060);
}

/* ================= MOBILE ================= */

@media(max-width:390px){
  .map-wrap{
    flex-basis:45%;
    min-height:235px;
  }

  .map-card{
    min-width:108px;
    padding:8px 9px;
  }

  #tripTimeValue{
    font-size:15px;
  }

  #currentActionBadge{
    display:none;
  }

  .execution-panel{
    padding-left:10px;
    padding-right:10px;
  }

  #currentStopAddress{
    font-size:13px;
  }

  #waitTimer{
    font-size:40px;
    padding-top:13px;
    padding-bottom:12px;
  }

  .passenger-avatar{
    flex-basis:34px;
    width:34px;
    height:34px;
  }

  .passenger-name-line strong{
    font-size:12px;
  }

  .passenger-call{
    width:32px;
    height:32px;
    flex-basis:32px;
  }

  .passenger-actions{
    gap:5px;
  }

  .passenger-btn{
    min-width:69px;
    min-height:37px;
    padding:7px 8px;
    font-size:9px;
  }
}


@media(max-width:390px){

  #currentPassengers{
    gap:8px;
  }

  .passenger-row{
    min-height:108px;
    padding:8px;
  }

  .passenger-name-line strong{
    font-size:14px;
  }

  .passenger-actions{
    gap:6px;
    margin-top:9px;
  }

  .passenger-btn{
    min-height:52px;
    padding:5px 3px;
    font-size:17px;
  }

  .passenger-btn span{
    font-size:9px;
  }

  .passenger-final-state{
    min-height:52px;
    font-size:19px;
  }
}

</style>
</head>

<body>

<div class="map-page">

  <main class="map-wrap">

    <div id="map"></div>

    <div class="map-top">

      <div class="map-card">
        <div class="map-card-label">Trip Time</div>
        <div id="tripTimeValue">--:--</div>
      </div>

      <div class="map-right">
        <div id="currentActionBadge">PICKUP</div>
        <div id="gpsBadge">GPS</div>
</div>

    </div>

    <div class="map-bottom">
      <div id="stopProgress">Stop 1</div>
    </div>
</main>

  <section class="execution-panel">

    <div class="location-block">

      <div class="location-title">
        <span class="location-pin">●</span>
        <span id="locationLabel">PICKUP LOCATION</span>
      </div>

      <div id="currentStopAddress">
        Loading stop...
      </div>

      <div id="stopStatusText">
        Loading trip...
      </div>

    </div>

    <div id="waitTimer">10:00</div>

    <section id="passengersSection">
      <div id="currentPassengers"></div>
    </section>

    <div class="primary-action-wrap">
      <button
        id="btnPrimaryAction"
        class="blue"
        type="button"
      >
        DIRECTIONS
      </button>
    </div>

    <button
      id="btnStartRide"
      type="button"
      disabled
      aria-disabled="true"
    >
      START RIDE
    </button>

  </section>

  <div
    class="modal-backdrop"
    id="reasonBox"
  >

    <div class="modal-sheet">

      <div class="modal-head">
        <div>
          <div
            class="modal-title"
            id="reasonTitle"
          >
            Reason
          </div>

          <div id="reasonPassenger"></div>
        </div>

        <button
