<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Driver Trips</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<style>
:root{--navy:#03152f;--navy2:#08234a;--blue:#2f7df6;--cyan:#27d8f7;--green:#2bd968;--yellow:#ffd43b;--red:#ff5b5b;--purple:#a66cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{color:#fff;background:linear-gradient(rgba(255,255,255,.05),rgba(255,255,255,.05)),url("assets/map-background.png") center top/cover no-repeat}
.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.header{flex:0 0 auto;padding:max(14px,env(safe-area-inset-top)) 16px 12px;background:linear-gradient(180deg,rgba(2,6,23,.96),rgba(3,21,47,.90));border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(12px);z-index:20}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.header-small{color:#8fa0b8;font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase}
.header-title{margin-top:3px;font-size:25px;font-weight:900}
.trip-count{min-width:46px;height:44px;padding:0 13px;display:flex;align-items:center;justify-content:center;border-radius:17px;background:rgba(47,125,246,.16);border:1px solid rgba(79,155,255,.34);color:#b9dbff;font-weight:900}
.scroll-area{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:14px 14px 18px}.scroll-area::-webkit-scrollbar{display:none}
.container{max-width:760px;margin:0 auto}.empty{margin-top:35px;padding:28px 18px;border-radius:24px;text-align:center;background:rgba(3,21,47,.88);border:1px solid rgba(255,255,255,.08);color:#c9d2df}
.trip-card{position:relative;margin-bottom:14px;padding:16px;border-radius:24px;overflow:hidden;background:radial-gradient(circle at 25% 15%,rgba(47,125,246,.09),transparent 35%),linear-gradient(150deg,#04142d,#08234a 55%,#04142d);border:1px solid rgba(255,255,255,.09);box-shadow:0 12px 28px rgba(0,0,0,.22)}
.trip-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:#758398}.trip-active:before{background:var(--blue)}.trip-completed:before{background:var(--green)}.trip-cancelled:before{background:var(--red)}.trip-noshow:before{background:var(--yellow)}
.trip-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.trip-no{color:#8290a5;font-size:10px;font-weight:900;letter-spacing:1px;text-transform:uppercase}.trip-time{margin-top:4px;font-size:22px;font-weight:900}
.service{padding:7px 10px;border-radius:999px;color:#dcbfff;background:rgba(166,108,255,.13);border:1px solid rgba(166,108,255,.28);font-size:10px;font-weight:900;letter-spacing:.5px;text-transform:uppercase}.service.shared{color:#8eefff;background:rgba(39,216,247,.12);border-color:rgba(39,216,247,.28)}
.passenger{margin-top:13px;display:flex;align-items:center;gap:10px}.avatar{width:42px;height:42px;flex:0 0 auto;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#173a70,#0d284e);border:1px solid rgba(255,255,255,.1);color:#d8e9ff;font-size:17px;font-weight:900}.passenger-data{min-width:0;flex:1}.passenger-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:17px;font-weight:900}.passenger-sub{margin-top:2px;color:#9eacc0;font-size:11px}
.phone-btn,.eye-btn,.map-btn{display:flex;align-items:center;justify-content:center;border:0}.phone-btn{width:40px;height:40px;border-radius:13px;color:#fff;background:#178f49;text-decoration:none}.phone-btn svg,.eye-btn svg,.map-btn svg,.nav svg{width:20px;height:20px;fill:currentColor}
.route{margin-top:14px;display:grid;gap:9px}.address-row{display:grid;grid-template-columns:34px 1fr 34px;gap:9px;align-items:center;padding:11px;border-radius:16px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.055)}
.marker{width:28px;height:28px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}.pickup{color:#73f39b;background:rgba(43,217,104,.13)}.dropoff{color:#ff9d9d;background:rgba(255,91,91,.13)}
.address-label{color:#7f8da2;font-size:9px;font-weight:900;letter-spacing:1px;text-transform:uppercase}.address-text{margin-top:3px;color:#f0f5fc;font-size:13px;font-weight:700;line-height:1.35}.map-btn{width:34px;height:34px;border-radius:11px;color:#9eefff;background:rgba(39,216,247,.10)}
.shared-route{margin-top:14px;padding:12px;border-radius:18px;background:rgba(4,17,40,.72);border:1px solid rgba(39,216,247,.15)}.shared-head{display:flex;justify-content:space-between;margin-bottom:8px}.shared-head strong{color:#90efff;font-size:13px}.shared-head span{color:#8090a7;font-size:10px;font-weight:800}.shared-stop{position:relative;display:grid;grid-template-columns:30px 1fr;gap:9px;padding:7px 0}.shared-stop:not(:last-child):after{content:"";position:absolute;left:14px;top:35px;bottom:-4px;width:2px;background:rgba(255,255,255,.08)}.stop-number{width:28px;height:28px;z-index:1;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#10294f;border:1px solid rgba(255,255,255,.10);font-size:11px;font-weight:900}.stop-top{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.stop-type{font-size:9px;font-weight:900;letter-spacing:.8px}.stop-type.pickup{color:#72ef99;background:none}.stop-type.dropoff{color:#ff9c9c;background:none}.stop-name{font-size:12px;font-weight:900}.stop-address{margin-top:2px;color:#a9b5c7;font-size:11px;line-height:1.35}
.card-bottom{margin-top:14px;display:flex;align-items:center;gap:8px}.status-box{flex:1;min-height:42px;display:flex;align-items:center;justify-content:center;padding:9px 12px;border-radius:14px;font-size:12px;font-weight:900}.status-Dispatched{background:#66768b}.status-OnTrip{background:#2563eb}.status-Arrived{background:#7b4ed7}.status-Completed{background:#1d9d53}.status-Cancelled{background:#d74747}.status-NoShow{background:#e3bd2b;color:#141414}
.eye-btn{width:42px;height:42px;border-radius:14px;border:1px solid rgba(255,212,59,.26);background:rgba(255,212,59,.10);color:#ffe477}.extra-panel{display:none;margin-top:10px;padding:12px;border-radius:15px;background:#020d20;border:1px solid rgba(255,255,255,.07)}.extra-panel.open{display:block}.extra-block+.extra-block{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.07)}.extra-title{color:#8190a5;font-size:9px;font-weight:900;letter-spacing:1px;text-transform:uppercase}.extra-text{margin-top:5px;color:#e2e9f2;font-size:12px;line-height:1.5;white-space:pre-wrap}
.open-btn{width:100%;min-height:48px;margin-top:10px;border:0;border-radius:16px;color:#fff;background:linear-gradient(90deg,#2f7df6,#2457d3);font-size:14px;font-weight:900}
.nav{flex:0 0 auto;min-height:82px;padding:7px 8px max(8px,env(safe-area-inset-bottom));display:flex;justify-content:space-around;align-items:center;background:linear-gradient(145deg,rgba(255,255,255,.17),rgba(255,255,255,.03)),linear-gradient(180deg,#747f8e,#414c5c 48%,#111a29);border-top:1px solid rgba(255,255,255,.22);backdrop-filter:blur(14px)}.nav button{min-width:55px;padding:5px 4px;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;background:transparent;color:#ced5df;font-size:10px}.nav button.active{color:#ffd226}
</style>
</head>
<body>
<div class="app">
<header class="header"><div class="header-row"><div><div class="header-small">Driver App</div><div class="header-title">My Trips</div></div><div class="trip-count" id="tripCount">0</div></div></header>
<main class="scroll-area"><div class="container" id="container"></div></main>
<nav class="nav">
<button onclick="location.href='dashboard.html'"><svg viewBox="0 0 24 24"><path d="M3.5 11.2 12 4l8.5 7.2v8.8a1 1 0 0 1-1 1h-5.5v-6h-4v6H4.5a1 1 0 0 1-1-1z"/></svg>Home</button>
<button class="active"><svg viewBox="0 0 24 24"><path d="M6 8.5 8 5.8h8L18 8.5h1a2 2 0 0 1 2 2v4.7a1 1 0 0 1-1 1h-1v1.8H5v-1.8H4a1 1 0 0 1-1-1v-4.7a2 2 0 0 1 2-2z"/></svg>Trips</button>
<button onclick="location.href='map.html'"><svg viewBox="0 0 24 24"><path d="M12 22s6-6.2 6-11a6 6 0 1 0-12 0c0 4.8 6 11 6 11zm0-8.2a2.8 2.8 0 1 1 0-5.6 2.8 2.8 0 0 1 0 5.6z"/></svg>Map</button>
<button onclick="location.href='chat.html'"><svg viewBox="0 0 24 24"><path d="M12 4c4.9 0 8.8 3.3 8.8 7.4s-3.9 7.4-8.8 7.4c-1.1 0-2.2-.2-3.2-.5L4 20l1.5-4.1c-1.5-1.3-2.3-2.8-2.3-4.5C3.2 7.3 7.1 4 12 4z"/></svg>Chat</button>
<button onclick="logoutDriver()"><svg viewBox="0 0 24 24"><path d="M6 3h7v2H7v14h6v2H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm7 5.2 1.4-1.4 5 5-5 5-1.4-1.4 2.6-2.6H10v-2h5.6z"/></svg>Logout</button>
</nav>
</div>
<script src="trips.js"></script>
<script>
function logoutDriver(){localStorage.removeItem("driverToken");localStorage.removeItem("loggedDriver");localStorage.removeItem("token");localStorage.removeItem("role");localStorage.removeItem("user");location.href="login.html";}
</script>
</body>
</html>
