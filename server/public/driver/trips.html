<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Driver Trips</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<style>
:root{
  --navy:#03152f;
  --navy2:#08234a;
  --blue:#2f7df6;
  --cyan:#27d8f7;
  --green:#22c55e;
  --yellow:#ffd43b;
  --red:#ef4444;
  --purple:#a66cff;
  --text:#ffffff;
  --muted:#94a3b8;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
  color:#fff;
  background:
    linear-gradient(rgba(255,255,255,.05),rgba(255,255,255,.05)),
    url("assets/map-background.png") center top / cover no-repeat;
}

.app{
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ================= HEADER ================= */

.header{
  flex:0 0 auto;
  padding:max(12px,env(safe-area-inset-top)) 14px 10px;
  background:linear-gradient(180deg,rgba(2,6,23,.97),rgba(3,21,47,.91));
  border-bottom:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(12px);
  z-index:20;
}

.header-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.header-small{
  color:#8fa0b8;
  font-size:10px;
  font-weight:800;
  letter-spacing:1.3px;
  text-transform:uppercase;
}

.header-title{
  margin-top:2px;
  font-size:22px;
  font-weight:900;
}

.today-label{
  padding:7px 10px;
  border-radius:999px;
  color:#c7d7ec;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  font-size:10px;
  font-weight:800;
}

/* ================= COUNTERS ================= */

.stats{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:6px;
  margin-top:8px;
}

.stat{
  min-height:46px;
  padding:7px 4px;
  border-radius:13px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:rgba(5,23,50,.86);
  border:1px solid rgba(255,255,255,.08);
}

.stat span{
  color:#8fa0b8;
  font-size:7px;
  font-weight:900;
  letter-spacing:.8px;
  text-transform:uppercase;
}

.stat strong{
  margin-top:3px;
  font-size:18px;
  line-height:1;
  font-weight:900;
}

.stat.today strong{color:#b9dbff;}
.stat.tomorrow strong{color:#38d4ff;}
.stat.completed strong{color:#71e99a;}
.stat.remaining strong{color:#ffd76a;}

/* ================= LIVE MESSAGE ================= */

.trip-alert{
  margin-top:7px;
  min-height:38px;
  padding:9px 12px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  background:rgba(34,197,94,.10);
  border:1px solid rgba(74,222,128,.28);
  color:#8ff0ad;
  font-size:11px;
  font-weight:900;
  letter-spacing:.7px;
  text-transform:uppercase;
}

.trip-alert .light{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#22c55e;
  box-shadow:0 0 12px rgba(34,197,94,.85);
  animation:tripPulse 1.05s ease-in-out infinite;
}

.trip-alert.done{
  color:#cbd5e1;
  background:rgba(255,255,255,.05);
  border-color:rgba(255,255,255,.08);
}

.trip-alert.done .light{
  background:#64748b;
  box-shadow:none;
  animation:none;
}

@keyframes tripPulse{
  0%,100%{
    opacity:1;
    transform:scale(1);
  }
  50%{
    opacity:.35;
    transform:scale(.76);
  }
}

/* ================= SCROLL ================= */

.scroll-area{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  padding:12px 14px 150px;
}

.scroll-area::-webkit-scrollbar{
  display:none;
}

.container{
  max-width:760px;
  margin:0 auto;
  padding-bottom:20px;
}

/* ================= EMPTY ================= */

.empty{
  margin-top:26px;
  padding:26px 18px;
  border-radius:24px;
  text-align:center;
  background:rgba(3,21,47,.88);
  border:1px solid rgba(255,255,255,.08);
  color:#c9d2df;
  line-height:1.6;
}

/* ================= CURRENT LABEL ================= */

.current-label{
  margin:0 0 9px;
  color:#a8b7ca;
  font-size:10px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
}

/* ================= CARD ================= */

.trip-card{
  position:relative;
  margin-bottom:14px;
  padding:14px;
  border-radius:22px;
  overflow:hidden;
  background:
    radial-gradient(circle at 25% 15%,rgba(47,125,246,.09),transparent 35%),
    linear-gradient(150deg,#04142d,#08234a 55%,#04142d);
  border:1px solid rgba(255,255,255,.09);
  box-shadow:0 12px 28px rgba(0,0,0,.22);
}

.trip-card::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:5px;
  background:#758398;
}

.trip-active::before{background:var(--blue);}
.trip-completed::before{background:var(--green);}
.trip-cancelled::before{background:var(--red);}
.trip-noshow::before{background:var(--yellow);}

.trip-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}

.trip-no{
  color:#8290a5;
  font-size:10px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
}

.trip-time{
  margin-top:4px;
  font-size:22px;
  font-weight:900;
}

.service{
  padding:7px 10px;
  border-radius:999px;
  color:#dcbfff;
  background:rgba(166,108,255,.13);
  border:1px solid rgba(166,108,255,.28);
  font-size:10px;
  font-weight:900;
  letter-spacing:.5px;
  text-transform:uppercase;
}

.service.shared{
  color:#8eefff;
  background:rgba(39,216,247,.12);
  border-color:rgba(39,216,247,.28);
}

/* ================= PASSENGER ================= */

.passenger{
  margin-top:10px;
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:42px;
  height:42px;
  flex:0 0 auto;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(145deg,#173a70,#0d284e);
  border:1px solid rgba(255,255,255,.1);
  color:#d8e9ff;
  font-size:17px;
  font-weight:900;
}

.passenger-data{
  min-width:0;
  flex:1;
}

.passenger-name{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:17px;
  font-weight:900;
}

.passenger-sub{
  margin-top:2px;
  color:#9eacc0;
  font-size:11px;
}

.phone-btn,
.eye-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  border:0;
}

.phone-btn{
  width:40px;
  height:40px;
  border-radius:13px;
  color:#fff;
  background:#178f49;
  text-decoration:none;
}

.phone-btn svg,
.eye-btn svg,
.nav svg{
  width:20px;
  height:20px;
  fill:currentColor;
}

/* ================= ROUTE ================= */

.route{
  margin-top:10px;
  display:grid;
  gap:9px;
}

.address-row{
  display:grid;
  grid-template-columns:34px 1fr;
  gap:9px;
  align-items:center;
  padding:11px;
  border-radius:16px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.055);
  cursor:default;
}

.marker{
  width:28px;
  height:28px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:900;
}

.marker.pickup{
  color:#73f39b;
  background:rgba(43,217,104,.13);
}

.marker.dropoff{
  color:#ff9d9d;
  background:rgba(255,91,91,.13);
}

.address-label{
  color:#7f8da2;
  font-size:9px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
}

.address-text{
  margin-top:3px;
  color:#f0f5fc;
  font-size:13px;
  font-weight:700;
  line-height:1.35;
  cursor:default;
  user-select:text;
}

/* ================= SHARED ================= */

.shared-route{
  margin-top:10px;
  padding:10px;
  border-radius:16px;
  background:rgba(4,17,40,.72);
  border:1px solid rgba(39,216,247,.15);
}

.shared-head{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
}

.shared-head strong{
  color:#90efff;
  font-size:13px;
}

.shared-head span{
  color:#8090a7;
  font-size:10px;
  font-weight:800;
}

.shared-stop{
  position:relative;
  display:grid;
  grid-template-columns:30px 1fr;
  gap:9px;
  padding:5px 0;
}

.shared-stop:not(:last-child)::after{
  content:"";
  position:absolute;
  left:14px;
  top:35px;
  bottom:-4px;
  width:2px;
  background:rgba(255,255,255,.08);
}

.stop-number{
  width:28px;
  height:28px;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#10294f;
  border:1px solid rgba(255,255,255,.10);
  font-size:11px;
  font-weight:900;
}

.stop-top{
  display:flex;
  gap:7px;
  align-items:center;
  flex-wrap:wrap;
}

.stop-type{
  font-size:9px;
  font-weight:900;
  letter-spacing:.8px;
}

.stop-type.pickup{color:#72ef99;}
.stop-type.dropoff{color:#ff9c9c;}

.stop-name{
  font-size:12px;
  font-weight:900;
}

.stop-address{
  margin-top:2px;
  color:#a9b5c7;
  font-size:10.5px;
  line-height:1.3;
}

/* ================= STATUS + EYE ================= */

.card-bottom{
  margin-top:14px;
  display:flex;
  align-items:center;
  gap:8px;
}

.status-box{
  flex:1;
  min-height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:9px 12px;
  border-radius:14px;
  font-size:12px;
  font-weight:900;
}

.status-Dispatched{
  background:#16a34a;
  color:#fff;
  border:1px solid rgba(74,222,128,.28);
}

.status-OnTrip{background:#2563eb;}
.status-Arrived{background:#7b4ed7;}
.status-Completed{background:#1d9d53;}
.status-Cancelled{background:#d74747;}
.status-NoShow{background:#e3bd2b;color:#141414;}
.status-NotCompleted{background:#64748b;}

.eye-btn{
  width:46px;
  height:42px;
  border-radius:14px;
  border:1px solid rgba(255,212,59,.42);
  background:rgba(255,212,59,.16);
  color:#ffe477;
  cursor:pointer;
  box-shadow:none;
}

.extra-panel{
  display:none;
  margin-top:10px;
  padding:12px;
  border-radius:15px;
  background:#020d20;
  border:1px solid rgba(255,255,255,.07);
}

.extra-panel.open{
  display:block;
}

.extra-block + .extra-block{
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid rgba(255,255,255,.07);
}

.extra-title{
  color:#8190a5;
  font-size:9px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
}

.extra-text{
  margin-top:5px;
  color:#e2e9f2;
  font-size:12px;
  line-height:1.5;
  white-space:pre-wrap;
}

/* ================= OPEN TRIP ================= */

.open-btn{
  width:100%;
  min-height:44px;
  margin-top:8px;
  border:0;
  border-radius:16px;
  color:#fff;
  background:linear-gradient(90deg,#2f7df6,#2457d3);
  font-size:14px;
  font-weight:900;
  cursor:pointer;
}

@media(max-width:390px){
  .header{
    padding-left:12px;
    padding-right:12px;
  }

  .stats{
    gap:6px;
  }

  .stat{
    min-height:52px;
    border-radius:14px;
  }

  .stat strong{
    font-size:19px;
  }

  .scroll-area{
    padding:12px;
  }
}

/* ===== CURRENT STATUS / NOTE / EYE ===== */
.current-status-row{
  margin-top:10px;
  display:flex;
  justify-content:center;
}

.current-status-pill{
  min-height:34px;
  padding:7px 18px;
  border-radius:999px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:900;
  letter-spacing:.5px;
  text-transform:uppercase;
}

.current-status-pill.status-Dispatched{
  background:#16a34a;
  color:#fff;
  border:1px solid rgba(74,222,128,.34);
}

.current-status-pill.status-OnTrip{
  background:#2563eb;
  color:#fff;
}

.current-status-pill.status-Arrived{
  background:#7b4ed7;
  color:#fff;
}

.current-status-pill.status-Completed{
  background:#1d9d53;
  color:#fff;
}

.current-status-pill.status-Cancelled{
  background:#d74747;
  color:#fff;
}

.current-status-pill.status-NoShow{
  background:#e3bd2b;
  color:#111827;
}

.current-status-pill.status-NotCompleted{
  background:#64748b;
  color:#fff;
}

.note-box{
  margin-top:10px;
  padding:10px 12px;
  border-radius:16px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.07);
}

.note-box-label{
  color:#f6d56a;
  font-size:9px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
}

.note-box-text{
  margin-top:5px;
  min-height:16px;
  color:#eef3f8;
  font-size:12px;
  font-weight:700;
  line-height:1.45;
  white-space:pre-wrap;
}

.note-eye-row{
  margin-top:7px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.note-eye-row .eye-btn{
  width:48px;
  height:40px;
}



/* =========================================
   FINAL TRIPS SCREEN
========================================= */

.header{
  padding:max(10px,env(safe-area-inset-top)) 12px 10px;
}

.stats{
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:6px;
  margin-top:0;
}

.stat{
  min-width:0;
  min-height:62px;
  padding:7px 3px;
  border-radius:15px;
}

.stat span{
  font-size:7px;
  line-height:1.1;
  letter-spacing:.45px;
  text-align:center;
}

.stat strong{
  font-size:19px;
}

.stat.noshow strong{
  color:#ffd43b;
}

.stat.cancelled strong{
  color:#ff5a5a;
}

.trip-alert{
  margin-top:9px;
  min-height:42px;
  font-size:10.5px;
}

.scroll-area{
  padding:10px 12px calc(112px + env(safe-area-inset-bottom));
}

.container{
  max-width:760px;
  padding-bottom:8px;
}

.current-label{
  display:none;
}

.trip-card{
  padding:12px;
  border-radius:22px;
  overflow:visible;
}

.trip-meta-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:6px;
}

.trip-meta-box{
  min-width:0;
  min-height:60px;
  padding:8px 6px;
  border-radius:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:rgba(2,13,32,.58);
  border:1px solid rgba(255,255,255,.08);
}

.trip-meta-label{
  color:#9aa8bc;
  font-size:8px;
  font-weight:900;
  letter-spacing:.7px;
  text-transform:uppercase;
}

.trip-meta-value{
  width:100%;
  margin-top:5px;
  color:#fff;
  font-size:12px;
  line-height:1.15;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.current-status-row{
  margin-top:9px;
}

.current-status-pill{
  width:100%;
  min-height:38px;
  border-radius:13px;
  font-size:12px;
}

.trip-summary-row{
  margin-top:10px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 2px;
}

.trip-summary-row .avatar{
  width:44px;
  height:44px;
  border-radius:14px;
}

.trip-summary-row .passenger-name{
  font-size:16px;
}

.trip-summary-row .passenger-sub{
  font-size:10px;
}

.shared-count{
  margin-left:auto;
  padding-left:10px;
  border-left:1px solid rgba(255,255,255,.10);
  display:grid;
  grid-template-columns:auto auto;
  align-items:baseline;
  column-gap:5px;
  flex:0 0 auto;
}

.shared-count strong{
  color:#43a0ff;
  font-size:20px;
  font-weight:900;
}

.shared-count span{
  color:#fff;
  font-size:11px;
  font-weight:800;
}

.shared-count small{
  grid-column:2;
  color:#9ba9bd;
  font-size:9px;
  font-weight:700;
}

.compact-route{
  margin-top:10px;
  padding:4px 2px;
  border-top:1px solid rgba(255,255,255,.08);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.compact-route-row{
  display:grid;
  grid-template-columns:36px 1fr;
  gap:9px;
  align-items:center;
  min-height:58px;
  padding:8px 2px;
}

.compact-route-row + .compact-route-row{
  border-top:1px solid rgba(255,255,255,.07);
}

.route-pin{
  width:32px;
  height:32px;
  border-radius:50% 50% 50% 8px;
  transform:rotate(-45deg);
  display:flex;
  align-items:center;
  justify-content:center;
}

.route-pin::after{
  content:"";
  width:9px;
  height:9px;
  border-radius:50%;
  background:#07162f;
}

.route-pin.pickup{
  background:#22c55e;
}

.route-pin.dropoff{
  background:#ef4444;
}

.compact-route-label{
  color:#7cf19d;
  font-size:10px;
  font-weight:900;
  letter-spacing:.6px;
  text-transform:uppercase;
}

.compact-route-row:last-child .compact-route-label{
  color:#ff8d8d;
}

.compact-route-label span{
  margin-left:5px;
  color:#8f9db1;
  font-weight:700;
  letter-spacing:0;
  text-transform:none;
}

.compact-route-address{
  margin-top:4px;
  color:#f5f7fb;
  font-size:12px;
  font-weight:700;
  line-height:1.3;
}

.note-box{
  margin-top:9px;
  padding:9px 10px;
  border-radius:14px;
}

.note-box-text{
  min-height:14px;
  font-size:11px;
}

.details-row{
  margin-top:8px;
  display:flex;
  justify-content:center;
}

.details-row .eye-btn{
  width:48px;
  height:38px;
}

.notification-btn{
  width:100%;
  min-height:44px;
  margin-top:9px;
  border:0;
  border-radius:14px;
  color:#fff;
  background:linear-gradient(90deg,#2f7df6,#2457d3);
  font-size:13px;
  font-weight:900;
  text-transform:uppercase;
  cursor:pointer;
}

.open-btn{
  display:none !important;
}

.extra-panel.open{
  max-height:34vh;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}

@media(max-width:390px){

  .header{
    padding-left:10px;
    padding-right:10px;
  }

  .stats{
    gap:5px;
  }

  .stat{
    min-height:58px;
    border-radius:13px;
  }

  .stat span{
    font-size:6.5px;
  }

  .stat strong{
    font-size:18px;
  }

  .trip-alert{
    min-height:39px;
    padding:8px;
    font-size:9.5px;
  }

  .scroll-area{
    padding:8px 10px calc(106px + env(safe-area-inset-bottom));
  }

  .trip-card{
    padding:10px;
  }

  .trip-meta-box{
    min-height:56px;
    padding:7px 4px;
  }

  .trip-meta-label{
    font-size:7px;
  }

  .trip-meta-value{
    font-size:11px;
  }

  .shared-count span{
    font-size:10px;
  }

  .compact-route-row{
    min-height:54px;
  }

}



/* =========================================
   EYE — PASSENGER DETAILS
========================================= */
