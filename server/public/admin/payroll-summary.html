<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Payroll Summary</title>
<link rel="stylesheet" href="style.css">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#eef3f8;
  font-family:"Segoe UI",Arial,sans-serif;
  color:#0f2747;
}

#adminHeader{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:1000;
}

.page{
  max-width:1500px;
  margin:0 auto;
  padding:255px 20px 70px;
}

.title{
  margin:0 0 18px;
  text-align:center;
  color:#d4a900;
  font-size:36px;
  font-weight:900;
}

.tabs{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:16px;
}

.tab-btn{
  min-width:115px;
  padding:10px 14px;
  border:1px solid rgba(212,169,0,.50);
  border-radius:13px;
  background:linear-gradient(180deg,#fff,#edf3f9);
  color:#0f2747;
  box-shadow:0 4px 12px rgba(15,39,71,.07);
  font-size:11px;
  font-weight:900;
  cursor:pointer;
}

.tab-btn.active{
  background:linear-gradient(180deg,#173f70,#0f2747);
  color:#ffd21f;
  border-color:#d4a900;
}

.summary-row{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:16px;
}

.summary-card{
  min-width:180px;
  padding:13px 16px;
  border-radius:15px;
  background:#fff;
  border:1px solid rgba(212,169,0,.25);
  box-shadow:0 6px 18px rgba(15,39,71,.06);
  text-align:center;
}

.summary-card span{
  display:block;
  color:#64748b;
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
}

.summary-card b{
  display:block;
  margin-top:4px;
  color:#0f2747;
  font-size:20px;
  font-weight:900;
}

.summary-card.money b{
  color:#15803d;
}

.people-list{
  display:grid;
  gap:14px;
}

.person-card{
  overflow:hidden;
  border-radius:18px;
  background:#fff;
  border:1px solid #dfe7f0;
  box-shadow:0 8px 22px rgba(15,39,71,.07);
}

.person-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:13px 16px;
  background:linear-gradient(90deg,#fff7cf,#fff);
  border-bottom:1px solid #e6ebf1;
}

.person-name{
  color:#0f2747;
  font-size:17px;
  font-weight:900;
}

.person-meta{
  margin-top:2px;
  color:#718096;
  font-size:10px;
  font-weight:700;
}

.period-count{
  color:#64748b;
  font-size:10px;
  font-weight:900;
}

.table-wrap{
  width:100%;
  overflow:auto;
}

table{
  width:100%;
  min-width:760px;
  border-collapse:collapse;
}

th{
  padding:10px 9px;
  background:#0f2747;
  color:#fff;
  text-align:left;
  white-space:nowrap;
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
}

td{
  padding:10px 9px;
  border-bottom:1px solid #e5ebf2;
  font-size:12px;
  font-weight:700;
}

tbody tr:nth-child(even) td{
  background:#fbfdff;
}

.money{
  color:#16a34a;
  font-weight:900;
}

.empty{
  padding:20px 14px;
  text-align:center;
  color:#64748b;
  font-size:12px;
  font-weight:800;
}

.note{
  margin-top:12px;
  text-align:center;
  color:#64748b;
  font-size:10px;
  font-weight:800;
}

@media(max-width:900px){
  .page{
    padding:310px 10px 60px;
  }

  .title{
    font-size:29px;
  }

  .tab-btn{
    min-width:105px;
    padding:9px 10px;
  }
}
</style>
</head>

<body>

<div id="adminHeader"></div>

<main class="page">

  <h1 class="title">
    Payroll Summary
  </h1>

  <section class="tabs">

    <button
      class="tab-btn active"
      data-type="driver"
      type="button">
      Drivers
    </button>

    <button
      class="tab-btn"
      data-type="dispatcher"
      type="button">
      Dispatchers
    </button>

    <button
      class="tab-btn"
      data-type="admin"
      type="button">
      Admins
    </button>

    <button
      class="tab-btn"
      data-type="super_admin"
      type="button">
      Super Admins
    </button>

    <button
      class="tab-btn"
      data-type="employee"
      type="button">
      Employees
    </button>

  </section>

  <section class="summary-row">

    <div class="summary-card">
      <span>People</span>
      <b id="peopleCount">0</b>
    </div>

    <div class="summary-card">
      <span>Total Hours</span>
      <b id="totalHours">0 H 00 MIN</b>
    </div>

    <div
      class="summary-card"
      id="tripsCard">
      <span>Trips</span>
      <b id="totalTrips">0</b>
    </div>

    <div class="summary-card money">
      <span>Total Earnings</span>
      <b id="totalEarnings">$0.00</b>
    </div>

  </section>

  <section
    class="people-list"
    id="peopleList">

    <div class="empty">
      Loading...
    </div>

  </section>

  <div class="note">
    Each person keeps their own closed payroll periods for the rolling last 24 months.
  </div>

</main>

<script src="header.js"></script>
<script src="payroll-summary.js"></script>

</body>
</html>
