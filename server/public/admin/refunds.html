<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Refunds – Sunbeam</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ✅ مهم -->
<link rel="stylesheet" href="/admin/style.css">

<style>
body{
  font-family:Arial;
  background:#f8fafc;
  margin:0;
  color:#111827;
}

.page{
  width:100%;
  max-width:none;
  margin:0;
  padding:18px 22px 30px;
}

/* GOLD PAGE TITLE — SAME AS TRIPS HUB */
.page-head{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:84px;
  margin-bottom:12px;
  padding:16px 20px;
  border:1px solid #e0be5a;
  border-radius:18px;
  background:linear-gradient(
    135deg,
    #fff8dc 0%,
    #f8e6ae 48%,
    #fff4cf 100%
  );
  box-shadow:0 8px 22px rgba(146,102,14,.13);
  text-align:center;
}

.page-title{
  margin:0;
  font-size:28px;
  line-height:1.1;
  font-weight:900;
  color:#111827;
}

.page-sub{
  margin-top:5px;
  font-size:13px;
  font-weight:800;
  color:#64748b;
}

/* SEARCH */
.search-box{
  margin:14px 0 16px;
}

.search-box input{
  width:100%;
  padding:14px 16px;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:16px;
}

/* TABLE */
.table-wrap{
  width:100%;
  overflow-x:auto;
}

.table{
  width:100%;
  min-width:1450px;
  border-collapse:collapse;
  background:#fff;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.table th{
  background:#111827;
  color:#fff;
  padding:16px 14px;
  font-size:14px;
  white-space:nowrap;
}

.table td{
  padding:15px 14px;
  border-bottom:1px solid #eee;
  font-size:14px;
  text-align:center;
  white-space:nowrap;
}

/* STATUS */
.full{color:#22c55e;font-weight:bold}
.partial{color:#f59e0b;font-weight:bold}
.none{color:#ef4444;font-weight:bold}

/* MOBILE */
@media(max-width:900px){
  .page{
    padding:10px 8px 20px;
  }

  .page-head{
    min-height:72px;
    padding:12px;
    margin-bottom:10px;
  }

  .page-title{
    font-size:22px;
  }

  .page-sub{
    font-size:11px;
  }

  .table{
    min-width:1200px;
  }
}
</style>
</head>

<body>

<!-- ADMIN HEADER -->
<div id="adminHeader"></div>

<div class="page">

<div class="page-head">
  <div>
    <h1 class="page-title">Refunds</h1>
    <div class="page-sub">Cancelled trips, refund amounts and refund status</div>
  </div>
</div>

<!-- 🔍 SEARCH -->
<div class="search-box">
  <input id="search" placeholder="Search Trip / Name / Phone / Email">
</div>

<!-- 📊 TABLE -->
<div class="table-wrap">
<table class="table">
<thead>
<tr>
  <th>Trip #</th>
  <th>Client</th>
  <th>Phone</th>
  <th>Email</th>
  <th>Trip Time</th>
  <th>Cancel Time</th>
  <th>Paid</th>
  <th>Refund</th>
  <th>Fee</th>
  <th>Status</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>
</table>
</div>

</div>

<!-- FULL ADMIN HEADER -->
<script src="/admin/header.js"></script>

<script>

const token =
  sessionStorage.getItem("staffToken") ||
  localStorage.getItem("staffToken") ||
  sessionStorage.getItem("token") ||
  localStorage.getItem("token") ||
  "";

// =======================
// LOAD DATA
// =======================
async function loadRefunds(){

  const res = await fetch("/api/trips",{
    headers:{
      Authorization:"Bearer " + token
    }
  });

  const data = await res.json().catch(()=>({}));

  if(!res.ok){
    throw new Error(data.message || "Failed to load refunds");
  }

  const trips = Array.isArray(data)
    ? data
    : Array.isArray(data.trips)
      ? data.trips
      : Array.isArray(data.data)
        ? data.data
        : [];

  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = "";

  trips
    .filter(t => t.status === "Cancelled")
    .forEach(t => {

      // 🔥 STATUS الحقيقي
      let statusClass = "none";
      let statusText = "No Refund";

      if(t.refundStatus === "processing"){
        statusClass = "partial";
        statusText = "Processing";
      }
      else if(t.refundStatus === "refunded"){
        statusClass = "full";
        statusText = "Refunded";
      }

      // 🟢 Trip Time
      const tripTime = (t.tripDate || "-") + " " + (t.tripTime || "");

      // 🔥 Cancel Time (مهم)
      const cancelTime = t.cancelDateTime
        ? new Date(t.cancelDateTime).toLocaleString()
        : "-";

      const row = `
        <tr>
          <td>${t.tripNumber || "-"}</td>
          <td>${t.clientName || "-"}</td>
          <td>${t.clientPhone || "-"}</td>
          <td>${t.clientEmail || "-"}</td>
          <td>${tripTime}</td>
          <td>${cancelTime}</td>
          <td>$${t.priceAmount || 0}</td>
          <td>$${t.refundAmount || 0}</td>
          <td>$${t.cancelFee || 0}</td>
          <td class="${statusClass}">${statusText}</td>
        </tr>
      `;

      tbody.innerHTML += row;
    });
}

loadRefunds();

// =======================
// SEARCH
// =======================
document.getElementById("search").addEventListener("input", function(){

  const val = this.value.toLowerCase();
  const rows = document.querySelectorAll("#tableBody tr");

  rows.forEach(r=>{
    r.style.display = r.innerText.toLowerCase().includes(val)
      ? ""
      : "none";
  });

});

</script>

</body>
</html>
