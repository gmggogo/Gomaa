<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trips Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="/admin/style.css">

<style>
*{
  box-sizing:border-box;
}

:root{
  --blue:#2563eb;
  --blueDark:#1d4ed8;
  --green:#16a34a;
  --red:#dc2626;
  --orange:#f59e0b;
  --purple:#7c3aed;
  --pink:#ec4899;
  --gold1:#f8e7a2;
  --gold2:#e8c75d;
  --gold3:#f4dc86;
  --text:#0f172a;
  --muted:#64748b;
  --bg:#f1f5f9;
  --card:#ffffff;
  --border:#dbe3ee;
}

body{
  margin:0;
  background:var(--bg);
  font-family:Segoe UI,Arial,sans-serif;
  color:var(--text);
}

/* HEADER */

#adminHeader{
  width:100%;
  z-index:1000;
}

/* PAGE */

.page-content{
  padding:18px 22px 30px;
  width:100%;
}

/* PAGE TITLE — SAME STYLE AS FINAL CONFIRMATION */

.page-head{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:84px;
  margin-bottom:12px;
  padding:16px 20px;
  border:1px solid #e0be5a;
  border-radius:18px;
  background:linear-gradient(
    135deg,
    #fff8dc 0%,
    #f8e6ae 48%,
    #fff4cf 100%
  );
  box-shadow:0 8px 22px rgba(146,102,14,.13);
  text-align:center;
}

.page-title{
  margin:0;
  font-size:28px;
  line-height:1.1;
  font-weight:900;
  color:#111827;
}

.page-sub{
  margin-top:5px;
  font-size:13px;
  font-weight:800;
  color:#64748b;
}

/* TOOLBAR — UNDER PAGE TITLE */

.toolbar{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
  margin-top:0;
  margin-bottom:12px;
}

.add-btn{
  background:var(--blue);
  color:#fff;
  border:none;
  padding:11px 18px;
  border-radius:12px;
  cursor:pointer;
  font-size:14px;
  font-weight:900;
  box-shadow:0 6px 16px rgba(37,99,235,.18);
}

.add-btn:hover{
  background:var(--blueDark);
}

.top-add-trip-wrap{
  display:flex!important;
  justify-content:flex-start!important;
  align-items:center!important;
  margin:0 0 10px!important;
  background:transparent!important;
}

.top-add-trip-btn{
  background:var(--blue)!important;
  color:#fff!important;
  border:none!important;
  padding:11px 18px!important;
  border-radius:12px!important;
  cursor:pointer!important;
  font-size:14px!important;
  font-weight:900!important;
  box-shadow:0 6px 16px rgba(37,99,235,.18)!important;
}

.top-add-trip-btn:hover{
  background:var(--blueDark)!important;
}

.search-input{
  flex:1;
  min-width:240px;
  padding:12px 14px;
  border-radius:12px;
  border:1px solid #cbd5e1;
  font-size:14px;
  outline:none;
  font-weight:800;
  background:#fff;
}

.search-input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

/* MAIN CONTAINER */

#hubContainer{
  width:100%;
}

/* =========================================================
   CARD GRIDS
   ========================================================= */

.stats-grid,
.cards-grid,
.hub-stats,
.service-grid,
.service-cards,
.service-strip{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;
  margin-bottom:13px;
}

/* BASE CARD */

.stat-card,
.service-card,
.hub-card{
  position:relative;
  overflow:hidden;
  isolation:isolate;
  min-height:105px;
  border:1px solid rgba(255,255,255,.30);
  border-radius:15px;
  padding:12px 10px;
  text-align:center;
  box-shadow:
    0 9px 20px rgba(15,23,42,.17),
    inset 0 1px 0 rgba(255,255,255,.24);
  transition:.18s ease;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.stat-card::before,
.service-card::before,
.hub-card::before{
  content:"";
  position:absolute;
  width:118px;
  height:118px;
  border-radius:50%;
  right:-35px;
  top:-42px;
  background:rgba(255,255,255,.13);
  z-index:-1;
}

.stat-card::after,
.service-card::after,
.hub-card::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    125deg,
    rgba(255,255,255,.18) 0%,
    rgba(255,255,255,.04) 38%,
    rgba(255,255,255,0) 62%
  );
  pointer-events:none;
  z-index:-1;
}

.stat-card:hover,
.service-card:hover,
.hub-card:hover{
  transform:translateY(-2px) scale(1.006);
  box-shadow:
    0 13px 26px rgba(15,23,42,.21),
    inset 0 1px 0 rgba(255,255,255,.28);
}

/* =========================================================
   TOP SUMMARY CARDS
   ORDER:
   1 NEW TRIPS  = PINK
   2 TOTAL      = BLUE
   3 FACILITY   = PURPLE
   4 GET QUOTE  = GREEN
   5 RESERVED   = ORANGE
   ========================================================= */

.stats-grid > :nth-child(1),
.cards-grid > :nth-child(1),
.hub-stats > :nth-child(1){
  background:linear-gradient(135deg,#f472b6 0%,#ec4899 55%,#db2777 100%);
}

.stats-grid > :nth-child(2),
.cards-grid > :nth-child(2),
.hub-stats > :nth-child(2){
  background:linear-gradient(135deg,#075fe8 0%,#13a4ff 100%);
}

.stats-grid > :nth-child(3),
.cards-grid > :nth-child(3),
.hub-stats > :nth-child(3){
  background:linear-gradient(135deg,#6d28d9 0%,#8b5cf6 52%,#c026d3 100%);
}

.stats-grid > :nth-child(4),
.cards-grid > :nth-child(4),
.hub-stats > :nth-child(4){
  background:linear-gradient(135deg,#11983f 0%,#39c65d 100%);
}

.stats-grid > :nth-child(5),
.cards-grid > :nth-child(5),
.hub-stats > :nth-child(5){
  background:linear-gradient(135deg,#f27a00 0%,#ffad16 100%);
}

/* TOP ROW TEXT */

.stats-grid .stat-label,
.stats-grid .card-label,
.stats-grid .service-name,
.stats-grid .stat-value,
.stats-grid .card-value,
.stats-grid .service-total,
.stats-grid .stat-mini,
.stats-grid .card-mini,
.stats-grid .service-mini,

.cards-grid .stat-label,
.cards-grid .card-label,
.cards-grid .service-name,
.cards-grid .stat-value,
.cards-grid .card-value,
.cards-grid .service-total,
.cards-grid .stat-mini,
.cards-grid .card-mini,
.cards-grid .service-mini,

.hub-stats .stat-label,
.hub-stats .card-label,
.hub-stats .service-name,
.hub-stats .stat-value,
.hub-stats .card-value,
.hub-stats .service-total,
.hub-stats .stat-mini,
.hub-stats .card-mini,
.hub-stats .service-mini{
  color:#fff!important;
  text-shadow:0 1px 2px rgba(0,0,0,.22);
}

/* =========================================================
   DYNAMIC SERVICE CARDS — ALL LIGHT GOLD
   Standard / XL / Wheelchair / Shared / Taxi / Limo / etc.
   Any new dynamic service automatically gets same gold style.
   ========================================================= */

.service-grid > *,
.service-cards > *,
.service-strip > *{
  background:linear-gradient(
    135deg,
    var(--gold1) 0%,
    var(--gold2) 52%,
    var(--gold3) 100%
  )!important;
  border-color:#d1a92e!important;
}

.service-grid .stat-label,
.service-grid .card-label,
.service-grid .service-name,
.service-grid .stat-value,
.service-grid .card-value,
.service-grid .service-total,
.service-grid .stat-mini,
.service-grid .card-mini,
.service-grid .service-mini,

.service-cards .stat-label,
.service-cards .card-label,
.service-cards .service-name,
.service-cards .stat-value,
.service-cards .card-value,
.service-cards .service-total,
.service-cards .stat-mini,
.service-cards .card-mini,
.service-cards .service-mini,

.service-strip .stat-label,
.service-strip .card-label,
.service-strip .service-name,
.service-strip .stat-value,
.service-strip .card-value,
.service-strip .service-total,
.service-strip .stat-mini,
.service-strip .card-mini,
.service-strip .service-mini{
  color:#111827!important;
  text-shadow:none!important;
}

/* CARD TEXT */

.stat-label,
.card-label,
.service-name{
  width:100%;
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.3px;
  text-align:center;
}

.stat-value,
.card-value,
.service-total{
  width:100%;
  font-size:30px;
  line-height:1;
  font-weight:900;
  margin:8px 0;
  text-align:center;
}

.stat-mini,
.card-mini,
.service-mini{
  width:100%;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
  font-size:11px;
  font-weight:900;
  text-align:center;
}

.service-card{
  cursor:pointer;
}

/* ACTIVE CARD — KEEP ITS OWN COLOR */

.service-card.active,
.service-card.selected,
.hub-card.active,
.stat-card.active{
  border:3px solid #0f172a!important;
  box-shadow:
    0 0 0 3px rgba(255,255,255,.9),
    0 10px 24px rgba(15,23,42,.18)!important;
}

/* FILTERS / ACTIONS */

.filters,
.filter-bar,
.actions-bar,
.selection-bar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
  margin:10px 0 14px;
}

.filters select,
.filter-bar select,
.filters input,
.filter-bar input{
  min-width:150px;
  padding:10px 12px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  background:#fff;
  font-size:14px;
  font-weight:800;
}

.select-btn,
.action-btn,
.clear-btn{
  border:none;
  border-radius:10px;
  padding:10px 15px;
  font-size:13px;
  font-weight:900;
  cursor:pointer;
  color:#fff;
  background:#0f172a;
}

.clear-btn{
  background:#64748b;
}

.action-btn.edit,
.edit-selected,
#editSelectedBtn{
  background:#93c5fd;
  color:#fff;
}

.action-btn.delete,
.delete-selected,
#deleteSelectedBtn{
  background:#ef9a9a;
  color:#fff;
}

/* TABLE */

.table-wrap,
.table-scroll{
  width:100%;
  overflow-x:auto;
  overflow-y:visible;
  -webkit-overflow-scrolling:touch;
  border-radius:14px;
  background:#fff;
  box-shadow:0 8px 22px rgba(15,23,42,.08);
  margin-top:10px;
}

.hub-table,
.trip-table{
  width:100%;
  min-width:1550px;
  border-collapse:collapse;
  background:#fff;
  table-layout:auto;
}

.hub-table th,
.hub-table td,
.trip-table th,
.trip-table td{
  border:1px solid var(--border);
  padding:7px;
  text-align:center;
  font-size:12px;
  vertical-align:middle;
  font-weight:700;
}

.hub-table th,
.trip-table th{
  background:#0f172a;
  color:#fff;
  white-space:nowrap;
  font-weight:900;
  position:sticky;
  top:0;
  z-index:2;
}

.date-row td,
.group-title-row td{
  background:#1e293b!important;
  color:#fff!important;
  text-align:left!important;
  font-size:14px!important;
  font-weight:900!important;
  padding:10px 14px!important;
}

/* ROW COLORS — LIGHT VERSIONS OF THE TOP CARDS */

.facility-row td,
.row-company td{
  background:linear-gradient(90deg,#f4ecff 0%,#eadcff 100%)!important;
}

.gq-row td,
.row-quote td{
  background:linear-gradient(90deg,#e9f9ed 0%,#d8f5df 100%)!important;
}

.reserved-row td,
.row-reserved td{
  background:linear-gradient(90deg,#fff2df 0%,#ffe4bd 100%)!important;
}

.individual-row td,
.row-individual td{
  background:linear-gradient(90deg,#e8f4ff 0%,#d9ecff 100%)!important;
}

/* Shared keeps the source color and gets only a purple accent */
.shared-row td,
.row-shared td{
  box-shadow:inset 4px 0 0 rgba(124,58,237,.42);
}

/* WIDTHS */

.w-num{min-width:50px;}
.w-select{min-width:55px;}
.w-trip{min-width:110px;}
.w-facility{min-width:130px;}

.w-client{
  min-width:180px;
  text-align:left!important;
}

.w-phone{min-width:120px;}

.w-address{
  min-width:240px;
  max-width:340px;
  text-align:left!important;
  white-space:pre-line;
  word-break:break-word;
}

.w-stops{
  min-width:180px;
  max-width:280px;
  text-align:left!important;
  white-space:pre-line;
  word-break:break-word;
}

.w-notes{
  min-width:180px;
  max-width:280px;
  text-align:left!important;
  white-space:pre-line;
  word-break:break-word;
}

.w-date{min-width:105px;}
.w-time{min-width:90px;}
.w-status{min-width:105px;}

.w-view,
.w-actions{
  min-width:90px;
}

/* PILLS */

.trip-number-badge{
  font-weight:900;
  color:#1d4ed8;
  white-space:nowrap;
}

.status-pill{
  display:inline-flex;
  padding:5px 9px;
  border-radius:999px;
  font-size:12px;
  font-weight:900;
  background:#f1f5f9;
  color:#0f172a;
  white-space:nowrap;
}

.status-pill.scheduled{
  background:#f1f5f9;
  color:#334155;
  border:1px solid #cbd5e1;
}

.status-pill.confirmed{
  background:#bbf7d0;
  color:#14532d;
  border:1px solid #86efac;
}

.status-pill.paid{
  background:#dbeafe;
  color:#1d4ed8;
  border:1px solid #93c5fd;
}

.status-pill.rv,
.status-pill.reserved{
  background:#fef3c7;
  color:#92400e;
  border:1px solid #fcd34d;
}

/* BUTTONS */

.view-btn,
.btn-view{
  border:none;
  background:#0f172a;
  color:#fff;
  width:34px;
  height:34px;
  border-radius:8px;
  cursor:pointer;
  font-size:16px;
  font-weight:900;
}

.view-btn:hover,
.btn-view:hover{
  background:#2563eb;
}

.btn,
.btn-edit,
.btn-delete,
.btn-save,
.btn-cancel{
  border:none;
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
  font-size:12px;
  font-weight:900;
}

.btn-edit{
  background:#2563eb;
  color:#fff;
}

.btn-delete{
  background:#dc2626;
  color:#fff;
}

.btn-save{
  background:#16a34a;
  color:#fff;
}

.btn-cancel{
  background:#64748b;
  color:#fff;
}

/* DETAILS */

.details-row td{
  background:#f8fafc!important;
  padding:0!important;
}

.details-box{
  padding:14px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.details-item{
  background:#fff;
  border:1px solid #dbe3ee;
  border-radius:10px;
  padding:10px;
  text-align:left;
}

.details-label{
  font-size:11px;
  color:#64748b;
  font-weight:900;
  margin-bottom:4px;
}

.details-value{
  font-size:13px;
  font-weight:800;
  color:#0f172a;
  white-space:pre-line;
  word-break:break-word;
}

/* SHARED */

.shared-grid{
  display:flex;
  flex-direction:column;
  border:1px solid #cbd5e1;
  border-radius:8px;
  overflow:hidden;
  background:#fff;
}

.shared-cell{
  min-height:32px;
  padding:7px;
  border-bottom:1px solid #cbd5e1;
  background:#fff;
  text-align:left;
  font-size:12px;
  font-weight:800;
  white-space:pre-line;
  word-break:break-word;
}

.shared-cell:last-child{
  border-bottom:none;
}

/* EDIT INPUTS */

.edit-input,
.edit-textarea,
.hub-table input,
.hub-table textarea,
.hub-table select{
  width:100%;
  min-width:95px;
  padding:7px;
  border:1px solid #cbd5e1;
  border-radius:7px;
  font-size:12px;
  font-weight:700;
  box-sizing:border-box;
  font-family:inherit;
  background:#fff;
}

.edit-textarea,
.hub-table textarea{
  min-height:58px;
  resize:vertical;
}

/* NO DATA */

.no-data{
  background:#fff;
  padding:18px;
  border-radius:14px;
  box-shadow:0 8px 22px rgba(15,23,42,.08);
  color:#475569;
  font-weight:900;
}

/* MOBILE */

@media(max-width:768px){

  body{
    background:#eef3f8;
  }

  .page-content{
    padding:10px 8px 20px;
  }

  .page-head{
    min-height:72px;
    padding:12px;
    margin-bottom:10px;
  }

  .page-title{
    font-size:22px;
  }

  .page-sub{
    font-size:11px;
  }

  .toolbar{
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:8px;
    margin-bottom:8px;
  }

  .add-btn{
    width:150px;
    padding:10px 12px;
    border-radius:12px;
    font-size:14px;
  }

  .search-input{
    width:100%;
    min-width:0;
    padding:10px 12px;
    font-size:13px;
    border-radius:12px;
  }

  .stats-grid,
  .service-grid,
  .cards-grid,
  .hub-stats,
  .service-cards,
  .service-strip{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:7px;
    margin-bottom:8px;
  }

  .stat-card,
  .service-card,
  .hub-card{
    min-height:82px!important;
    border-radius:13px!important;
    padding:7px 5px!important;
    box-shadow:0 4px 10px rgba(15,23,42,.10);
  }

  .stat-label,
  .card-label,
  .service-name{
    font-size:10.5px!important;
    line-height:1.1;
  }

  .stat-value,
  .card-value,
  .service-total{
    font-size:24px!important;
    line-height:1;
    margin:5px 0!important;
  }

  .stat-mini,
  .card-mini,
  .service-mini{
    font-size:9px!important;
    gap:3px;
    line-height:1.1;
  }

  .filters,
  .filter-bar,
  .actions-bar,
  .selection-bar{
    gap:6px;
    margin:8px 0;
  }

  .filters select,
  .filter-bar select,
  .filters input,
  .filter-bar input{
    flex:1 1 30%;
    min-width:90px;
    padding:8px 9px;
    font-size:12px;
    border-radius:10px;
  }

  .select-btn,
  .action-btn,
  .clear-btn{
    padding:8px 10px;
    font-size:12px;
    border-radius:10px;
  }

  .table-wrap,
  .table-scroll{
    margin-top:8px;
    border-radius:10px;
    box-shadow:0 5px 14px rgba(15,23,42,.07);
  }

  .hub-table,
  .trip-table{
    min-width:1320px!important;
  }

  .hub-table th,
  .hub-table td,
  .trip-table th,
  .trip-table td{
    font-size:10px!important;
    padding:4px!important;
    line-height:1.2;
  }

  .hub-table th,
  .trip-table th{
    font-size:9.5px!important;
  }

  .date-row td,
  .group-title-row td{
    font-size:11px!important;
    padding:7px 9px!important;
  }

  .w-trip{min-width:85px;}
  .w-facility{min-width:100px;}
  .w-client{min-width:145px;}
  .w-phone{min-width:95px;}

  .w-address{
    min-width:185px;
    max-width:220px;
  }

  .w-stops{
    min-width:140px;
    max-width:180px;
  }

  .w-notes{
    min-width:145px;
    max-width:180px;
  }

  .w-date{min-width:78px;}
  .w-time{min-width:62px;}
  .w-status{min-width:78px;}

  .w-view,
  .w-actions{
    min-width:75px;
  }

  .view-btn,
  .btn-view{
    width:28px;
    height:28px;
    border-radius:7px;
    font-size:13px;
  }

  .btn,
  .btn-edit,
  .btn-delete,
  .btn-save,
  .btn-cancel{
    padding:4px 6px;
    font-size:10px;
    border-radius:6px;
  }

  .details-box{
    grid-template-columns:1fr;
    padding:8px;
    gap:8px;
  }

  .details-item{
    padding:8px;
  }

  .shared-cell{
    font-size:10px;
    min-height:26px;
    padding:5px;
  }

  .no-data{
    padding:12px;
    font-size:12px;
    border-radius:10px;
  }
}

@media(max-width:430px){

  .page-content{
    padding-left:7px;
    padding-right:7px;
  }

  .stats-grid,
  .service-grid,
  .cards-grid,
  .hub-stats,
  .service-cards,
  .service-strip{
    gap:6px;
  }

  .stat-card,
  .service-card,
  .hub-card{
    min-height:74px!important;
    padding:6px 4px!important;
  }

  .stat-label,

<script id="tripsHubFinalCardFixScript">
(function(){
  "use strict";

  /*
    trips-hub.js already calculates the numbers.
    This script only normalizes how FA / GQ / RV are displayed.
    It does not recalculate trips or alter filtering/table behavior.
  */

  function normalizeMini(mini){
    if(!mini || mini.dataset.hubNormalized === "1") return;

    const raw = String(mini.textContent || "")
      .replace(/\s+/g," ")
      .trim();

    if(!raw) return;

    const upper = raw.toUpperCase();

    /* Only touch source counters. */
    if(
      !upper.includes("FA") ||
      !upper.includes("GQ") ||
      !upper.includes("RV")
    ){
      return;
    }

    /*
      Existing markup may arrive in either form:
      FA 0 GQ 0 RV 1
      or:
      FA GQ RV 0 0 1
      We only use the three source-counter numbers from this mini block.
    */
    let fa = "0";
    let gq = "0";
    let rv = "0";

    const pairFA = upper.match(/FA\s*[:\-]?\s*(\d+)/);
    const pairGQ = upper.match(/GQ\s*[:\-]?\s*(\d+)/);
    const pairRV = upper.match(/RV\s*[:\-]?\s*(\d+)/);

    if(pairFA && pairGQ && pairRV){
      fa = pairFA[1];
      gq = pairGQ[1];
      rv = pairRV[1];
    }else{
      const nums = raw.match(/\d+/g) || [];
      if(nums.length >= 3){
        const last = nums.slice(-3);
        [fa,gq,rv] = last;
      }
    }

    mini.innerHTML = `
      <div class="hub-mini-cell">
        <span class="hub-mini-label">FA</span>
        <span class="hub-mini-value">${fa}</span>
      </div>
      <div class="hub-mini-cell">
        <span class="hub-mini-label">GQ</span>
        <span class="hub-mini-value">${gq}</span>
      </div>
      <div class="hub-mini-cell">
        <span class="hub-mini-label">RV</span>
        <span class="hub-mini-value">${rv}</span>
      </div>
    `;

    mini.dataset.hubNormalized = "1";
  }

  function normalizeAllCards(){
    document
      .querySelectorAll(".stat-mini,.card-mini,.service-mini")
      .forEach(normalizeMini);
  }

  function selectedCount(){
    const root = document.getElementById("hubContainer") || document;

    const checked = [
      ...root.querySelectorAll(
        'tbody input[type="checkbox"]:checked,' +
        '.trip-table input[type="checkbox"]:checked,' +
        '.hub-table input[type="checkbox"]:checked'
      )
    ];

    return checked.filter(box=>{
      const id = String(box.id || "").toLowerCase();
      const cls = String(box.className || "").toLowerCase();

      return !(
        id.includes("selectall") ||
        cls.includes("select-all")
      );
    }).length;
  }

  function updateSelectionButtons(){
    const hasSelection = selectedCount() > 0;

    document
      .querySelectorAll(
        "#editSelectedBtn,.edit-selected,.action-btn.edit," +
        "#deleteSelectedBtn,.delete-selected,.action-btn.delete"
      )
      .forEach(btn=>{
        btn.classList.toggle("selection-active",hasSelection);
      });
  }

  function refresh(){
    normalizeAllCards();
    updateSelectionButtons();
  }

  document.addEventListener("change",function(e){
    if(e.target && e.target.matches('input[type="checkbox"]')){
      requestAnimationFrame(refresh);
    }
  });

  const root = document.getElementById("hubContainer");

  if(root){
    const observer = new MutationObserver(()=>{
      requestAnimationFrame(refresh);
    });

    observer.observe(root,{
      childList:true,
      subtree:true,
      characterData:true
    });
  }

  refresh();
})();
</script>
