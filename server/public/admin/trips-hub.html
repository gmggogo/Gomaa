<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trips Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="/admin/style.css">

<style>
*{
  box-sizing:border-box;
}

:root{
  --blue:#2563eb;
  --blueDark:#1d4ed8;
  --green:#16a34a;
  --red:#dc2626;
  --orange:#f59e0b;
  --purple:#7c3aed;
  --pink:#ec4899;
  --gold1:#f8e7a2;
  --gold2:#e8c75d;
  --gold3:#f4dc86;
  --text:#0f172a;
  --muted:#64748b;
  --bg:#f1f5f9;
  --card:#ffffff;
  --border:#dbe3ee;
}

body{
  margin:0;
  background:var(--bg);
  font-family:Segoe UI,Arial,sans-serif;
  color:var(--text);
}

/* HEADER */

#adminHeader{
  width:100%;
  z-index:1000;
}

/* PAGE */

.page-content{
  padding:18px 22px 30px;
  width:100%;
}

/* PAGE TITLE — SAME STYLE AS FINAL CONFIRMATION */

.page-head{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:84px;
  margin-bottom:12px;
  padding:16px 20px;
  border:1px solid #e0be5a;
  border-radius:18px;
  background:linear-gradient(
    135deg,
    #fff8dc 0%,
    #f8e6ae 48%,
    #fff4cf 100%
  );
  box-shadow:0 8px 22px rgba(146,102,14,.13);
  text-align:center;
}

.page-title{
  margin:0;
  font-size:28px;
  line-height:1.1;
  font-weight:900;
  color:#111827;
}

.page-sub{
  margin-top:5px;
  font-size:13px;
  font-weight:800;
  color:#64748b;
}

/* TOOLBAR — UNDER PAGE TITLE */

.toolbar{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
  margin-top:0;
  margin-bottom:12px;
}

.add-btn{
  background:var(--blue);
  color:#fff;
  border:none;
  padding:11px 18px;
  border-radius:12px;
  cursor:pointer;
  font-size:14px;
  font-weight:900;
  box-shadow:0 6px 16px rgba(37,99,235,.18);
}

.add-btn:hover{
  background:var(--blueDark);
}

.top-add-trip-wrap{
  display:flex!important;
  justify-content:flex-start!important;
  align-items:center!important;
  margin:0 0 10px!important;
  background:transparent!important;
}

.top-add-trip-btn{
  background:var(--blue)!important;
  color:#fff!important;
  border:none!important;
  padding:11px 18px!important;
  border-radius:12px!important;
  cursor:pointer!important;
  font-size:14px!important;
  font-weight:900!important;
  box-shadow:0 6px 16px rgba(37,99,235,.18)!important;
}

.top-add-trip-btn:hover{
  background:var(--blueDark)!important;
}

.search-input{
  flex:1;
  min-width:240px;
  padding:12px 14px;
  border-radius:12px;
  border:1px solid #cbd5e1;
  font-size:14px;
  outline:none;
  font-weight:800;
  background:#fff;
}

.search-input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

/* MAIN CONTAINER */

#hubContainer{
  width:100%;
}

/* =========================================================
   CARD GRIDS
   ========================================================= */

.stats-grid,
.cards-grid,
.hub-stats,
.service-grid,
.service-cards,
.service-strip{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;
  margin-bottom:13px;
}

/* BASE CARD */

.stat-card,
.service-card,
.hub-card{
  position:relative;
  overflow:hidden;
  isolation:isolate;
  min-height:105px;
  border:1px solid rgba(255,255,255,.30);
  border-radius:15px;
  padding:12px 10px;
  text-align:center;
  box-shadow:
    0 9px 20px rgba(15,23,42,.17),
    inset 0 1px 0 rgba(255,255,255,.24);
  transition:.18s ease;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.stat-card::before,
.service-card::before,
.hub-card::before{
  content:"";
  position:absolute;
  width:118px;
  height:118px;
  border-radius:50%;
  right:-35px;
  top:-42px;
  background:rgba(255,255,255,.13);
  z-index:-1;
}

.stat-card::after,
.service-card::after,
.hub-card::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    125deg,
    rgba(255,255,255,.18) 0%,
    rgba(255,255,255,.04) 38%,
    rgba(255,255,255,0) 62%
  );
  pointer-events:none;
  z-index:-1;
}

.stat-card:hover,
.service-card:hover,
.hub-card:hover{
  transform:translateY(-2px) scale(1.006);
  box-shadow:
    0 13px 26px rgba(15,23,42,.21),
    inset 0 1px 0 rgba(255,255,255,.28);
}

/* =========================================================
   TOP SUMMARY CARDS
   SAME CLEAN STRUCTURE AS THE SERVICE CARDS BELOW
   FA / GQ / RV stay separated in 3 columns.
   ========================================================= */

.stats-grid > *,
.cards-grid > *,
.hub-stats > *{
  background:linear-gradient(
    135deg,
    #fff7cf 0%,
    #f3dc82 52%,
    #f7e6a3 100%
  )!important;
  border:1px solid #c9a83c!important;
  color:#111827!important;
  box-shadow:
    0 7px 16px rgba(104,83,20,.14),
    inset 0 1px 0 rgba(255,255,255,.55)!important;
}

.stats-grid > :nth-child(1),
.cards-grid > :nth-child(1),
.hub-stats > :nth-child(1){
  border-top:5px solid #ec4899!important;
}

.stats-grid > :nth-child(2),
.cards-grid > :nth-child(2),
.hub-stats > :nth-child(2){
  border-top:5px solid #2563eb!important;
}

.stats-grid > :nth-child(3),
.cards-grid > :nth-child(3),
.hub-stats > :nth-child(3){
  border-top:5px solid #7c3aed!important;
}

.stats-grid > :nth-child(4),
.cards-grid > :nth-child(4),
.hub-stats > :nth-child(4){
  border-top:5px solid #16a34a!important;
}

.stats-grid > :nth-child(5),
.cards-grid > :nth-child(5),
.hub-stats > :nth-child(5){
  border-top:5px solid #f59e0b!important;
}

.stats-grid .stat-label,
.stats-grid .card-label,
.stats-grid .service-name,
.stats-grid .stat-value,
.stats-grid .card-value,
.stats-grid .service-total,
.stats-grid .stat-mini,
.stats-grid .card-mini,
.stats-grid .service-mini,
.cards-grid .stat-label,
.cards-grid .card-label,
.cards-grid .service-name,
.cards-grid .stat-value,
.cards-grid .card-value,
.cards-grid .service-total,
.cards-grid .stat-mini,
.cards-grid .card-mini,
.cards-grid .service-mini,
.hub-stats .stat-label,
.hub-stats .card-label,
.hub-stats .service-name,
.hub-stats .stat-value,
.hub-stats .card-value,
.hub-stats .service-total,
.hub-stats .stat-mini,
.hub-stats .card-mini,
.hub-stats .service-mini{
  color:#111827!important;
  text-shadow:none!important;
}

.stats-grid .stat-mini,
.stats-grid .card-mini,
.stats-grid .service-mini,
.cards-grid .stat-mini,
.cards-grid .card-mini,
.cards-grid .service-mini,
.hub-stats .stat-mini,
.hub-stats .card-mini,
.hub-stats .service-mini{
  display:grid!important;
  grid-template-columns:repeat(3,minmax(0,1fr))!important;
  gap:10px!important;
  align-items:center!important;
}

.stats-grid .stat-mini > *,
.stats-grid .card-mini > *,
.stats-grid .service-mini > *,
.cards-grid .stat-mini > *,
.cards-grid .card-mini > *,
.cards-grid .service-mini > *,
.hub-stats .stat-mini > *,
.hub-stats .card-mini > *,
.hub-stats .service-mini > *{
  min-width:0!important;
  padding:4px 2px!important;
  border-radius:7px!important;
  background:rgba(255,255,255,.34)!important;
}

/* =========================================================
   DYNAMIC SERVICE CARDS — ALL LIGHT GOLD
   Standard / XL / Wheelchair / Shared / Taxi / Limo / etc.
   Any new dynamic service automatically gets same gold style.
   ========================================================= */

.service-grid > *,
.service-cards > *,
.service-strip > *{
  background:linear-gradient(
    135deg,
    var(--gold1) 0%,
    var(--gold2) 52%,
    var(--gold3) 100%
  )!important;
  border-color:#d1a92e!important;
}

.service-grid .stat-label,
.service-grid .card-label,
.service-grid .service-name,
.service-grid .stat-value,
.service-grid .card-value,
.service-grid .service-total,
.service-grid .stat-mini,
.service-grid .card-mini,
.service-grid .service-mini,

.service-cards .stat-label,
.service-cards .card-label,
.service-cards .service-name,
.service-cards .stat-value,
.service-cards .card-value,
.service-cards .service-total,
.service-cards .stat-mini,
.service-cards .card-mini,
.service-cards .service-mini,

.service-strip .stat-label,
.service-strip .card-label,
.service-strip .service-name,
.service-strip .stat-value,
.service-strip .card-value,
.service-strip .service-total,
.service-strip .stat-mini,
.service-strip .card-mini,
.service-strip .service-mini{
  color:#111827!important;
  text-shadow:none!important;
}

/* CARD TEXT */

.stat-label,
.card-label,
.service-name{
  width:100%;
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.3px;
  text-align:center;
}

.stat-value,
.card-value,
.service-total{
  width:100%;
  font-size:30px;
  line-height:1;
  font-weight:900;
  margin:8px 0;
  text-align:center;
}

.stat-mini,
.card-mini,
.service-mini{
  width:100%;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
  font-size:11px;
  font-weight:900;
  text-align:center;
}

.service-card{
  cursor:pointer;
}

/* ACTIVE CARD — KEEP ITS OWN COLOR */

.service-card.active,
.service-card.selected,
.hub-card.active,
.stat-card.active{
  border:3px solid #0f172a!important;
  box-shadow:
    0 0 0 3px rgba(255,255,255,.9),
    0 10px 24px rgba(15,23,42,.18)!important;
}

/* FILTERS / ACTIONS */

.filters,
.filter-bar,
.actions-bar,
.selection-bar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
  margin:10px 0 14px;
}

.filters select,
.filter-bar select,
.filters input,
.filter-bar input{
  min-width:150px;
  padding:10px 12px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  background:#fff;
  font-size:14px;
  font-weight:800;
}

.select-btn,
.action-btn,
.clear-btn{
  border:none;
  border-radius:10px;
  padding:10px 15px;
  font-size:13px;
  font-weight:900;
  cursor:pointer;
  color:#fff;
  background:#0f172a;
}

.clear-btn{
  background:#64748b;
}

/* EDIT / DELETE SELECTED
   No selection = visible but muted
   With selection = strong active color
*/
.action-btn.edit,
.edit-selected,
#editSelectedBtn{
  background:#2563eb;
  color:#fff;
  border:1px solid #1d4ed8;
  box-shadow:0 5px 12px rgba(37,99,235,.22);
  transition:.16s ease;
}

.action-btn.delete,
.delete-selected,
#deleteSelectedBtn{
  background:#dc2626;
  color:#fff;
  border:1px solid #b91c1c;
  box-shadow:0 5px 12px rgba(220,38,38,.22);
  transition:.16s ease;
}

.action-btn.edit:disabled,
.edit-selected:disabled,
#editSelectedBtn:disabled{
  background:#bfd7f7!important;
  color:#eef5ff!important;
  border-color:#a9c7ec!important;
  box-shadow:none!important;
  opacity:.72!important;
  cursor:not-allowed!important;
  filter:saturate(.55)!important;
}

.action-btn.delete:disabled,
.delete-selected:disabled,
#deleteSelectedBtn:disabled{
  background:#f0b6bc!important;
  color:#fff3f4!important;
  border-color:#e5a2aa!important;
  box-shadow:none!important;
  opacity:.72!important;
  cursor:not-allowed!important;
  filter:saturate(.55)!important;
}

.action-btn.edit:not(:disabled),
.edit-selected:not(:disabled),
#editSelectedBtn:not(:disabled){
  background:linear-gradient(180deg,#3b82f6,#1d4ed8)!important;
  color:#fff!important;
  box-shadow:0 0 0 2px rgba(59,130,246,.14),0 7px 16px rgba(37,99,235,.28)!important;
}

.action-btn.delete:not(:disabled),
.delete-selected:not(:disabled),
#deleteSelectedBtn:not(:disabled){
  background:linear-gradient(180deg,#ef4444,#b91c1c)!important;
  color:#fff!important;
  box-shadow:0 0 0 2px rgba(239,68,68,.14),0 7px 16px rgba(220,38,38,.28)!important;
}

/* TABLE */

.table-wrap,
.table-scroll{
  width:100%;
  overflow-x:auto;
  overflow-y:visible;
  -webkit-overflow-scrolling:touch;
  border-radius:14px;
  background:#fff;
  box-shadow:0 8px 22px rgba(15,23,42,.08);
  margin-top:10px;
}

.hub-table,
.trip-table{
  width:100%;
  min-width:1550px;
  border-collapse:collapse;
  background:#fff;
  table-layout:auto;
}

.hub-table th,
.hub-table td,
.trip-table th,
.trip-table td{
  border:1px solid var(--border);
  padding:7px;
  text-align:center;
  font-size:12px;
  vertical-align:middle;
  font-weight:700;
}

.hub-table th,
.trip-table th{
  background:#0f172a;
  color:#fff;
  white-space:nowrap;
  font-weight:900;
  position:sticky;
  top:0;
  z-index:2;
}

.date-row td,
.group-title-row td{
  background:#1e293b!important;
  color:#fff!important;
  text-align:left!important;
  font-size:14px!important;
  font-weight:900!important;
  padding:10px 14px!important;
}

/* ROW COLORS — LIGHT VERSIONS OF THE TOP CARDS */

.facility-row td,
.row-company td{
  background:linear-gradient(90deg,#f4ecff 0%,#eadcff 100%)!important;
}

.gq-row td,
.row-quote td{
  background:linear-gradient(90deg,#e9f9ed 0%,#d8f5df 100%)!important;
}

.reserved-row td,
.row-reserved td{
  background:linear-gradient(90deg,#fff2df 0%,#ffe4bd 100%)!important;
}

.individual-row td,
.row-individual td{
  background:linear-gradient(90deg,#e8f4ff 0%,#d9ecff 100%)!important;
}

/* Shared keeps the source color and gets only a purple accent */
.shared-row td,
.row-shared td{
  box-shadow:inset 4px 0 0 rgba(124,58,237,.42);
}

/* WIDTHS */

.w-num{min-width:50px;}
.w-select{min-width:55px;}
.w-trip{min-width:110px;}
.w-facility{min-width:130px;}

.w-client{
  min-width:180px;
  text-align:left!important;
}

.w-phone{min-width:120px;}

.w-address{
  min-width:240px;
  max-width:340px;
  text-align:left!important;
  white-space:pre-line;
  word-break:break-word;
}

.w-stops{
  min-width:180px;
  max-width:280px;
  text-align:left!important;
  white-space:pre-line;
  word-break:break-word;
}

.w-notes{
  min-width:180px;
  max-width:280px;
  text-align:left!important;
  white-space:pre-line;
  word-break:break-word;
}

.w-date{min-width:105px;}
.w-time{min-width:90px;}
.w-status{min-width:105px;}

.w-view,
.w-actions{
  min-width:90px;
}

/* PILLS */

.trip-number-badge{
  font-weight:900;
  color:#1d4ed8;
  white-space:nowrap;
}

.status-pill{
  display:inline-flex;
  padding:5px 9px;
  border-radius:999px;
  font-size:12px;
  font-weight:900;
  background:#f1f5f9;
  color:#0f172a;
  white-space:nowrap;
}

.status-pill.scheduled{
  background:#f1f5f9;
  color:#334155;
  border:1px solid #cbd5e1;
}

.status-pill.confirmed{
  background:#bbf7d0;
  color:#14532d;
  border:1px solid #86efac;
}

.status-pill.paid{
  background:#dbeafe;
  color:#1d4ed8;
  border:1px solid #93c5fd;
}

.status-pill.rv,
.status-pill.reserved{
  background:#fef3c7;
  color:#92400e;
  border:1px solid #fcd34d;
}

/* BUTTONS */

.view-btn,
.btn-view{
  border:none;
  background:#0f172a;
  color:#fff;
  width:34px;
  height:34px;
  border-radius:8px;
  cursor:pointer;
  font-size:16px;
  font-weight:900;
}

.view-btn:hover,
.btn-view:hover{
  background:#2563eb;
}

.btn,
.btn-edit,
.btn-delete,
.btn-save,
.btn-cancel{
  border:none;
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
  font-size:12px;
  font-weight:900;
}

.btn-edit{
  background:#2563eb;
  color:#fff;
}

.btn-delete{
  background:#dc2626;
  color:#fff;
}

.btn-save{
  background:#16a34a;
  color:#fff;
}

.btn-cancel{
  background:#64748b;
  color:#fff;
}

/* DETAILS */

.details-row td{
  background:#f8fafc!important;
  padding:0!important;
}

.details-box{
  padding:14px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.details-item{
  background:#fff;
  border:1px solid #dbe3ee;
  border-radius:10px;
  padding:10px;
  text-align:left;
}

.details-label{
  font-size:11px;
  color:#64748b;
  font-weight:900;
  margin-bottom:4px;
}

.details-value{
  font-size:13px;
  font-weight:800;
  color:#0f172a;
  white-space:pre-line;
  word-break:break-word;
}

/* SHARED */

.shared-grid{
  display:flex;
  flex-direction:column;
  border:1px solid #cbd5e1;
  border-radius:8px;
  overflow:hidden;
  background:#fff;
}

.shared-cell{
  min-height:32px;
  padding:7px;
  border-bottom:1px solid #cbd5e1;
  background:#fff;
  text-align:left;
  font-size:12px;
  font-weight:800;
  white-space:pre-line;
  word-break:break-word;
}

.shared-cell:last-child{
  border-bottom:none;
}

/* EDIT INPUTS */

.edit-input,
.edit-textarea,
.hub-table input,
.hub-table textarea,
.hub-table select{
  width:100%;
  min-width:95px;
  padding:7px;
  border:1px solid #cbd5e1;
  border-radius:7px;
  font-size:12px;
  font-weight:700;
  box-sizing:border-box;
  font-family:inherit;
  background:#fff;
}

.edit-textarea,
.hub-table textarea{
  min-height:58px;
  resize:vertical;
}

/* NO DATA */

.no-data{
  background:#fff;
  padding:18px;
  border-radius:14px;
  box-shadow:0 8px 22px rgba(15,23,42,.08);
  color:#475569;
  font-weight:900;
}

/* MOBILE */

@media(max-width:768px){

  body{
    background:#eef3f8;
  }

  .page-content{
    padding:10px 8px 20px;
  }

  .page-head{
    min-height:72px;
    padding:12px;
    margin-bottom:10px;
  }

  .page-title{
    font-size:22px;
  }

  .page-sub{
    font-size:11px;
  }

  .toolbar{
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:8px;
    margin-bottom:8px;
  }

  .add-btn{
    width:150px;
    padding:10px 12px;
    border-radius:12px;
    font-size:14px;
  }

  .search-input{
    width:100%;
    min-width:0;
    padding:10px 12px;
    font-size:13px;
    border-radius:12px;
  }

  .stats-grid,
  .service-grid,
  .cards-grid,
  .hub-stats,
  .service-cards,
  .service-strip{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:7px;
    margin-bottom:8px;
  }

  .stat-card,
  .service-card,
  .hub-card{
    min-height:82px!important;
    border-radius:13px!important;
    padding:7px 5px!important;
    box-shadow:0 4px 10px rgba(15,23,42,.10);
  }

  .stat-label,
  .card-label,
  .service-name{
    font-size:10.5px!important;
    line-height:1.1;
  }

  .stat-value,
  .card-value,
  .service-total{
    font-size:24px!important;
    line-height:1;
    margin:5px 0!important;
  }

  .stat-mini,
  .card-mini,
  .service-mini{
    font-size:9px!important;
    gap:3px;
    line-height:1.1;
  }

  .filters,
  .filter-bar,
  .actions-bar,
  .selection-bar{
    gap:6px;
    margin:8px 0;
  }

  .filters select,
  .filter-bar select,
  .filters input,
  .filter-bar input{
    flex:1 1 30%;
    min-width:90px;
    padding:8px 9px;
    font-size:12px;
    border-radius:10px;
  }

  .select-btn,
  .action-btn,
