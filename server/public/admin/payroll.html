<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Payroll & Earnings</title>

<link rel="stylesheet" href="style.css">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#eef3f8;
  font-family:"Segoe UI",Arial,sans-serif;
  color:#0f2747;
}

#adminHeader{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:1000;
}

.payroll-page{
  max-width:1900px;
  margin:0 auto;
  padding:255px 22px 80px;
}

.page-title{
  margin:0 0 22px;
  text-align:center;
  color:#d4a900;
  font-size:38px;
  font-weight:900;
}

.period-card{
  max-width:900px;
  margin:0 auto 18px;
  padding:16px 18px;
  background:#fff;
  border:1px solid rgba(212,169,0,.32);
  border-radius:18px;
  box-shadow:0 8px 24px rgba(15,39,71,.07);
}

.period-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}

.period-info{
  min-width:0;
}

.period-label{
  color:#64748b;
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
}

.period-value{
  margin-top:4px;
  color:#0f2747;
  font-size:22px;
  font-weight:900;
}

.period-zone{
  margin-top:4px;
  color:#718096;
  font-size:12px;
  font-weight:700;
}

.period-edit{
  display:none;
  grid-template-columns:1fr 1fr auto auto;
  gap:9px;
  align-items:end;
  margin-top:14px;
}

.period-edit.show{
  display:grid;
}

.field{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.field label{
  color:#53657a;
  font-size:11px;
  font-weight:900;
}

.field input{
  height:40px;
  padding:0 11px;
  border:1px solid #cbd6e2;
  border-radius:10px;
  background:#fff;
  color:#0f2747;
  font-size:14px;
  font-weight:700;
}

.primary-btn,
.soft-btn{
  height:40px;
  padding:0 15px;
  border:0;
  border-radius:10px;
  font-weight:900;
  cursor:pointer;
}

.primary-btn{
  background:#0f2747;
  color:#fff;
}

.soft-btn{
  background:#e8eef6;
  color:#0f2747;
}

.tabs{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.tab-btn{
  min-width:130px;
  padding:11px 17px;
  border:1px solid rgba(212,169,0,.55);
  border-radius:14px;
  background:linear-gradient(180deg,#fff,#edf3f9);
  color:#0f2747;
  box-shadow:0 5px 14px rgba(15,39,71,.08);
  font-size:13px;
  font-weight:900;
  cursor:pointer;
}

.tab-btn.active{
  background:linear-gradient(180deg,#173f70,#0f2747);
  color:#ffd21f;
  border-color:#d4a900;
}

.summary-row{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.summary-card{
  min-width:180px;
  padding:13px 18px;
  background:#fff;
  border:1px solid rgba(212,169,0,.28);
  border-radius:15px;
  text-align:center;
  color:#64748b;
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
  box-shadow:0 6px 18px rgba(15,39,71,.06);
}

.summary-card b{
  display:block;
  margin-top:4px;
  color:#0f2747;
  font-size:21px;
}

.table-card{
  overflow:hidden;
  background:#fff;
  border:1px solid #dfe7f0;
  border-radius:20px;
  box-shadow:0 10px 28px rgba(15,39,71,.08);
}

.table-wrap{
  width:100%;
  overflow:auto;
}

table{
  width:100%;
  min-width:1240px;
  border-collapse:collapse;
}

thead th{
  padding:11px 9px;
  background:#0f2747;
  color:#fff;
  text-align:left;
  white-space:nowrap;
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
}

tbody td{
  padding:9px;
  border-bottom:1px solid #e5ebf2;
  background:#fff;
  vertical-align:middle;
  font-size:12px;
}

tbody tr:nth-child(even) td{
  background:#fbfdff;
}

.name-cell{
  min-width:170px;
  color:#0f2747;
  font-weight:900;
  background:linear-gradient(90deg,#fff7cf,#fff) !important;
  border-left:4px solid #d4a900;
}

tbody tr:nth-child(even) .name-cell{
  background:linear-gradient(90deg,#eaf2ff,#fff) !important;
  border-left-color:#0f2747;
}

.name-sub{
  margin-top:3px;
  color:#718096;
  font-size:10px;
  font-weight:700;
}

.rate-input{
  width:82px;
  height:34px;
  padding:0 7px;
  border:1px solid #cbd6e2;
  border-radius:8px;
  background:#fff;
  text-align:center;
  font-size:12px;
  font-weight:800;
}

.rate-input:disabled{
  background:#eef2f6;
  color:#58697b;
}

.actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.edit-btn,
.save-btn,
.hours-btn{
  min-height:32px;
  padding:0 10px;
  border:0;
  border-radius:8px;
  font-size:10px;
  font-weight:900;
  cursor:pointer;
}

.edit-btn{
  background:#e8eef6;
  color:#0f2747;
}

.save-btn{
  background:#145cff;
  color:#fff;
}

.hours-btn{
  background:#dbeafe;
  color:#174a8b;
}

button:disabled{
  opacity:.48;
  cursor:not-allowed;
}

.modal{
  position:fixed;
  inset:0;
  z-index:5000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(5,20,40,.55);
}

.modal.show{
  display:flex;
}

.modal-card{
  width:min(520px,96vw);
  padding:22px;
  background:#fff;
  border-radius:20px;
}

.modal-title{
  margin-bottom:16px;
  color:#0f2747;
  font-size:22px;
  font-weight:900;
}

.modal-card .field{
  margin-top:10px;
}

.modal-card .field input{
  width:100%;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:17px;
}

@media(max-width:900px){
  .payroll-page{
    padding:310px 10px 60px;
  }

  .page-title{
    font-size:30px;
  }

  .period-edit{
    grid-template-columns:1fr;
  }

  .tab-btn{
    min-width:108px;
    padding:10px 11px;
    font-size:11px;
  }
}
</style>
</head>

<body>

<div id="adminHeader"></div>

<main class="payroll-page">

  <h1 class="page-title">
    Payroll & Earnings
  </h1>

  <section class="period-card">

    <div class="period-top">

      <div class="period-info">
        <div class="period-label">
          Current Company Pay Period
        </div>

        <div
          class="period-value"
          id="currentPeriod">
          Loading...
        </div>

        <div
          class="period-zone"
          id="timezoneText">
        </div>
      </div>

      <button
        class="soft-btn"
        id="editPeriodBtn"
        type="button">
        Edit Pay Period
      </button>

    </div>

    <div
      class="period-edit"
      id="periodEdit">

      <div class="field">
        <label>START DATE</label>
        <input
          type="date"
          id="periodFrom">
      </div>

      <div class="field">
        <label>END DATE</label>
        <input
          type="date"
          id="periodTo">
      </div>

      <button
        class="primary-btn"
        id="savePeriodBtn"
        type="button">
        Save Period
      </button>

      <button
        class="soft-btn"
        id="cancelPeriodBtn"
        type="button">
        Cancel
      </button>

    </div>

  </section>

  <section class="tabs">

    <button
      class="tab-btn active"
      data-type="driver"
      type="button">
      Drivers
    </button>

    <button
      class="tab-btn"
      data-type="dispatcher"
      type="button">
      Dispatchers
    </button>

    <button
      class="tab-btn"
      data-type="admin"
      type="button">
      Admins
    </button>

    <button
      class="tab-btn"
      data-type="super_admin"
      type="button">
      Super Admins
    </button>

    <button
      class="tab-btn"
      data-type="employee"
      type="button">
      Employees
    </button>

  </section>

  <section class="summary-row">

    <div class="summary-card">
      People
      <b id="peopleCount">0</b>
    </div>

    <div class="summary-card">
      Total Hours
      <b id="allHours">0 H 00 MIN</b>
    </div>

    <div class="summary-card">
      Total Earnings
      <b id="allDue">$0.00</b>
    </div>

    <button
      class="primary-btn"
      id="addEmployeeBtn"
      type="button"
      style="display:none;">
      + Add Employee
    </button>

  </section>

  <section class="table-card">

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>Name</th>
            <th>Regular Hrs</th>
            <th>OT Hrs</th>
            <th>Total Hrs</th>
            <th>Hourly Rate</th>
            <th>OT Rate</th>
            <th>OT After / Week</th>
            <th>Regular Pay</th>
            <th>OT Pay</th>
            <th>Total Earnings</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="payrollBody"></tbody>

      </table>

    </div>

  </section>

</main>

<div class="modal" id="hoursModal">
  <div class="modal-card">

    <div class="modal-title">
      Add / Update Work Hours
    </div>

    <input
      type="hidden"
      id="hoursPersonId">

    <div class="field">
      <label>WORK DATE</label>
      <input
        type="date"
        id="hoursDate">
    </div>

    <div class="field">
      <label>HOURS</label>
      <input
        type="number"
        id="hoursValue"
        min="0"
        max="24"
        step="0.25">
    </div>

    <div class="field">
      <label>NOTE</label>
      <input
        type="text"
        id="hoursNote">
    </div>

    <div class="modal-actions">
      <button
        class="soft-btn"
        id="closeHoursBtn"
        type="button">
        Cancel
      </button>

      <button
        class="primary-btn"
        id="saveHoursBtn"
        type="button">
        Save Hours
      </button>
    </div>

  </div>
</div>

<div class="modal" id="employeeModal">
  <div class="modal-card">

    <div class="modal-title">
      Add Employee
    </div>

    <div class="field">
      <label>NAME</label>
      <input
        type="text"
        id="employeeName">
    </div>

    <div class="field">
      <label>EMPLOYEE ID</label>
      <input
        type="text"
        id="employeeNumber">
    </div>

    <div class="field">
      <label>JOB TITLE</label>
      <input
        type="text"
        id="employeeJobTitle">
    </div>

    <div class="field">
      <label>PHONE</label>
      <input
        type="text"
        id="employeePhone">
    </div>

    <div class="field">
      <label>EMAIL</label>
      <input
        type="email"
        id="employeeEmail">
    </div>

    <div class="modal-actions">
      <button
        class="soft-btn"
        id="closeEmployeeBtn"
        type="button">
        Cancel
      </button>

      <button
        class="primary-btn"
        id="saveEmployeeBtn"
        type="button">
        Save Employee
      </button>
    </div>

  </div>
</div>

<script src="header.js"></script>
<script src="payroll.js"></script>

</body>
</html>
