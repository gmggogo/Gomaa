<header class="admin-header">

<!-- ================= TOP BAR ================= -->

<div class="top-bar">

  <!-- MOBILE MENU BUTTON -->
  <button
    type="button"
    class="mobile-menu-btn"
    id="mobileMenuBtn"
    aria-label="Open Menu">
    ☰
  </button>

  <!-- LEFT -->
  <div class="top-left">
    <img
      class="logo app-logo main-logo"
      alt="Company Logo">
  </div>

  <!-- CENTER -->
  <div class="top-center">

    <div
      class="company"
      id="dynamicCompanyName">
      Loading...
    </div>

    <div class="welcome-box">
      <span id="weatherIcon"></span>
      <span id="welcomeMessage"></span>
    </div>

  </div>

  <!-- RIGHT -->
  <div class="top-right">

    <span id="azTime"></span>

    <button
      class="logout-btn"
      onclick="logout()">
      Logout
    </button>

  </div>

</div>

<!-- ================= DESKTOP NAV ================= -->

<div class="admin-nav-wrapper">

<nav class="admin-nav" id="adminDesktopNav" aria-label="Main navigation"></nav>

<div class="gh-powered">
Powered by GH Mobility
</div>

</div>

<!-- ================= MOBILE SIDE MENU ================= -->

<div
  class="mobile-menu-overlay"
  id="mobileMenuOverlay">
</div>

<aside
  class="mobile-side-menu"
  id="mobileSideMenu">

  <div class="mobile-side-head">

    <img
      class="mobile-side-logo app-logo"
      alt="Company Logo">

    <div class="mobile-side-title">

      <div id="mobileCompanyName">
        Company
      </div>

      <small id="mobileRoleLabel">Panel</small>

    </div>

    <button
      type="button"
      class="mobile-close-btn"
      id="mobileCloseBtn">
      ×
    </button>

  </div>

  <nav
    class="mobile-side-nav"
    id="mobileSideNav">
  </nav>

  <button
    type="button"
    class="mobile-logout-btn"
    onclick="logout()">
    🚪 Logout
  </button>

  <div class="mobile-powered">
    GH Mobility
  </div>

</aside>

</header>
