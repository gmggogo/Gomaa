<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Live Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="/admin/style.css">
<link rel="stylesheet" href="/admin/header.css">

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<link rel="stylesheet" href="/admin/maps.css">

<style>
*{box-sizing:border-box;}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:#020617;
  font-family:Segoe UI,Arial,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ===== ADMIN HEADER — SAME LOADER AS OTHER ADMIN PAGES ===== */
#adminHeader{
  width:100%;
  flex:0 0 auto;
  z-index:10000;
}

/* ===== PAGE AREA ===== */
.map-content{
  flex:1 1 auto;
  min-height:0;
  width:100%;
  padding:18px 22px 22px;
  background:#f1f5f9;
  display:flex;
  flex-direction:column;
}

/* ===== GOLD PAGE TITLE — SAME AS TRIPS HUB ===== */
.page-head{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:84px;
  margin-bottom:12px;
  padding:16px 20px;
  border:1px solid #e0be5a;
  border-radius:18px;
  background:linear-gradient(
    135deg,
    #fff8dc 0%,
    #f8e6ae 48%,
    #fff4cf 100%
  );
  box-shadow:0 8px 22px rgba(146,102,14,.13);
  text-align:center;
}

.page-title{
  margin:0;
  font-size:28px;
  line-height:1.1;
  font-weight:900;
  color:#111827;
}

.page-sub{
  margin-top:5px;
  font-size:13px;
  font-weight:800;
  color:#64748b;
}

/* ===== MAP ===== */
.map-page{
  position:relative;
  flex:1 1 auto;
  min-height:0;
  width:100%;
  overflow:hidden;
  border-radius:16px;
  background:#020617;
  box-shadow:0 8px 22px rgba(15,23,42,.16);
}

#map{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:1;
}

@media(max-width:768px){
  .map-content{
    padding:10px 8px 12px;
  }

  .page-head{
    min-height:72px;
    padding:12px;
    margin-bottom:10px;
  }

  .page-title{
    font-size:22px;
  }

  .page-sub{
    font-size:11px;
  }
}
</style>
</head>

<body>

<!-- ADMIN MAIN HEADER -->
<div id="adminHeader"></div>

<div class="map-content">

  <div class="page-head">
    <div>
      <h1 class="page-title">Drivers Map</h1>
      <div class="page-sub">Live driver locations and fleet overview</div>
    </div>
  </div>

  <div class="map-page">
    <div id="map"></div>
  </div>

</div>

<script>
/* =========================
   SECURITY
========================= */

const token = localStorage.getItem("token") || "";
const role = String(localStorage.getItem("role") || "").trim().toUpperCase();

if(!token || !["SUPER_ADMIN","ADMIN","DISPATCHER"].includes(role)){
  window.location.href = "/login.html";
}
</script>

<!-- SAME ADMIN HEADER LOADER USED BY THE WORKING ADMIN PAGES -->
<script src="/admin/header.js"></script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/admin/maps.js"></script>

</body>
</html>
