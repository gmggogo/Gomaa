<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Help Center</title>
<link rel="stylesheet" href="/admin/style.css">
<style>
  body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,sans-serif}
  #adminHeader{min-height:0}
  .help-shell{max-width:1320px;margin:22px auto 60px;padding:0 18px}
  .help-hero{background:#fff;border:1px solid #dbe3ef;border-radius:18px;padding:24px}
  .help-title{margin:0 0 6px;font-size:29px}
  .help-sub{margin:0;color:#667085;line-height:1.55}
  .help-search-row{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:12px;margin-top:20px}
  .help-search,.help-select{width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:12px;padding:13px 14px;font-size:16px;background:#fff;color:#172033}
  .help-search:focus,.help-select:focus{outline:3px solid rgba(37,99,235,.15);border-color:#2563eb}
  .help-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;color:#64748b;font-size:13px}
  .help-chip{background:#eef2f7;border:1px solid #dbe3ef;border-radius:999px;padding:5px 9px}
  .help-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;margin-top:18px}
  .help-panel{background:#fff;border:1px solid #dbe3ef;border-radius:16px;padding:16px}
  .help-module-list{display:flex;flex-direction:column;gap:7px}
  .help-module-btn{border:0;background:#f8fafc;border-radius:10px;padding:10px 11px;text-align:left;font-weight:700;color:#344054;cursor:pointer}
  .help-module-btn.active{background:#eaf1ff;color:#174ea6}
  .help-count{font-size:13px;color:#667085;margin:0 0 12px}
  .help-result{border:1px solid #e2e8f0;border-radius:14px;margin-bottom:12px;overflow:hidden;background:#fff}
  .help-result-head{width:100%;border:0;background:#fff;padding:15px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;gap:15px;align-items:flex-start}
  .help-result-title{font-weight:800;font-size:16px;color:#172033}
  .help-result-meta{font-size:12px;color:#667085;margin-top:5px}
  .help-result-summary{font-size:14px;color:#475467;margin-top:7px;line-height:1.45}
  .help-result-body{display:none;border-top:1px solid #e2e8f0;padding:15px;background:#fbfdff}
  .help-result.open .help-result-body{display:block}
  .help-result.open .help-chevron{transform:rotate(180deg)}
  .help-chevron{transition:transform .15s ease;font-size:18px}
  .help-steps{margin:0;padding-left:22px;line-height:1.65}
  .help-warning{margin-top:12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:10px;color:#9a3412}
  .help-source{margin-top:12px;font-size:12px;color:#64748b}
  .help-empty{padding:30px;text-align:center;color:#667085}
  @media(max-width:800px){
    .help-search-row{grid-template-columns:1fr}
    .help-layout{grid-template-columns:1fr}
    .help-module-list{display:flex;flex-direction:row;overflow:auto;padding-bottom:4px}
    .help-module-btn{white-space:nowrap}
  }
</style>
</head>
<body>
<div id="adminHeader"></div>
<main class="help-shell">
  <section class="help-hero">
    <h1 class="help-title">Help Center</h1>
    <p class="help-sub">Search by task, action, field, or problem. Results are filtered by your role and the modules enabled for this tenant.</p>
    <div class="help-search-row">
      <input id="helpSearch" class="help-search" type="search" placeholder="Example: change pickup time, assign driver, add broker trip..." autocomplete="off">
      <select id="helpPageFilter" class="help-select" aria-label="Page filter">
        <option value="">All accessible pages</option>
      </select>
    </div>
    <div class="help-meta">
      <span class="help-chip" id="helpRoleChip">Role: --</span>
      <span class="help-chip" id="helpContextChip">Context: All pages</span>
      <span class="help-chip" id="helpFeatureChip">Features: Core</span>
    </div>
  </section>

  <div class="help-layout">
    <aside class="help-panel">
      <p class="help-count">Modules</p>
      <div id="helpModules" class="help-module-list"></div>
    </aside>

    <section class="help-panel">
      <p id="helpResultCount" class="help-count">Loading help...</p>
      <div id="helpResults"></div>
    </section>
  </div>
</main>

<script src="/admin/header.js"></script>
<script src="/admin/help-center.js"></script>
</body>
</html>
