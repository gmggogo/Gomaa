<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Help Center</title>
<link rel="stylesheet" href="/admin/style.css">
<style>
  body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,sans-serif}
  .help-shell{max-width:1380px;margin:22px auto 60px;padding:0 18px}
  .help-hero,.section-card{background:#fff;border:1px solid #dbe3ef;border-radius:18px;padding:22px}
  .section-card{margin-top:18px}
  .help-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
  .help-title{margin:0 0 6px;font-size:29px}
  .help-sub{margin:0;color:#667085;line-height:1.55}
  .lang-wrap{display:flex;align-items:center;gap:8px;white-space:nowrap}
  .lang-label{font-size:13px;font-weight:800;color:#475467}
  .lang-select{min-width:190px;border:1px solid #cbd5e1;border-radius:12px;padding:11px 12px;background:#fff;color:#172033}
  .help-search-row{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:12px;margin-top:18px}
  .help-search,.help-select{width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:12px;padding:13px 14px;font-size:16px;background:#fff;color:#172033}
  .help-search:focus,.help-select:focus,.lang-select:focus{outline:3px solid rgba(37,99,235,.14);border-color:#2563eb}

  .selected-page-card{background:#fff;border:1px solid #dbe3ef;border-radius:16px;padding:20px 22px;margin-top:18px}
  .selected-page-card[hidden]{display:none}
  .selected-page-id{font-size:12px;font-weight:800;color:#2563eb;margin-bottom:5px}
  .selected-page-title{margin:0 0 8px;font-size:25px;line-height:1.2;color:#172033}
  .selected-page-description{margin:0;color:#667085;line-height:1.6;font-size:15px}
  .results-card{margin-top:18px}
  .section-title{margin:0 0 5px;font-size:20px}
  .section-sub{margin:0 0 15px;color:#667085;font-size:13px}
  .results-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}
  .help-count{font-size:13px;color:#667085;margin:0}
  .clear-btn{border:1px solid #cbd5e1;background:#fff;border-radius:9px;padding:8px 11px;cursor:pointer;font-weight:700;color:#344054}
  .help-result{border:1px solid #e4c66b;border-radius:14px;margin-bottom:12px;overflow:hidden;background:#fffdf7;box-shadow:0 3px 10px rgba(15,23,42,.04)}
  .help-result-head{width:100%;border:0;background:linear-gradient(90deg,#fff7d7 0%,#fffdf6 100%);padding:15px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;gap:15px;align-items:flex-start}
  .help-result-title{font-weight:800;font-size:16px;color:#172033}
  .help-result-meta{font-size:12px;color:#667085;margin-top:5px}
  .help-result-summary{font-size:14px;color:#475467;margin-top:7px;line-height:1.45}
  .help-result-body{display:none;border-top:1px solid #ead696;padding:15px;background:#fff}
  .help-result.open .help-result-body{display:block}
  .help-result.open .help-chevron{transform:rotate(180deg)}
  .help-chevron{transition:transform .15s ease;font-size:18px}
  .help-steps{margin:0;padding-left:22px;line-height:1.7}
  .help-warning{margin-top:12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:10px;color:#9a3412}
  .help-source{margin-top:12px;font-size:12px;color:#64748b}
  .scope-explanation{margin:0 0 14px;padding:13px 14px;border:1px solid #e4c66b;border-left:5px solid #d79a00;border-radius:12px;background:#fff7d7;color:#5b4300;line-height:1.55;font-size:13px}
  .help-empty{padding:30px;text-align:center;color:#667085}
  html[dir="rtl"] .selected-page-card,
  html[dir="rtl"] .help-result-head{ text-align:right }
  html[dir="rtl"] .help-steps{padding-left:0;padding-right:22px}
  @media(max-width:1100px){
  @media(max-width:800px){
    .help-top{flex-direction:column}
    .help-search-row{grid-template-columns:1fr}
  }
  @media(max-width:560px){

  /* ===== HELP CENTER VISUAL FINAL ===== */

  /* Main Help Center box */
  .help-hero{
    background:linear-gradient(135deg,#fffaf0 0%,#fff4cf 100%)!important;
    border:1px solid #e2bb48!important;
    box-shadow:0 8px 22px rgba(151,102,0,.12)!important;
  }

  .help-title{
    color:#8a5a00!important;
    font-weight:900!important;
  }

  .help-sub{
    color:#6f5a24!important;
    font-weight:600!important;
  }

  /* Language selector = GOLD */
  .lang-select{
    appearance:none!important;
    -webkit-appearance:none!important;
    background:
      linear-gradient(45deg,transparent 50%,#402b00 50%) calc(100% - 18px) 52%/6px 6px no-repeat,
      linear-gradient(135deg,#f9d975 0%,#d99b00 100%)!important;
    color:#241900!important;
    border:1px solid #c58900!important;
    font-weight:900!important;
    padding-right:38px!important;
    box-shadow:0 4px 10px rgba(151,102,0,.16)!important;
  }

  .lang-select option{
    background:#fff7dc!important;
    color:#241900!important;
    font-weight:700!important;
  }

  /* Page selector beside search = BLUE/TEAL with GOLD arrow */
  .help-select{
    appearance:none!important;
    -webkit-appearance:none!important;
    background:
      linear-gradient(45deg,transparent 50%,#ffd96a 50%) calc(100% - 18px) 52%/6px 6px no-repeat,
      linear-gradient(135deg,#1976a8 0%,#075f8c 100%)!important;
    color:#fff!important;
    border:1px solid #084f73!important;
    font-weight:900!important;
    padding-right:38px!important;
    box-shadow:0 4px 10px rgba(7,95,140,.18)!important;
  }

  .help-select option,
  .help-select optgroup{
    background:#eef8ff!important;
    color:#12354b!important;
    font-weight:700!important;
  }

  .help-select optgroup{
    color:#075f8c!important;
    font-weight:900!important;
  }

  /* Search field */
  .help-search{
    background:#fff!important;
    border:2px solid #d7bd66!important;
    box-shadow:inset 0 0 0 1px rgba(217,155,0,.05)!important;
  }

  .help-search:focus,
  .help-select:focus,
  .lang-select:focus{
    outline:3px solid rgba(217,155,0,.18)!important;
    border-color:#d99b00!important;
  }

  /* Selected page definition */
  .selected-page-card{
    background:linear-gradient(135deg,#edf8ff 0%,#f7fbff 100%)!important;
    border:1px solid #8fc8e8!important;
    border-left:6px solid #1678aa!important;
  }

  .selected-page-id{
    color:#a86f00!important;
  }

  .selected-page-title{
    color:#075f8c!important;
    font-weight:900!important;
  }

  /* Results "table" / cards */
  .results-card{
    background:linear-gradient(180deg,#fffdf7 0%,#fff9e7 100%)!important;
    border:1px solid #e4c66b!important;
    box-shadow:0 6px 18px rgba(151,102,0,.08)!important;
  }

  .help-result{
    border:1px solid #d9bc63!important;
    background:#fff!important;
    box-shadow:0 4px 12px rgba(15,23,42,.05)!important;
  }

  .help-result:nth-child(4n+1) .help-result-head{
    background:linear-gradient(90deg,#fff1bd 0%,#fffaf0 100%)!important;
    border-left:5px solid #d99b00!important;
  }

  .help-result:nth-child(4n+2) .help-result-head{
    background:linear-gradient(90deg,#e6f5ff 0%,#f7fbff 100%)!important;
    border-left:5px solid #1484b8!important;
  }

  .help-result:nth-child(4n+3) .help-result-head{
    background:linear-gradient(90deg,#eaf8ef 0%,#f8fff9 100%)!important;
    border-left:5px solid #2f9e5b!important;
  }

  .help-result:nth-child(4n) .help-result-head{
    background:linear-gradient(90deg,#f1eaff 0%,#fbf9ff 100%)!important;
    border-left:5px solid #7b52b9!important;
  }

  .help-result-title{
    color:#172033!important;
    font-weight:900!important;
  }

  .help-result-meta{
    color:#7a5b10!important;
    font-weight:700!important;
  }

  .help-result-body{
    background:#fff!important;
    border-top:1px solid #eadba8!important;
  }

  .help-chevron{
    color:#9d6a00!important;
    font-weight:900!important;
  }

  .scope-explanation{
    background:#fff0b5!important;
    border:1px solid #dfb735!important;
    border-left:6px solid #d28d00!important;
    color:#5a4100!important;
    font-weight:700!important;
  }

  .clear-btn{
    background:linear-gradient(135deg,#f9d975 0%,#d99b00 100%)!important;
    color:#241900!important;
    border:1px solid #c58900!important;
    font-weight:900!important;
  }


  /* ===== HELP CENTER PAGE TITLE BAND ===== */
  .help-page-title-band{
    width:100%;
    box-sizing:border-box;
    margin:0 0 18px;
    padding:16px 18px 14px;
    text-align:center;
    background:linear-gradient(90deg,#fff7d7 0%,#f7e49d 50%,#fff7d7 100%);
    border-top:1px solid #ead37d;
    border-bottom:1px solid #d7bd5c;
    box-shadow:0 3px 10px rgba(151,102,0,.08);
  }

  .help-page-title-band h1{
    margin:0;
    font-size:24px;
    line-height:1.2;
    font-weight:900;
    color:#6f4b00;
    letter-spacing:.2px;
  }

</style>
</head>
<body>
<div id="adminHeader"></div>

<div class="help-page-title-band">
  <h1>Help Center</h1>
</div>


<main class="help-shell">

  <section class="help-hero">
    <div class="help-top">
      <div>
        <h1 id="uiTitle" class="help-title">Help Center</h1>
        <p id="uiSubtitle" class="help-sub">Choose a page or search for the task you need.</p>
      </div>

      <div class="lang-wrap">
        <label id="uiLanguageLabel" class="lang-label" for="helpLanguage">Language</label>
        <select id="helpLanguage" class="lang-select">
          <option value="en">English</option>
          <option value="es-MX">Español (México)</option>
          <option value="ar">العربية</option>
          <option value="fr">Français</option>
          <option value="it">Italiano</option>
        </select>
      </div>
    </div>

    <div class="help-search-row">
      <input id="helpSearch" class="help-search" type="search"
             placeholder="Example: change pickup time, assign driver, add broker trip..."
             autocomplete="off">

      <select id="helpPageFilter" class="help-select" aria-label="Page filter">
        <option value="">All accessible pages</option>
      </select>
    </div>
  </section>

  <section id="selectedPageCard" class="selected-page-card" hidden>
    <div id="selectedPageId" class="selected-page-id"></div>
    <h2 id="selectedPageTitle" class="selected-page-title"></h2>
    <p id="selectedPageDescription" class="selected-page-description"></p>
  </section>

  <section class="section-card results-card">
    <div class="results-head">
      <p id="helpResultCount" class="help-count">Loading help...</p>
      <button id="clearPageFilter" class="clear-btn" type="button">Show All Pages</button>
    </div>
    <div id="helpResults"></div>
  </section>

</main>

<script src="/admin/header.js"></script>
<script src="/admin/help-center.js"></script>
</body>
</html>
