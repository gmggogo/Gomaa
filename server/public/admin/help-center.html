<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Help Center</title>

<link rel="stylesheet" href="/admin/style.css">

<style>
/* =====================================================
   HELP CENTER
   Page title layout matches the Trips page
===================================================== */

body{
  margin:0;
  font-family:Segoe UI,Arial,sans-serif;
  background:#f1f5f9;
  color:#0f172a;
}

#adminHeader{
  width:100%;
  z-index:1000;
}

/* PAGE */

.page-body{
  padding:18px 22px 30px;
  width:100%;
  box-sizing:border-box;
}

/* PAGE TITLE — SAME STRUCTURE / STYLE AS TRIPS */

.page-head{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:84px;
  margin-bottom:12px;
  padding:16px 20px;
  border:1px solid #e0be5a;
  border-radius:18px;
  background:linear-gradient(
    135deg,
    #fff8dc 0%,
    #f8e6ae 48%,
    #fff4cf 100%
  );
  box-shadow:0 8px 22px rgba(146,102,14,.13);
  text-align:center;
}

.page-title{
  margin:0;
  font-size:28px;
  line-height:1.1;
  font-weight:900;
  color:#111827;
}

.page-sub{
  margin-top:5px;
  font-size:13px;
  font-weight:800;
  color:#64748b;
}

/* HELP CONTENT */

.help-shell{
  width:100%;
}

.help-hero,
.section-card,
.selected-page-card{
  background:#fff;
  border:1px solid #dbe3ef;
  border-radius:16px;
  box-shadow:0 6px 16px rgba(15,23,42,.06);
}

.help-hero{
  padding:18px;
}

.help-top{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:12px;
}

.lang-wrap{
  display:flex;
  align-items:center;
  gap:8px;
  white-space:nowrap;
}

.lang-label{
  font-size:13px;
  font-weight:900;
  color:#475467;
}

.lang-select{
  min-width:190px;
  border:2px solid #b97d00;
  border-radius:11px;
  padding:11px 12px;
  background:linear-gradient(135deg,#f8d66d 0%,#d99a00 100%);
  color:#241900;
  font-size:14px;
  font-weight:900;
  box-shadow:0 4px 10px rgba(151,102,0,.16);
}

.lang-select option{
  background:#fff;
  color:#172033;
  font-weight:700;
}

.help-search-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 250px;
  gap:12px;
  margin-top:14px;
}

.help-search,
.help-select{
  width:100%;
  box-sizing:border-box;
  border-radius:11px;
  padding:13px 14px;
  font-size:15px;
  font-family:inherit;
}

.help-search{
  background:#fff;
  color:#172033;
  border:2px solid #d5b24b;
}

.help-select{
  border:2px solid #064f75;
  background:linear-gradient(135deg,#1685b5 0%,#075f8c 100%);
  color:#fff;
  font-weight:900;
}

.help-select option{
  background:#fff;
  color:#172033;
  font-weight:700;
}

.help-select optgroup{
  background:#eef8ff;
  color:#075f8c;
  font-weight:900;
}

.help-search:focus,
.help-select:focus,
.lang-select:focus{
  outline:3px solid rgba(217,155,0,.15);
  border-color:#d99a00;
}

/* SELECTED PAGE */

.selected-page-card{
  padding:18px 20px;
  margin-top:14px;
  background:linear-gradient(135deg,#eaf7ff 0%,#f8fcff 100%);
  border-left:6px solid #1679aa;
}

.selected-page-card[hidden]{
  display:none;
}

.selected-page-id{
  font-size:12px;
  font-weight:900;
  color:#a86f00;
  margin-bottom:5px;
}

.selected-page-title{
  margin:0 0 7px;
  font-size:24px;
  font-weight:900;
  color:#075f8c;
}

.selected-page-description{
  margin:0;
  color:#64748b;
  line-height:1.55;
  font-size:14px;
}

/* RESULTS */

.section-card{
  padding:16px;
  margin-top:14px;
  background:linear-gradient(180deg,#fffdf8 0%,#fff8df 100%);
  border-color:#e2bf55;
}

.results-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
}

.help-count{
  margin:0;
  font-size:13px;
  font-weight:800;
  color:#64748b;
}

.clear-btn{
  border:1px solid #c58900;
  border-radius:9px;
  padding:8px 11px;
  cursor:pointer;
  background:linear-gradient(135deg,#f8d66d 0%,#d99a00 100%);
  color:#241900;
  font-weight:900;
}

.help-result{
  margin-bottom:10px;
  border:1px solid #d7bb61;
  border-radius:12px;
  overflow:hidden;
  background:#fff;
  box-shadow:0 4px 12px rgba(15,23,42,.05);
}

.help-result-head{
  width:100%;
  border:0;
  padding:14px;
  text-align:left;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
  background:linear-gradient(90deg,#fff0b8 0%,#fffaf0 100%);
  border-left:5px solid #d79a00;
}

.help-result:nth-child(4n+2) .help-result-head{
  background:linear-gradient(90deg,#e2f4ff 0%,#f8fcff 100%);
  border-left-color:#1685b5;
}

.help-result:nth-child(4n+3) .help-result-head{
  background:linear-gradient(90deg,#e6f8ec 0%,#f8fff9 100%);
  border-left-color:#2f9e5b;
}

.help-result:nth-child(4n) .help-result-head{
  background:linear-gradient(90deg,#eee6ff 0%,#fbf9ff 100%);
  border-left-color:#7b52b9;
}

.help-result-title{
  font-size:16px;
  font-weight:900;
  color:#172033;
}

.help-result-meta{
  margin-top:5px;
  font-size:12px;
  font-weight:800;
  color:#7a5b10;
}

.help-result-summary{
  margin-top:7px;
  font-size:14px;
  line-height:1.45;
  color:#475467;
}

.help-result-body{
  display:none;
  padding:15px;
  border-top:1px solid #eadba8;
  background:#fff;
}

.help-result.open .help-result-body{
  display:block;
}

.help-result.open .help-chevron{
  transform:rotate(180deg);
}

.help-chevron{
  color:#9d6a00;
  font-size:18px;
  font-weight:900;
  transition:transform .15s ease;
}

.help-steps{
  margin:0;
  padding-left:22px;
  line-height:1.7;
}

.help-warning{
  margin-top:12px;
  padding:10px;
  border:1px solid #fed7aa;
  border-radius:10px;
  background:#fff7ed;
  color:#9a3412;
}

.help-source{
  margin-top:12px;
  font-size:12px;
  color:#64748b;
}

.scope-explanation{
  margin:0 0 12px;
  padding:12px 14px;
  border:1px solid #dfb735;
  border-left:6px solid #d28d00;
  border-radius:10px;
  background:#fff0b5;
  color:#5a4100;
  font-size:13px;
  font-weight:700;
  line-height:1.55;
}

.help-empty{
  padding:28px;
  text-align:center;
  color:#667085;
  font-weight:700;
}

/* RTL */

html[dir="rtl"] .help-result-head,
html[dir="rtl"] .selected-page-card{
  text-align:right;
}

html[dir="rtl"] .help-result-head,
html[dir="rtl"] .selected-page-card{
  border-left-width:1px;
  border-right:5px solid #d79a00;
}

html[dir="rtl"] .help-steps{
  padding-left:0;
  padding-right:22px;
}

/* RESPONSIVE */

@media(max-width:768px){

  .page-body{
    padding:10px 8px 20px;
  }

  .page-head{
    min-height:72px;
    padding:12px;
    margin-bottom:10px;
  }

  .page-title{
    font-size:22px;
  }

  .page-sub{
    font-size:11px;
  }

  .help-top{
    justify-content:flex-start;
  }

  .help-search-row{
    grid-template-columns:1fr;
  }

  .lang-wrap{
    width:100%;
  }

  .lang-select{
    flex:1;
    min-width:0;
  }
}
</style>
</head>

<body>

<div id="adminHeader"></div>

<div class="page-body">

  <div class="page-head">
    <div>
      <h1 id="uiTitle" class="page-title">Help Center</h1>
      <div id="uiSubtitle" class="page-sub">
        Choose a page or search for the task you need.
      </div>
    </div>
  </div>

  <main class="help-shell">

    <section class="help-hero">

      <div class="help-top">
        <div class="lang-wrap">
          <label id="uiLanguageLabel" class="lang-label" for="helpLanguage">
            Language
          </label>

          <select id="helpLanguage" class="lang-select">
            <option value="en">English</option>
            <option value="es-MX">Español (México)</option>
            <option value="ar">العربية</option>
            <option value="fr">Français</option>
            <option value="it">Italiano</option>
          </select>
        </div>
      </div>

      <div class="help-search-row">

        <input
          id="helpSearch"
          class="help-search"
          type="search"
          placeholder="Example: change pickup time, assign driver, add broker trip..."
          autocomplete="off"
        >

        <select
          id="helpPageFilter"
          class="help-select"
          aria-label="Page filter"
        >
          <option value="">All accessible pages</option>
        </select>

      </div>

    </section>

    <section id="selectedPageCard" class="selected-page-card" hidden>
      <div id="selectedPageId" class="selected-page-id"></div>
      <h2 id="selectedPageTitle" class="selected-page-title"></h2>
      <p id="selectedPageDescription" class="selected-page-description"></p>
    </section>

    <section class="section-card results-card">
      <div class="results-head">
        <p id="helpResultCount" class="help-count">Loading help...</p>

        <button
          id="clearPageFilter"
          class="clear-btn"
          type="button"
        >
          Show All Pages
        </button>
      </div>

      <div id="helpResults"></div>
    </section>

  </main>

</div>

<script src="/admin/header.js"></script>
<script src="/admin/help-center.js"></script>

</body>
</html>
