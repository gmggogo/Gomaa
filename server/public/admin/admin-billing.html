<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Billing Center</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<link rel="stylesheet" href="/admin/style.css">
<link rel="stylesheet" href="/admin/header.css">

<style>

/* =========================
   GLOBAL
========================= */

*{
  box-sizing:border-box;
}

:root{

  --bg:#eef3f9;
  --card:#ffffff;

  --text:#0f172a;
  --muted:#64748b;

  --border:#dbe4ee;

  --blue:#2563eb;
  --green:#16a34a;
  --red:#dc2626;
  --yellow:#f59e0b;

  --shadow:
    0 10px 30px rgba(15,23,42,.06);

}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Segoe UI,Arial,sans-serif;
  overflow-x:hidden;
}

#adminHeader{
  width:100%;
  z-index:9999;
}

/* =========================
   PAGE
========================= */

.page-body{
  max-width:1950px;
  width:100%;
  margin:auto;
  padding:18px 22px 50px;
}

@media(max-width:768px){

  .page-body{
    padding:10px 8px 30px;
  }

}



/* =========================
   GOLD PAGE TITLE — SAME AS TRIPS HUB
========================= */

.page-head{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:84px;
  margin-bottom:12px;
  padding:16px 20px;
  border:1px solid #e0be5a;
  border-radius:18px;
  background:linear-gradient(
    135deg,
    #fff8dc 0%,
    #f8e6ae 48%,
    #fff4cf 100%
  );
  box-shadow:0 8px 22px rgba(146,102,14,.13);
  text-align:center;
}

.page-title{
  margin:0;
  font-size:28px;
  line-height:1.1;
  font-weight:900;
  color:#111827;
}

.page-sub{
  margin-top:5px;
  font-size:13px;
  font-weight:800;
  color:#64748b;
}

@media(max-width:768px){
  .page-head{
    min-height:72px;
    padding:12px;
    margin-bottom:10px;
  }

  .page-title{
    font-size:22px;
  }

  .page-sub{
    font-size:11px;
  }
}

/* =========================
   STRIPE CONNECT
========================= */

.stripe-panel{
  background:#fff;
  border:1px solid var(--border);
  border-radius:22px;
  box-shadow:var(--shadow);
  padding:20px;
  margin-bottom:20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
}

.stripe-info{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.stripe-title{
  font-size:18px;
  font-weight:900;
  color:#0f172a;
}

.stripe-sub{
  font-size:13px;
  color:#64748b;
}

.stripe-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
}

.stripe-status,
.stripe-btn{
  width:170px;
  height:44px;
  min-height:44px;
  padding:0 14px;
  border-radius:12px;
  font-size:12px;
  font-weight:900;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  white-space:nowrap;
}

.stripe-status{
  border:1px solid transparent;
}

.stripe-status.pending{
  background:#fef3c7;
  color:#92400e;
  border-color:#fde68a;
}

.stripe-status.connected{
  background:#22c55e;
  color:#ffffff;
  border-color:#16a34a;
  box-shadow:
    0 0 0 3px rgba(34,197,94,.16),
    0 6px 16px rgba(22,163,74,.22);
}

.stripe-status.error{
  background:#fee2e2;
  color:#991b1b;
  border-color:#fecaca;
}

.stripe-btn{
  border:none;
  cursor:pointer;
}

.stripe-btn.primary{
  background:#635bff;
  color:#fff;
}

.stripe-btn.dark{
  background:#111827;
  color:#fff;
}

.stripe-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

/* =========================
   FILTERS
========================= */

.filters{

  display:grid;

  grid-template-columns:
    1fr 180px 180px 180px;

  gap:12px;

  margin-bottom:20px;

}

@media(max-width:900px){

  .filters{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:550px){

  .filters{
    grid-template-columns:1fr;
  }

}

.input,
.select{

  width:100%;
  height:50px;

  border-radius:14px;

  border:1px solid #cbd5e1;

  background:#fff;

  padding:0 14px;

  font-size:14px;

  outline:none;

}

.input:focus,
.select:focus{

  border-color:#2563eb;

  box-shadow:
    0 0 0 3px rgba(37,99,235,.12);

}

/* =========================
   CARDS
========================= */

.cards{
  display:grid;
  gap:18px;
}

.company-card{

  background:#fff;

  border-radius:24px;

  border:1px solid var(--border);

  box-shadow:var(--shadow);

  padding:28px;

}

/* =========================
   TOP
========================= */

.company-top{

  display:flex;

  justify-content:space-between;

  align-items:flex-start;

  gap:20px;

  margin-bottom:18px;

  flex-wrap:wrap;

}

.company-top{
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  margin-bottom:18px;
  min-height:96px;
}

.company-info-bar{
  width:min(980px,100%);
  margin:0 auto;
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  overflow:hidden;
  border-radius:18px;
  border:1px solid #1d4ed8;
  background:linear-gradient(135deg,#1d4ed8,#2563eb 55%,#1e40af);
  box-shadow:0 10px 24px rgba(37,99,235,.18);
}

.company-info-item{
  min-width:0;
  padding:16px 20px;
  text-align:center;
  color:#fff;
  border-right:1px solid rgba(255,255,255,.22);
}

.company-info-item:last-child{
  border-right:0;
}

.company-info-label{
  display:block;
  margin-bottom:7px;
  font-size:12px;
  line-height:1.2;
  font-weight:900;
  letter-spacing:.55px;
  text-transform:uppercase;
  color:#dbeafe;
  text-align:center;
}

.company-info-value{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:18px;
  line-height:1.3;
  font-weight:900;
  color:#fff;
  text-align:center;
}

.company-status-wrap{
  position:absolute;
  right:0;
  top:50%;
  transform:translateY(-50%);
}

@media(max-width:1150px){
  .company-top{
    padding-top:48px;
  }

  .company-status-wrap{
    top:0;
    right:0;
    transform:none;
  }
}

@media(max-width:720px){
  .company-info-bar{
    grid-template-columns:1fr;
  }

  .company-info-item{
    border-right:0;
    border-bottom:1px solid rgba(255,255,255,.22);
  }

  .company-info-item:last-child{
    border-bottom:0;
  }
}

.badge{

  padding:10px 16px;

  border-radius:999px;

  font-size:12px;

  font-weight:900;

}

.active{
  background:#dcfce7;
  color:#166534;
}

.locked{
  background:#fee2e2;
  color:#991b1b;
}

/* =========================
   STATS
========================= */

.stats-grid{

  display:grid;

  grid-template-columns:
    repeat(6,1fr);

  gap:12px;

  margin-bottom:18px;

}

@media(max-width:1200px){

  .stats-grid{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(max-width:700px){

  .stats-grid{
    grid-template-columns:repeat(2,1fr);
  }

}

.stat-box{

  background:#f8fafc;

  border:1px solid #e2e8f0;

  border-radius:18px;

  padding:18px;

  min-height:88px;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;

}

.stat-label{

  font-size:13px;

  color:#475569;

  margin-bottom:8px;

  text-transform:uppercase;

  font-weight:900;

  letter-spacing:.35px;

  text-align:center;

}

.stat-value{

  font-size:26px;

  line-height:1.1;

  font-weight:900;

  color:#0f172a;

  text-align:center;

}

/* =========================
   BILLING
========================= */

.billing-grid{

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:16px;

  margin-bottom:22px;

}

@media(max-width:1000px){

  .billing-grid{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:600px){

  .billing-grid{
    grid-template-columns:1fr;
  }

}

.field{

  display:flex;
  flex-direction:column;
  gap:6px;

}

.field label{

  font-size:12px;

  font-weight:700;

  color:#64748b;

}

.small-input{

  height:48px;

  border:1px solid #cbd5e1;

  border-radius:12px;

  padding:0 12px;

  font-size:14px;

  background:#fff;

  outline:none;

}

.small-input:disabled{

  background:#f1f5f9;

  color:#64748b;

}

/* =========================
   BUTTONS
========================= */

.btn-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.btn{

  border:none;

  border-radius:12px;

  padding:11px 16px;

  font-size:12px;

  font-weight:900;

  cursor:pointer;

}

.btn-blue{
  background:#2563eb;
  color:#fff;
}

.btn-dark{
  background:#111827;
  color:#fff;
}

.btn-green{
  background:#dcfce7;
  color:#166534;
}

.btn-red{
  background:#fee2e2;
  color:#991b1b;
}

.btn-yellow{
  background:#fef3c7;
  color:#92400e;
}

.empty{

  background:#fff;

  border-radius:20px;

  padding:50px;

  text-align:center;

  color:#64748b;

  font-weight:700;

}


/* =========================
   PAYMENT HISTORY
========================= */

.payment-history{
  margin-top:22px;
  border:1px solid #dbe4ee;
  border-radius:16px;
  overflow:hidden;
  background:#fff;
}

.payment-history-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:12px 14px;
  background:#10345c;
  color:#fff;
}

.payment-history-title{
  font-size:13px;
  font-weight:900;
}

.payment-history-note{
  font-size:10px;
  font-weight:800;
  color:#dbeafe;
}

.payment-history-tools{
  display:flex;
  gap:8px;
  padding:10px 12px;
  background:#f8fafc;
  border-bottom:1px solid #e2e8f0;
}

.history-select{
  height:34px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  padding:0 10px;
  background:#fff;
  color:#334155;
  font-size:11px;
  font-weight:800;
}

.history-table-wrap{
  overflow-x:auto;
}

.history-table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}

.history-table th,
.history-table td{
  padding:10px 11px;
  border-bottom:1px solid #e5ebf0;
  font-size:11px;
  text-align:center;
  vertical-align:middle;
}

.history-table th{
  background:#edf3f8;
  color:#334155;
  font-weight:900;
  text-transform:uppercase;
}

.history-table td{
  color:#334155;
  font-weight:700;
}

.history-table td.amount{
  color:#166534;
  font-weight:900;
}

.history-empty{
  padding:20px !important;
  color:#64748b !important;
  font-weight:800 !important;
}

.history-action{
  border:0;
  border-radius:8px;
  min-height:30px;
  padding:0 10px;
  background:#111827;
  color:#fff;
  font-size:10px;
  font-weight:900;
  cursor:pointer;
}

.history-action.print{
  background:#2563eb;
}


/* =========================
   COMPANY MASTER / DETAIL
========================= */

.cards{
  display:block;
}

.billing-workspace{
  display:grid;
  grid-template-columns:250px minmax(0,1fr);
  gap:16px;
  align-items:start;
}

.company-sidebar{
  position:sticky;
  top:12px;
  background:#ffffff;
  border:1px solid #dbe4ee;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 8px 24px rgba(15,23,42,.06);
  max-height:calc(100vh - 150px);
  display:flex;
  flex-direction:column;
}

.company-sidebar-head{
  padding:13px 14px;
  background:#10345c;
  color:#fff;
  text-align:center;
}

.company-sidebar-head strong{
  display:block;
  font-size:13px;
  font-weight:900;
}

.company-sidebar-head span{
  display:block;
  margin-top:3px;
  font-size:10px;
  font-weight:800;
  color:#dbeafe;
}

.company-list{
  overflow-y:auto;
  padding:8px;
}

.company-list-item{
  width:100%;
  border:1px solid transparent;
  border-radius:11px;
  background:#f8fafc;
  padding:12px 10px;
  margin-bottom:7px;
  cursor:pointer;
  text-align:left;
  transition:.15s ease;
}

.company-list-item:hover{
  background:#eef4ff;
  border-color:#bfdbfe;
}

.company-list-item.active{
  background:#eef4ff;
  border-color:#93c5fd;
  box-shadow:0 5px 14px rgba(37,99,235,.12);
}

.company-list-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  width:100%;
}

.company-list-name{
  min-width:0;
  flex:1;
  display:block;
  font-size:14px;
  line-height:1.25;
  font-weight:900;
  color:#0f172a;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.company-list-status{
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:64px;
  height:24px;
  border-radius:999px;
  padding:0 9px;
  font-size:9px;
  line-height:1;
  font-weight:950;
  letter-spacing:.25px;
  background:#dcfce7;
  color:#15803d;
  border:1px solid #86efac;
}

.company-list-status.disabled{
  background:#fee2e2;
  color:#b91c1c;
  border-color:#fca5a5;
}

.company-list-item.active .company-list-name{
  color:#1e3a8a;
}

.company-detail{
  min-width:0;
}

.company-detail .company-card{
  margin:0;
}

.company-detail-empty{
  min-height:360px;
  border:1px dashed #cbd5e1;
  border-radius:16px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#64748b;
  font-size:13px;
  font-weight:800;
  padding:30px;
}

.current-invoice-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

@media(max-width:900px){
  .billing-workspace{
    grid-template-columns:1fr;
  }

  .company-sidebar{
    position:relative;
    top:auto;
    max-height:260px;
  }
}

  font-size:10px;
  line-height:1;
  font-weight:950;
  letter-spacing:.15px;
  border:1px solid transparent;
}

.badge.active,
.active.badge{
  background:#dcfce7;
  color:#166534;
  border-color:#86efac;
}

.badge.locked,
.locked.badge{
  background:#fee2e2;
  color:#991b1b;
  border-color:#fca5a5;
}

/* STAT CARDS */
.stats-grid{
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:10px;
  margin-bottom:16px;
}

.stat-box{
  min-height:86px;
  padding:14px 10px;
  border:1px solid #dbe5ef;
  border-radius:14px;
  background:linear-gradient(180deg,#fbfdff 0%,#f4f8fc 100%);
  box-shadow:0 3px 10px rgba(15,23,42,.04);
}

.stat-label{
  margin-bottom:6px;
  font-size:10px;
  line-height:1.25;
  font-weight:900;
  letter-spacing:.45px;
  color:#64748b;
}

.stat-value{
  font-size:23px;
  line-height:1.05;
  font-weight:900;
  color:#10243e;
}

/* BILLING FIELDS */
.billing-grid{
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
  margin-bottom:18px;
}

.field{
  gap:6px;
}

.field label{
  font-size:10px;
  line-height:1.2;
  font-weight:900;
  letter-spacing:.35px;
  text-transform:uppercase;
  color:#64748b;
}

.small-input{
  height:44px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  padding:0 12px;
  font-family:inherit;
  font-size:13px;
  font-weight:700;
  color:#0f172a;
  background:#fff;
  outline:none;
}

.small-input:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.10);
}

.small-input:disabled{
  background:#f3f6fa;
  color:#475569;
  opacity:1;
}

/* BUTTONS */
.btn-row{
  gap:8px;
}

.btn{
  min-height:38px;
  border:none;
  border-radius:9px;
  padding:0 14px;
  font-family:inherit;
  font-size:11px;
  line-height:1;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 3px 8px rgba(15,23,42,.07);
  transition:transform .12s ease,box-shadow .12s ease,filter .12s ease;
}

.btn:hover{
  transform:translateY(-1px);
  box-shadow:0 5px 12px rgba(15,23,42,.10);
  filter:brightness(.99);
}

.btn-blue{
  background:#2563eb;
  color:#fff;
}

.btn-dark{
  background:#111827;
  color:#fff;
}

.btn-green{
  background:#dcfce7;
  color:#166534;
  border:1px solid #86efac;
}

.btn-red{
  background:#fee2e2;
  color:#991b1b;
  border:1px solid #fca5a5;
}

.btn-yellow{
  background:#fef3c7;
  color:#92400e;
  border:1px solid #fde68a;
}

/* PAYMENT HISTORY */
.payment-history{
  margin-top:18px;
  border:1px solid #dbe4ee;
  border-radius:14px;
  background:#fff;
  box-shadow:0 4px 14px rgba(15,23,42,.04);
}

.payment-history-head{
  min-height:44px;
  padding:11px 14px;
  background:linear-gradient(135deg,#0f2f52,#123e6c);
}

.payment-history-title{
  font-size:12px;
  font-weight:900;
  letter-spacing:.15px;
}

.payment-history-note{
  font-size:10px;
  font-weight:700;
  color:#cfe3f8;
}

.payment-history-tools{
  gap:8px;
  padding:9px 12px;
  background:#f8fafc;
}

.history-select{
  height:34px;
  border-radius:8px;
  font-size:10px;
  font-weight:800;
}

.history-table th,
.history-table td{
  padding:9px 10px;
  font-size:10.5px;
}

.history-table th{
  background:#edf3f8;
  color:#334155;
  font-size:10px;
  letter-spacing:.25px;
}

.history-table td{
  color:#334155;
  font-weight:650;
}

.history-action{
  min-height:29px;
  border-radius:7px;
  padding:0 9px;
  font-size:9.5px;
}

/* EMPTY STATES */
.empty,
.company-detail-empty{
  color:#64748b;
  font-size:13px;
  font-weight:800;
}

.empty{
  padding:42px 24px;
  border:1px solid #dbe4ee;
  border-radius:16px;
  box-shadow:0 6px 18px rgba(15,23,42,.05);
}

/* RESPONSIVE */
@media(max-width:1200px){
  .stats-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }

  .billing-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(max-width:900px){
  .filters{
    grid-template-columns:1fr 1fr;
  }

  .billing-workspace{
    grid-template-columns:1fr;
  }

  .company-sidebar{
    position:relative;
    top:auto;
    max-height:260px;
  }
}

@media(max-width:768px){
  .page-body{
    padding:10px 8px 28px;
  }

  .page-head{
    min-height:72px;
    padding:12px;
    margin-bottom:10px;
  }

  .page-title{
    font-size:22px;
  }

  .page-sub{
    font-size:11px;
  }

  .company-card{
    padding:14px;
    border-radius:15px;
  }

  .company-info-value{
    font-size:14px;
  }
}

@media(max-width:600px){
  .filters{
    grid-template-columns:1fr;
  }

  .stats-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .billing-grid{
    grid-template-columns:1fr;
  }

  .stripe-actions{
    width:100%;
  }

  .stripe-status,
  .stripe-btn{
    width:100%;
  }

  .company-info-bar{
    grid-template-columns:1fr;
  }
}

</style>
</head>

<div id="adminHeader"></div>

<div class="page-body">

  <div class="page-head">
    <div>
      <h1 class="page-title">Admin Billing</h1>
      <div class="page-sub">Company billing, Stripe connection and monthly payment management</div>
    </div>
  </div>

  <!-- STRIPE CONNECT -->

  <div class="stripe-panel">

    <div class="stripe-info">

      <div class="stripe-title">
        Stripe Payment Account
      </div>

      <div
        class="stripe-sub"
        id="stripeAccountText"
      >
        Checking Stripe connection...
      </div>

    </div>

    <div class="stripe-actions">

      <span
        id="stripeStatus"
        class="stripe-status pending"
      >
        CHECKING
      </span>

      <button
        id="connectStripeBtn"
        class="stripe-btn primary"
        type="button"
      >
        Connect Stripe
      </button>

      <button
        id="stripeDashboardBtn"
        class="stripe-btn dark"
        type="button"
        style="display:none;"
      >
        Open Stripe Dashboard
      </button>

    </div>

  </div>

  <!-- FILTERS -->

  <div class="filters">

    <input
      id="searchInput"
      class="input"
      placeholder="Search company..."
    >

    <select
      id="statusFilter"
      class="select"
    >
      <option value="">All Status</option>
      <option value="ACTIVE">ACTIVE</option>
      <option value="SUSPENDED">SUSPENDED</option>
    </select>

    <select
      id="monthFilter"
      class="select"
    >
      <option value="">All Months</option>
    </select>

    <input
      id="yearFilter"
      class="input"
      type="number"
      placeholder="Year"
    >

  </div>

  <!-- CARDS -->

  <div
    class="cards"
    id="billingContainer"
  >

    <div class="empty">
      Loading billing...
    </div>

  </div>

</div>

<script src="/admin/header.js"></script>
