<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shared Engine Settings</title>

  <link rel="stylesheet" href="/admin/style.css" />
  <link rel="stylesheet" href="/admin/header.css" />

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:#f4f6f8;
      color:#1f2937;
    }

    .page{
      width:min(1200px,calc(100% - 32px));
      margin:18px auto 32px;
    }

    .settings-card{
      background:#ffffff;
      border:1px solid #dfe3e8;
      border-radius:14px;
      padding:22px;
      box-shadow:0 4px 14px rgba(0,0,0,.05);
    }

    .settings-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      margin-bottom:20px;
    }

    .settings-head h1{
      margin:0 0 6px;
      font-size:24px;
      line-height:1.2;
    }

    .settings-head p{
      margin:0;
      color:#6b7280;
      font-size:14px;
      line-height:1.5;
    }

    .settings-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:14px;
    }

    .settings-field{
      min-width:0;
    }

    .settings-field label{
      display:block;
      margin-bottom:6px;
      font-size:13px;
      font-weight:700;
      color:#374151;
    }

    .settings-field input,
    .settings-field select{
      width:100%;
      height:42px;
      border:1px solid #cfd6dd;
      border-radius:8px;
      padding:0 11px;
      background:#ffffff;
      color:#111827;
      font-size:14px;
      outline:none;
    }

    .settings-field input:focus,
    .settings-field select:focus{
      border-color:#718096;
      box-shadow:0 0 0 2px rgba(113,128,150,.12);
    }

    .input-with-unit{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .input-with-unit input{
      flex:1;
      min-width:0;
    }

    .input-with-unit span{
      min-width:58px;
      font-size:12px;
      color:#6b7280;
      text-align:left;
      white-space:nowrap;
    }

    .subsection{
      margin-top:22px;
      padding-top:18px;
      border-top:1px solid #e5e7eb;
    }

    .subsection-title{
      margin:0 0 14px;
      font-size:16px;
      font-weight:800;
    }

    .source-card{
      border:1px solid #e3e7eb;
      border-radius:10px;
      padding:14px;
      background:#fafbfc;
    }

    .source-card label{
      margin-bottom:8px;
    }

    .settings-actions{
      display:flex;
      align-items:center;
      gap:12px;
      margin-top:22px;
    }

    .btn{
      border:0;
      border-radius:8px;
      min-height:42px;
      padding:0 18px;
      font-size:14px;
      font-weight:700;
      cursor:pointer;
    }

    .btn-primary{
      background:#1f4f7a;
      color:#ffffff;
    }

    .btn-primary:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    .settings-status{
      font-size:13px;
      font-weight:700;
    }

    .settings-status[data-status="error"]{
      color:#b42318;
    }

    .settings-status[data-status="ok"]{
      color:#166534;
    }

    @media(max-width:1000px){
      .settings-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }
    }

    @media(max-width:640px){
      .page{
        width:min(100% - 20px,1200px);
        margin:10px auto;
      }

      .settings-card{
        padding:16px;
      }

      .settings-grid{
        grid-template-columns:1fr;
      }

      .settings-actions{
        flex-direction:column;
        align-items:stretch;
      }

      .btn{
        width:100%;
      }
    }
  </style>
</head>

<body>

  <div id="adminHeader"></div>

  <main class="page">

    <section
      id="sharedEngineSettingsSection"
      class="settings-card"
    >

      <div class="settings-head">
        <div>
          <h1>Shared Engine</h1>
          <p>
            Configure shared ride grouping, route limits,
            timing rules, and trip source availability.
          </p>
        </div>
      </div>

      <div class="settings-grid">

        <div class="settings-field">
          <label for="sharedEngineEnabled">
            Shared Engine
          </label>

          <select id="sharedEngineEnabled">
            <option value="true">Enabled</option>
            <option value="false">Disabled</option>
          </select>
        </div>

        <div class="settings-field">
          <label for="sharedEngineMaxGroupDistanceMiles">
            Max Group Distance
          </label>

          <div class="input-with-unit">
            <input
              id="sharedEngineMaxGroupDistanceMiles"
              type="number"
              min="0"
              step="0.1"
              value="10"
            />
            <span>Miles</span>
          </div>
        </div>

        <div class="settings-field">
          <label for="sharedEngineMaxExtraMiles">
            Max Extra Ride Distance
          </label>

          <div class="input-with-unit">
            <input
              id="sharedEngineMaxExtraMiles"
              type="number"
              min="0"
              step="0.1"
              value="10"
            />
            <span>Miles</span>
          </div>
        </div>

        <div class="settings-field">
          <label for="sharedEngineMaxExtraMinutes">
            Max Extra Ride Time
          </label>

          <div class="input-with-unit">
            <input
              id="sharedEngineMaxExtraMinutes"
              type="number"
              min="0"
              step="1"
              value="30"
            />
            <span>Minutes</span>
          </div>
        </div>

        <div class="settings-field">
          <label for="sharedEngineAppointmentBufferMinutes">
            Appointment Buffer
          </label>

          <div class="input-with-unit">
            <input
              id="sharedEngineAppointmentBufferMinutes"
              type="number"
              min="0"
              step="1"
              value="10"
            />
            <span>Minutes</span>
          </div>
        </div>

        <div class="settings-field">
          <label for="sharedEnginePickupLateToleranceMinutes">
            Pickup Late Tolerance
          </label>

          <div class="input-with-unit">
            <input
              id="sharedEnginePickupLateToleranceMinutes"
              type="number"
              min="0"
              step="1"
              value="5"
            />
            <span>Minutes</span>
          </div>
        </div>

        <div class="settings-field">
          <label for="sharedEnginePickupEarlyWindowMinutes">
            Pickup Early Window
          </label>

          <div class="input-with-unit">
            <input
              id="sharedEnginePickupEarlyWindowMinutes"
              type="number"
              min="0"
              step="1"
              value="20"
            />
            <span>Minutes</span>
          </div>
        </div>

        <div class="settings-field">
          <label for="sharedEngineMaxRidersPerGroup">
            Max Riders Per Group
          </label>

          <input
            id="sharedEngineMaxRidersPerGroup"
            type="number"
            min="2"
            max="20"
            step="1"
            value="4"
          />
        </div>

      </div>

      <div class="subsection">
        <h2 class="subsection-title">
          Grouping Priority
        </h2>

        <div class="settings-grid">

          <div class="settings-field">
            <label for="sharedEngineSamePickupPriority">
              Same Pickup Priority
            </label>

            <select id="sharedEngineSamePickupPriority">
              <option value="true">Enabled</option>
              <option value="false">Disabled</option>
            </select>
          </div>

          <div class="settings-field">
            <label for="sharedEngineSameDropoffPriority">
              Same Drop-off Priority
            </label>

            <select id="sharedEngineSameDropoffPriority">
              <option value="true">Enabled</option>
              <option value="false">Disabled</option>
            </select>
          </div>

        </div>
      </div>

      <div class="subsection">
        <h2 class="subsection-title">
          Trip Sources
        </h2>

        <div class="settings-grid">

          <div class="settings-field source-card">
            <label for="sharedEngineCompanyEnabled">
              Company Trips
            </label>

            <select id="sharedEngineCompanyEnabled">
              <option value="true">Enabled</option>
              <option value="false">Disabled</option>
            </select>
          </div>

          <div class="settings-field source-card">
            <label for="sharedEngineReservedEnabled">
              Reserved Trips
            </label>

            <select id="sharedEngineReservedEnabled">
              <option value="true">Enabled</option>
              <option value="false">Disabled</option>
            </select>
          </div>

          <div
            id="sharedEngineBrokerSection"
            class="settings-field source-card"
          >
            <label for="sharedEngineBrokerEnabled">
              Broker Trips
            </label>

            <select id="sharedEngineBrokerEnabled">
              <option value="true">Enabled</option>
              <option value="false">Disabled</option>
            </select>
          </div>

        </div>
      </div>

      <div class="settings-actions">
        <button
          id="sharedEngineSaveBtn"
          type="button"
          class="btn btn-primary"
        >
          Save Shared Engine
        </button>

        <span
          id="sharedEngineStatus"
          class="settings-status"
        ></span>
      </div>

    </section>

  </main>

  <script src="/admin/header.js"></script>
  <script src="/admin/js/sharedEngineSettings.js"></script>

</body>
</html>
