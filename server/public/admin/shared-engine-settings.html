<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shared Engine</title>

  <link rel="stylesheet" href="/admin/style.css" />
  <link rel="stylesheet" href="/admin/header.css" />

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:#eef8f5;
      color:#1f2937;
    }

    .page-shell{
      width:min(1440px,calc(100% - 28px));
      margin:0 auto 34px;
    }

    .page-banner{
      background:linear-gradient(180deg,#efe7b9 0%,#e5db9b 100%);
      border-top:1px solid rgba(0,0,0,.05);
      border-bottom:1px solid rgba(0,0,0,.08);
      text-align:center;
      padding:16px 18px 18px;
      margin-bottom:18px;
      border-radius:0 0 10px 10px;
      box-shadow:0 2px 8px rgba(0,0,0,.04);
    }

    .page-banner h1{
      margin:0;
      color:#806200;
      font-size:18px;
      font-weight:800;
      letter-spacing:.01em;
    }

    .page-banner p{
      margin:5px 0 0;
      color:#746b42;
      font-size:12px;
      line-height:1.45;
      font-weight:600;
    }

    .settings-card{
      width:min(1120px,100%);
      margin:0 auto;
      background:#ffffff;
      border:1px solid #dce6e2;
      border-radius:16px;
      padding:24px;
      box-shadow:0 10px 26px rgba(0,0,0,.06);
    }

    .settings-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:18px;
      margin-bottom:22px;
      padding-bottom:18px;
      border-bottom:1px solid #edf2f0;
    }

    .settings-head h2{
      margin:0 0 6px;
      font-size:26px;
      line-height:1.2;
      color:#243342;
    }

    .settings-head p{
      margin:0;
      color:#6b7280;
      font-size:14px;
      line-height:1.5;
    }

    .settings-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:16px;
    }

    .settings-field{
      min-width:0;
    }

    .settings-field label{
      display:block;
      margin-bottom:7px;
      font-size:13px;
      font-weight:800;
      color:#334155;
    }

    .settings-field input,
    .settings-field select{
      width:100%;
      height:44px;
      border:1px solid #cfe0d9;
      border-radius:10px;
      padding:0 12px;
      background:#f9fcfb;
      color:#0f172a;
      font-size:14px;
      outline:none;
      transition:border-color .18s ease, box-shadow .18s ease, background-color .18s ease;
    }

    .settings-field input:hover,
    .settings-field select:hover{
      border-color:#bcd2ca;
      background:#ffffff;
    }

    .settings-field input:focus,
    .settings-field select:focus{
      border-color:#6ea28e;
      box-shadow:0 0 0 3px rgba(110,162,142,.15);
      background:#ffffff;
    }

    .settings-field input::placeholder{
      color:#94a3b8;
    }

    .input-with-unit{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .input-with-unit input{
      flex:1;
      min-width:0;
    }

    .input-with-unit span{
      min-width:60px;
      font-size:12px;
      font-weight:700;
      color:#64748b;
      white-space:nowrap;
    }

    .subsection{
      margin-top:24px;
      padding-top:18px;
      border-top:1px solid #edf2f0;
    }

    .subsection-title{
      margin:0 0 14px;
      font-size:18px;
      font-weight:800;
      color:#223344;
    }

    .source-card{
      border:1px solid #e3ece8;
      border-radius:12px;
      padding:14px;
      background:linear-gradient(180deg,#fbfdfc 0%,#f4faf7 100%);
    }

    .settings-actions{
      display:flex;
      align-items:center;
      gap:12px;
      margin-top:24px;
      padding-top:18px;
      border-top:1px solid #edf2f0;
    }

    .btn{
      border:0;
      border-radius:10px;
      min-height:44px;
      padding:0 18px;
      font-size:14px;
      font-weight:800;
      cursor:pointer;
      transition:transform .12s ease, opacity .12s ease, box-shadow .12s ease;
    }

    .btn:hover{
      transform:translateY(-1px);
    }

    .btn-primary{
      background:linear-gradient(180deg,#4b74c8 0%,#365eb6 100%);
      color:#ffffff;
      box-shadow:0 8px 18px rgba(54,94,182,.22);
    }

    .btn-primary:disabled{
      opacity:.55;
      cursor:not-allowed;
      transform:none;
      box-shadow:none;
    }

    .settings-status{
      font-size:13px;
      font-weight:800;
    }

    .settings-status[data-status="error"]{
      color:#b42318;
    }

    .settings-status[data-status="ok"]{
      color:#166534;
    }

    /* Enabled / Disabled select colors */
    .settings-field select.state-enabled{
      background:#ecfdf3;
      border-color:#7bc69a;
      color:#166534;
      font-weight:800;
    }

    .settings-field select.state-disabled{
      background:#fff1f1;
      border-color:#f0a0a0;
      color:#b42318;
      font-weight:800;
    }

    @media(max-width:1100px){
      .settings-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }
    }

    @media(max-width:700px){
      .page-shell{
        width:calc(100% - 16px);
      }

      .page-banner{
        padding:14px 14px 16px;
        margin-bottom:12px;
      }

      .settings-card{
        padding:16px;
        border-radius:12px;
      }

      .settings-head h2{
        font-size:22px;
      }

      .settings-grid{
        grid-template-columns:1fr;
      }

      .settings-actions{
        flex-direction:column;
        align-items:stretch;
      }

      .btn{
        width:100%;
      }
    }
  </style>
</head>

<body>

  <div id="adminHeader"></div>

  <div class="page-banner">
    <h1>Shared Engine</h1>
    <p>
      Configure shared ride grouping, route limits, timing rules,
      and trip source availability.
    </p>
  </div>

  <main class="page-shell">
    <section
      id="sharedEngineSettingsSection"
      class="settings-card"
    >
      <div class="settings-head">
        <div>
          <h2>Shared Engine</h2>
          <p>
            Configure shared ride grouping, route limits, timing rules,
            and trip source availability.
          </p>
        </div>
      </div>

      <div class="settings-grid">

        <div class="settings-field">
          <label for="sharedEngineEnabled">
            Shared Engine
          </label>

          <select id="sharedEngineEnabled">
            <option value="true">Enabled</option>
            <option value="false">Disabled</option>
          </select>
        </div>

        <div class="settings-field">
          <label for="sharedEngineMaxGroupDistanceMiles">
            Max Group Distance
          </label>

          <div class="input-with-unit">
            <input
              id="sharedEngineMaxGroupDistanceMiles"
              type="number"
              min="0"
              step="0.1"
              value="10"
            />
            <span>Miles</span>
          </div>
        </div>

        <div class="settings-field">
          <label for="sharedEngineMaxExtraMiles">
            Max Extra Ride Distance
          </label>

          <div class="input-with-unit">
            <input
              id="sharedEngineMaxExtraMiles"
              type="number"
              min="0"
              step="0.1"
              value="10"
            />
            <span>Miles</span>
          </div>
        </div>

        <div class="settings-field">
          <label for="sharedEngineMaxExtraMinutes">
            Max Extra Ride Time
          </label>

          <div class="input-with-unit">
            <input
              id="sharedEngineMaxExtraMinutes"
              type="number"
              min="0"
              step="1"
              value="30"
            />
            <span>Minutes</span>
          </div>
        </div>

        <div class="settings-field">
          <label for="sharedEngineAppointmentBufferMinutes">
            Appointment Buffer
          </label>

          <div class="input-with-unit">
            <input
              id="sharedEngineAppointmentBufferMinutes"
              type="number"
              min="0"
              step="1"
              value="10"
            />
            <span>Minutes</span>
          </div>
        </div>

        <div class="settings-field">
          <label for="sharedEnginePickupLateToleranceMinutes">
            Pickup Late Tolerance
          </label>

          <div class="input-with-unit">
            <input
              id="sharedEnginePickupLateToleranceMinutes"
              type="number"
              min="0"
              step="1"
              value="5"
            />
            <span>Minutes</span>
          </div>
        </div>

        <div class="settings-field">
          <label for="sharedEnginePickupEarlyWindowMinutes">
            Pickup Early Window
          </label>

          <div class="input-with-unit">
            <input
              id="sharedEnginePickupEarlyWindowMinutes"
              type="number"
              min="0"
              step="1"
              value="20"
            />
            <span>Minutes</span>
          </div>
        </div>

        <div class="settings-field">
          <label for="sharedEngineMaxRidersPerGroup">
            Max Riders Per Group
          </label>

          <input
            id="sharedEngineMaxRidersPerGroup"
            type="number"
            min="2"
            max="20"
            step="1"
            value="4"
          />
        </div>

      </div>

      <div class="subsection">
        <h3 class="subsection-title">
          Grouping Priority
        </h3>

        <div class="settings-grid">

          <div class="settings-field">
            <label for="sharedEngineSamePickupPriority">
              Same Pickup Priority
            </label>

            <select id="sharedEngineSamePickupPriority">
              <option value="true">Enabled</option>
              <option value="false">Disabled</option>
            </select>
          </div>

          <div class="settings-field">
            <label for="sharedEngineSameDropoffPriority">
              Same Drop-off Priority
            </label>

            <select id="sharedEngineSameDropoffPriority">
              <option value="true">Enabled</option>
              <option value="false">Disabled</option>
            </select>
          </div>

        </div>
      </div>

      <div class="subsection">
        <h3 class="subsection-title">
          Trip Sources
        </h3>

        <div class="settings-grid">

          <div class="settings-field source-card">
            <label for="sharedEngineCompanyEnabled">
              Company Trips
            </label>

            <select id="sharedEngineCompanyEnabled">
              <option value="true">Enabled</option>
              <option value="false">Disabled</option>
            </select>
          </div>

          <div class="settings-field source-card">
            <label for="sharedEngineReservedEnabled">
              Reserved Trips
            </label>

            <select id="sharedEngineReservedEnabled">
              <option value="true">Enabled</option>
              <option value="false">Disabled</option>
            </select>
          </div>

          <div
            id="sharedEngineBrokerSection"
            class="settings-field source-card"
          >
            <label for="sharedEngineBrokerEnabled">
              Broker Trips
            </label>

            <select id="sharedEngineBrokerEnabled">
              <option value="true">Enabled</option>
              <option value="false">Disabled</option>
            </select>
          </div>

        </div>
      </div>

      <div class="settings-actions">
        <button
          id="sharedEngineSaveBtn"
          type="button"
          class="btn btn-primary"
        >
          Save Shared Engine
        </button>

        <span
          id="sharedEngineStatus"
          class="settings-status"
        ></span>
      </div>
    </section>
  </main>

  <script src="/admin/header.js"></script>
  <script src="/admin/js/sharedEngineSettings.js"></script>
</body>
</html>
