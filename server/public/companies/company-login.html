<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GH Mobility Facilities</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/companies/facility-login.css">
</head>

<body>

<div class="facility-shell">

  <div class="brand-area">

    <img
      class="facility-logo"
      src="/companies/desktop-app/assets/gh-mobility-facilities.png"
      alt="GH Mobility Facilities">

    <div class="tenant-line">
      <span class="tenant-label">Transportation Company</span>
      <strong id="transportCompanyName">Select Company</strong>
    </div>

    <div class="datetime" id="datetime"></div>

  </div>

  <div class="login-card">

    <div class="card-kicker">FACILITY ACCESS</div>

    <h1>Facility Login</h1>

    <p class="login-subtitle">
      Sign in to the facility account connected to this transportation company.
    </p>

    <form id="loginForm">

      <input
        type="text"
        id="username"
        placeholder="Username"
        autocomplete="username"
        required>

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
        required>

      <button type="submit">
        Login
      </button>

    </form>

    <div id="errorMessage" class="error"></div>

    <div id="tenantHint" class="tenant-hint"></div>

  </div>

</div>

<script src="/core/branding.js"></script>
<script src="/companies/facility-login.js"></script>

</body>
</html>
