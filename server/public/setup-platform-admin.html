<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Platform Admin</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #07172c;
      font-family: Arial, Helvetica, sans-serif;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: #ffffff;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.28);
    }
    h1 {
      margin: 0 0 8px;
      color: #07172c;
      font-size: 28px;
      text-align: center;
    }
    .sub {
      margin: 0 0 24px;
      text-align: center;
      color: #666;
      font-size: 14px;
    }
    label {
      display: block;
      margin: 14px 0 7px;
      color: #07172c;
      font-weight: 700;
      font-size: 14px;
    }
    input {
      width: 100%;
      height: 46px;
      border: 1px solid #ccd3dc;
      border-radius: 10px;
      padding: 0 12px;
      font-size: 15px;
      outline: none;
    }
    input:focus {
      border-color: #c8a34a;
      box-shadow: 0 0 0 3px rgba(200,163,74,.15);
    }
    button {
      width: 100%;
      height: 48px;
      margin-top: 22px;
      border: 0;
      border-radius: 10px;
      background: #c8a34a;
      color: #07172c;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }
    button:disabled {
      opacity: .65;
      cursor: wait;
    }
    #message {
      margin-top: 16px;
      min-height: 24px;
      padding: 10px 12px;
      border-radius: 10px;
      display: none;
      font-size: 14px;
      line-height: 1.4;
    }
    .ok {
      display: block !important;
      background: #e8f7ed;
      color: #176b35;
    }
    .bad {
      display: block !important;
      background: #fdecec;
      color: #9f1f1f;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Platform Admin</h1>
    <p class="sub">Create the first platform administrator</p>

    <form id="form">
      <label for="name">Name</label>
      <input id="name" autocomplete="name" required />

      <label for="username">Username</label>
      <input id="username" autocomplete="username" required />

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" required />

      <label for="setupKey">Setup Key</label>
      <input id="setupKey" type="password" autocomplete="off" required />

      <button id="submitBtn" type="submit">Create Platform Admin</button>

      <div id="message"></div>
    </form>
  </div>

<script>
const form = document.getElementById("form");
const message = document.getElementById("message");
const submitBtn = document.getElementById("submitBtn");

function showMessage(text, ok) {
  message.className = ok ? "ok" : "bad";
  message.textContent = text;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  submitBtn.disabled = true;
  submitBtn.textContent = "Creating...";
  message.style.display = "none";

  try {
    const response = await fetch("/api/setup/platform-admin", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-setup-key": document.getElementById("setupKey").value.trim()
      },
      body: JSON.stringify({
        name: document.getElementById("name").value.trim(),
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value
      })
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(data.message || "Unable to create Platform Admin");
    }

    showMessage(
      "Platform Admin created successfully. You can now log in with this username and password.",
      true
    );

    form.reset();

  } catch (err) {
    showMessage(err.message || "Request failed", false);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Create Platform Admin";
  }
});
</script>

</body>
</html>
