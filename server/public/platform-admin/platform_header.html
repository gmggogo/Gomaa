<header class="platform-header">

<style>
/* =========================================
   PLATFORM NAV - UNIFIED PREMIUM BUTTONS
   HTML-LEVEL OVERRIDE
========================================= */

.platform-nav-wrapper{
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  gap:14px !important;
  padding:12px 18px !important;
}

.platform-nav{
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  flex-wrap:wrap !important;
  gap:10px !important;
}

.platform-nav .platform-nav-btn{
  display:inline-flex !important;
  align-items:center !important;
  justify-content:center !important;

  min-width:128px !important;
  min-height:42px !important;

  padding:10px 16px !important;

  border:1px solid #315f80 !important;
  border-radius:9px !important;

  background:
    linear-gradient(
      180deg,
      #f7fbfe 0%,
      #dceaf4 52%,
      #cbdde9 100%
    ) !important;

  color:#173a55 !important;

  font-size:12px !important;
  font-weight:900 !important;
  line-height:1 !important;
  text-align:center !important;
  text-decoration:none !important;
  white-space:nowrap !important;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.95),
    0 3px 8px rgba(18,52,78,.18) !important;

  transition:
    transform .15s ease,
    box-shadow .15s ease,
    background .15s ease,
    color .15s ease !important;
}

.platform-nav .platform-nav-btn:hover{
  background:
    linear-gradient(
      180deg,
      #ffffff 0%,
      #e9f3f9 48%,
      #d5e7f2 100%
    ) !important;

  color:#0b2e49 !important;

  transform:translateY(-1px) !important;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,1),
    0 5px 12px rgba(18,52,78,.24) !important;
}

.platform-nav .platform-nav-btn.active{
  border-color:#d2aa43 !important;

  background:
    linear-gradient(
      180deg,
      #f4db8e 0%,
      #d4aa47 52%,
      #b88727 100%
    ) !important;

  color:#3a2808 !important;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.65),
    0 4px 10px rgba(111,78,15,.28) !important;
}

.platform-nav .platform-nav-btn:focus-visible{
  outline:3px solid rgba(64,135,185,.28) !important;
  outline-offset:2px !important;
}

.platform-powered{
  flex:0 0 auto !important;
  white-space:nowrap !important;
}

/* Mobile menu keeps the same unified identity */
.platform-mobile-side-nav a{
  display:flex !important;
  align-items:center !important;
  min-height:44px !important;
  padding:10px 14px !important;
  margin:5px 0 !important;

  border:1px solid #315f80 !important;
  border-radius:9px !important;

  background:
    linear-gradient(
      180deg,
      #f7fbfe,
      #dceaf4
    ) !important;

  color:#173a55 !important;

  font-size:12px !important;
  font-weight:900 !important;
  text-decoration:none !important;
}

.platform-mobile-side-nav a.active{
  border-color:#d2aa43 !important;

  background:
    linear-gradient(
      180deg,
      #f4db8e,
      #c99b39
    ) !important;

  color:#3a2808 !important;
}

@media(max-width:1180px){
  .platform-nav .platform-nav-btn{
    min-width:116px !important;
    padding-left:12px !important;
    padding-right:12px !important;
    font-size:11px !important;
  }
}
</style>

</div>

</div>

  class="platform-mobile-overlay"

</div>

<aside
  class="platform-mobile-side-menu"
  id="platformMobileSideMenu">

  <div class="platform-mobile-side-head">

    <img
      src="/platform-admin/platform%20logo/logo-platform.jpeg"

    <div class="platform-mobile-side-title">

      <div>
        GH Mobility
      </div>

    </div>

    <button

  <nav

  </nav>

  <button
