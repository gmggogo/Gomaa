<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Platform Admin - Super Admins</title>

<!-- SHARED PLATFORM HEADER STYLE -->
<link
  rel="stylesheet"
  href="/platform-admin/platform_header.css"
>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f5f8;
  color:#18202b;
}

/* =========================
   PAGE
========================= */

.page{
  width:min(
    1200px,
    calc(100% - 32px)
  );
  margin:28px auto;
}

.title-row{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:20px;
}

h1{
  margin:0;
  font-size:28px;
  color:#351c75;
}

.subtitle{
  margin:6px 0 0;
  color:#6a7280;
}

.card{
  background:#fff;
  border-radius:16px;
  box-shadow:
    0 8px 28px
    rgba(26,36,54,.08);
  padding:22px;
  margin-bottom:22px;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:16px;
}

.full{
  grid-column:1/-1;
}

label{
  display:block;
  font-size:13px;
  font-weight:800;
  color:#454d5a;
  margin-bottom:7px;
}

input,
select{
  width:100%;
  height:46px;
  border:1px solid #d7dce4;
  border-radius:10px;
  padding:0 12px;
  font-size:15px;
  background:#fff;
}

input:focus,
select:focus{
  outline:none;
  border-color:#6c4ccf;
  box-shadow:
    0 0 0 3px
    rgba(108,76,207,.12);
}

.primary{
  border:0;
  min-height:46px;
  border-radius:10px;
  padding:0 18px;
  background:#351c75;
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

.primary:disabled{
  opacity:.6;
  cursor:wait;
}

.message{
  margin-top:14px;
  display:none;
  padding:11px 13px;
  border-radius:9px;
  font-size:14px;
}

.ok{
  display:block;
  background:#e7f7ed;
  color:#176b35;
}

.bad{
  display:block;
  background:#fdeaea;
  color:#a31e1e;
}

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:760px;
}

th,
td{
  text-align:left;
  padding:13px 12px;
  border-bottom:
    1px solid #edf0f4;
}

th{
  color:#5c6471;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.04em;
}

.status{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:78px;
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
}

.active{
  background:#e7f7ed;
  color:#176b35;
}

.disabled{
  background:#fdeaea;
  color:#a31e1e;
}

.small-btn{
  border:1px solid #d8dce5;
  background:#fff;
  border-radius:8px;
  padding:7px 11px;
  font-weight:800;
  cursor:pointer;
}

.empty{
  text-align:center;
  color:#7a8290;
  padding:28px 10px;
}

@media(max-width:720px){

  .grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .title-row{
    align-items:flex-start;
    flex-direction:column;
  }
}

</style>

</head>

<body>

<!-- =========================
     SHARED PLATFORM HEADER
========================= -->

<div id="platformHeader"></div>

<!-- =========================
     PAGE CONTENT
========================= -->

<main class="page">

  <div class="title-row">

    <div>

      <h1>
        Super Admin Accounts
      </h1>

      <p class="subtitle">
        Create Super Admins inside a specific company and verify tenant separation.
      </p>

    </div>

  </div>

  <!-- =========================
       CREATE SUPER ADMIN
  ========================= -->

  <section class="card">

    <div class="grid">

      <div class="full">

        <label>
          Tenant / Company
        </label>

        <select id="tenantSelect">

          <option value="">
            Loading companies...
          </option>

        </select>

      </div>

      <div>

        <label>
          Name
        </label>

        <input
          id="name"
          type="text"
          autocomplete="off"
        >

      </div>

      <div>

        <label>
          Username
        </label>

        <input
          id="username"
          type="text"
          autocomplete="off"
        >

      </div>

      <div>

        <label>
          Email
        </label>

        <input
          id="email"
          type="email"
          autocomplete="off"
        >

      </div>

      <div>

        <label>
          Phone
        </label>

        <input
          id="phone"
          type="text"
          autocomplete="off"
        >

      </div>

      <div class="full">

        <label>
          Password
        </label>

        <input
          id="password"
          type="password"
          minlength="8"
          autocomplete="new-password"
        >

      </div>

      <div class="full">

        <button
          id="createBtn"
          class="primary"
          onclick="createSuperAdmin()"
        >
          Create Super Admin
        </button>

        <div
          id="message"
          class="message"
        ></div>

      </div>

    </div>

  </section>

  <!-- =========================
       SUPER ADMIN LIST
  ========================= -->

  <section class="card">

    <div class="title-row">

      <div>

        <h1 style="font-size:21px">
          Super Admins in Selected Company
        </h1>

        <p
          class="subtitle"
          id="selectedTenantName"
        >
          Select a company.
        </p>

      </div>

    </div>

    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>Name</th>
            <th>Username</th>
            <th>Tenant ID</th>
            <th>Status</th>
            <th>Action</th>
          </tr>

        </thead>

        <tbody id="adminsBody">

          <tr>

            <td
              colspan="5"
              class="empty"
            >
              Select a company to load its Super Admins.
            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </section>

</main>

<!-- SHARED PLATFORM HEADER SCRIPT -->
<script src="/platform-admin/platform_header.js"></script>

<script>

/* =========================================
   SECURITY
========================================= */

const token =
  localStorage.getItem(
    "token"
  ) || "";

const role =
  localStorage.getItem(
    "role"
  ) || "";

if(
  !token ||
  role !== "PLATFORM_ADMIN"
){

  window.location.replace(
    "/login.html"
  );

}

/* =========================================
   API HELPER
========================================= */

async function api(
  url,
  options = {}
){

  const headers = {
    ...(options.headers || {}),

    "Authorization":
      "Bearer " + token
  };

  if(
    options.body &&
    !headers["Content-Type"]
  ){

    headers["Content-Type"] =
      "application/json";

  }

  const res =
    await fetch(
      url,
      {
        ...options,
        headers
      }
    );

  const data =
    await res
      .json()
      .catch(()=>({}));

  if(!res.ok){

    if(
      res.status === 401 ||
      res.status === 403
    ){

      throw new Error(
        data.message ||
        "Access denied"
      );

    }

    throw new Error(
      data.message ||
      "Request failed"
    );

  }

  return data;
}

/* =========================================
   MESSAGE
========================================= */

function showMessage(
  text,
  ok
){

  const el =
    document.getElementById(
      "message"
    );

  el.className =
    "message " +
    (ok ? "ok" : "bad");

  el.textContent =
    text;
}

/* =========================================
   LOAD TENANTS
========================================= */

async function loadTenants(){

  const select =
    document.getElementById(
      "tenantSelect"
    );

  try{

    const tenants =
      await api(
        "/api/platform-admin/tenants"
      );

    select.innerHTML =
      `<option value="">
        Select company
       </option>`;

    tenants.forEach(t=>{

      const option =
        document.createElement(
          "option"
        );

      option.value =
        t._id || t.id;

      option.textContent =
        `${t.name} (${t.slug})`;

      select.appendChild(
        option
      );

    });

    select.addEventListener(
      "change",
      loadAdmins
    );

  }catch(err){

    select.innerHTML =
      `<option value="">
        Unable to load companies
       </option>`;

    showMessage(
      err.message,
      false
    );

  }
}

/* =========================================
   LOAD SUPER ADMINS
========================================= */

async function loadAdmins(){

  const tenantId =
    document.getElementById(
      "tenantSelect"
    ).value;

  const body =
    document.getElementById(
      "adminsBody"
    );

  const label =
    document.getElementById(
      "selectedTenantName"
    );

  if(!tenantId){

    label.textContent =
      "Select a company.";

    body.innerHTML =
      `<tr>
        <td colspan="5" class="empty">
          Select a company to load its Super Admins.
        </td>
      </tr>`;

    return;
  }

  body.innerHTML =
    `<tr>
      <td colspan="5" class="empty">
        Loading...
      </td>
    </tr>`;

  try{

    const data =
      await api(
        `/api/platform-admin/tenants/${tenantId}/super-admins`
      );

    label.textContent =
      data.tenant?.name ||
      "Selected company";

    const admins =
      Array.isArray(
        data.admins
      )
        ? data.admins
        : [];

    if(!admins.length){

      body.innerHTML =
        `<tr>
          <td colspan="5" class="empty">
            No Super Admins yet.
          </td>
        </tr>`;

      return;
    }

    body.innerHTML =
      admins.map(a=>{

        const enabled =
          a.enabled !== false &&
          a.active !== false;

        return `
          <tr>

            <td>
              ${escapeHtml(
                a.name || ""
              )}
            </td>

            <td>
              ${escapeHtml(
                a.username || ""
              )}
            </td>

            <td>
              ${escapeHtml(
                String(
                  a.tenantId || ""
                )
              )}
            </td>

            <td>

              <span
                class="status ${
                  enabled
                    ? "active"
                    : "disabled"
                }"
              >

                ${
                  enabled
                    ? "ACTIVE"
                    : "DISABLED"
                }

              </span>

            </td>

            <td>

              <button
                class="small-btn"
                onclick="toggleAdmin('${a._id}')"
              >

                ${
                  enabled
                    ? "Disable"
                    : "Enable"
                }

              </button>

            </td>

          </tr>
        `;

      }).join("");

  }catch(err){

    body.innerHTML =
      `<tr>
        <td colspan="5" class="empty">
          ${escapeHtml(err.message)}
        </td>
      </tr>`;

  }
}

/* =========================================
   CREATE SUPER ADMIN
========================================= */

async function createSuperAdmin(){

  const tenantId =
    document.getElementById(
      "tenantSelect"
    ).value;

  const name =
    document.getElementById(
      "name"
    ).value.trim();

  const username =
    document.getElementById(
      "username"
    ).value.trim();

  const email =
    document.getElementById(
      "email"
    ).value.trim();

  const phone =
    document.getElementById(
      "phone"
    ).value.trim();

  const password =
    document.getElementById(
      "password"
    ).value;

  if(
    !tenantId ||
    !name ||
    !username ||
    !password
  ){

    showMessage(
      "Select company and enter Name, Username and Password.",
      false
    );

    return;
  }

  const btn =
    document.getElementById(
      "createBtn"
    );

  btn.disabled = true;

  btn.textContent =
    "Creating...";

  try{

    const data =
      await api(
        `/api/platform-admin/tenants/${tenantId}/super-admins`,
        {
          method:"POST",

          body:
            JSON.stringify({
              name,
              username,
              email,
              phone,
              password
            })
        }
      );

    showMessage(
      data.message ||
      "Super Admin created",
      true
    );

    document.getElementById(
      "name"
    ).value = "";

    document.getElementById(
      "username"
    ).value = "";

    document.getElementById(
      "email"
    ).value = "";

    document.getElementById(
      "phone"
    ).value = "";

    document.getElementById(
      "password"
    ).value = "";

    await loadAdmins();

  }catch(err){

    showMessage(
      err.message,
      false
    );

  }finally{

    btn.disabled = false;

    btn.textContent =
      "Create Super Admin";

  }
}

/* =========================================
   TOGGLE SUPER ADMIN
========================================= */

async function toggleAdmin(
  userId
){

  try{

    await api(
      `/api/platform-admin/super-admins/${userId}/toggle`,
      {
        method:"PATCH"
      }
    );

    await loadAdmins();

  }catch(err){

    showMessage(
      err.message,
      false
    );

  }
}

/* =========================================
   HELPERS
========================================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

/* =========================================
   START
========================================= */

loadTenants();

</script>

</body>
</html>
