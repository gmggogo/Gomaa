<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Platform Admin - Companies</title>

<link
  rel="stylesheet"
  href="/platform-admin/platform_header.css"
>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f5f8;
  color:#18202b;
}

.page{
  width:min(1200px,calc(100% - 32px));
  margin:28px auto;
}

.title-row{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:20px;
}

h1{
  margin:0;
  font-size:28px;
  color:#351c75;
}

.subtitle{
  margin:6px 0 0;
  color:#6a7280;
}

.card{
  background:#fff;
  border-radius:16px;
  box-shadow:0 8px 28px rgba(26,36,54,.08);
  padding:22px;
  margin-bottom:22px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
}

.full{
  grid-column:1/-1;
}

label{
  display:block;
  font-size:13px;
  font-weight:800;
  color:#454d5a;
  margin-bottom:7px;
}

input,
select{
  width:100%;
  height:46px;
  border:1px solid #d7dce4;
  border-radius:10px;
  padding:0 12px;
  font-size:15px;
  background:#fff;
}

input:focus,
select:focus{
  outline:none;
  border-color:#6c4ccf;
  box-shadow:0 0 0 3px rgba(108,76,207,.12);
}

.primary{
  border:0;
  min-height:46px;
  border-radius:10px;
  padding:0 18px;
  background:#351c75;
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

.primary:disabled{
  opacity:.6;
  cursor:wait;
}

.message{
  margin-top:14px;
  display:none;
  padding:11px 13px;
  border-radius:9px;
  font-size:14px;
}

.ok{
  display:block;
  background:#e7f7ed;
  color:#176b35;
}

.bad{
  display:block;
  background:#fdeaea;
  color:#a31e1e;
}

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}

th,
td{
  text-align:left;
  padding:13px 12px;
  border-bottom:1px solid #edf0f4;
}

th{
  color:#5c6471;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.04em;
}

.status{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:82px;
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
}

.active{
  background:#e7f7ed;
  color:#176b35;
}

.trial{
  background:#fff4d8;
  color:#8a6500;
}

.suspended,
.canceled,
.disabled{
  background:#fdeaea;
  color:#a31e1e;
}

.small-btn{
  border:1px solid #d8dce5;
  background:#fff;
  border-radius:8px;
  padding:7px 11px;
  font-weight:800;
  cursor:pointer;
  margin-right:6px;
}

.delete-btn{
  border:1px solid #ef4444;
  background:#fee2e2;
  color:#991b1b;
}

.delete-btn:hover{
  background:#fecaca;
}

.delete-btn:disabled{
  opacity:.55;
  cursor:wait;
}

.empty{
  text-align:center;
  color:#7a8290;
  padding:28px 10px;
}

@media(max-width:720px){

  .grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .title-row{
    align-items:flex-start;
    flex-direction:column;
  }
}

</style>

</head>

<body>

<div id="platformHeader"></div>

<main class="page">

  <div class="title-row">

    <div>

      <h1>
        Companies
      </h1>

      <p class="subtitle">
        Create and manage tenants on the GH Mobility platform.
      </p>

    </div>

  </div>

  <section class="card">

    <div class="grid">

      <div>
        <label>
          Company Name
        </label>

        <input
          id="companyName"
          type="text"
          autocomplete="off"
        >
      </div>

      <div>
        <label>
          Slug
        </label>

        <input
          id="companySlug"
          type="text"
          autocomplete="off"
          placeholder="example-transport"
        >
      </div>

      <div>
        <label>
          Timezone
        </label>

        <input
          id="timezone"
          type="text"
          value="America/Phoenix"
        >
      </div>

      <div>
        <label>
          Subscription Status
        </label>

        <select id="subscriptionStatus">

          <option value="ACTIVE">
            ACTIVE
          </option>

          <option value="TRIAL">
            TRIAL
          </option>

          <option value="SUSPENDED">
            SUSPENDED
          </option>

          <option value="CANCELED">
            CANCELED
          </option>

        </select>
      </div>

      <div class="full">
        <button
          id="createBtn"
          class="primary"
          onclick="createTenant()"
        >
          Create Company
        </button>

        <div
          id="message"
          class="message"
        ></div>
      </div>

    </div>

  </section>

  <section class="card">

    <div class="title-row">

      <div>
        <h1 style="font-size:21px">
          Platform Companies
        </h1>

        <p class="subtitle">
          All tenants currently registered in the platform.
        </p>
      </div>

    </div>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>Company</th>
            <th>Slug</th>
            <th>Timezone</th>
            <th>Enabled</th>
            <th>Subscription</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="tenantBody">

          <tr>
            <td
              colspan="6"
              class="empty"
            >
              Loading companies...
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </section>

</main>

<script src="/platform-admin/platform_header.js"></script>

<script>

const token =
  localStorage.getItem(
    "token"
  ) || "";

const role =
  localStorage.getItem(
    "role"
  ) || "";

let platformTenants = [];

if(
  !token ||
  role !== "PLATFORM_ADMIN"
){
  window.location.replace(
    "/login.html"
  );
}

async function api(
  url,
  options = {}
){

  const headers = {
    ...(options.headers || {}),
    "Authorization":
      "Bearer " + token
  };

  if(
    options.body &&
    !headers["Content-Type"]
  ){
    headers["Content-Type"] =
      "application/json";
  }

  const res =
    await fetch(
      url,
      {
        ...options,
        headers
      }
    );

  const data =
    await res
      .json()
      .catch(()=>({}));

  if(!res.ok){

    throw new Error(
      data.message ||
      "Request failed"
    );

  }

  return data;
}

function showMessage(
  text,
  ok
){

  const el =
    document.getElementById(
      "message"
    );

  el.className =
    "message " +
    (ok ? "ok" : "bad");

  el.textContent =
    text;
}

function makeSlug(value){

  return String(value || "")
    .trim()
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"");
}

document
  .getElementById(
    "companyName"
  )
  .addEventListener(
    "input",
    e=>{

      const slug =
        document.getElementById(
          "companySlug"
        );

      if(
        !slug.dataset.edited
      ){
        slug.value =
          makeSlug(
            e.target.value
          );
      }

    }
  );

document
  .getElementById(
    "companySlug"
  )
  .addEventListener(
    "input",
    e=>{

      e.target.dataset.edited =
        e.target.value
          ? "1"
          : "";

    }
  );

async function createTenant(){

  const name =
    document.getElementById(
      "companyName"
    ).value.trim();

  const slug =
    makeSlug(
      document.getElementById(
        "companySlug"
      ).value
    );

  const timezone =
    document.getElementById(
      "timezone"
    ).value.trim() ||
    "America/Phoenix";

  const subscriptionStatus =
    document.getElementById(
      "subscriptionStatus"
    ).value;

  if(
    !name ||
    !slug
  ){

    showMessage(
      "Enter Company Name and Slug.",
      false
    );

    return;
  }

  const btn =
    document.getElementById(
      "createBtn"
    );

  btn.disabled = true;

  btn.textContent =
    "Creating...";

  try{

    const data =
      await api(
        "/api/platform-admin/tenants",
        {
          method:"POST",

          body:
            JSON.stringify({
              name,
              slug,
              timezone,
              subscriptionStatus
            })
        }
      );

    showMessage(
      data.message ||
      "Company created successfully.",
      true
    );

    document.getElementById(
      "companyName"
    ).value = "";

    document.getElementById(
      "companySlug"
    ).value = "";

    document.getElementById(
      "companySlug"
    ).dataset.edited = "";

    document.getElementById(
      "subscriptionStatus"
    ).value =
      "ACTIVE";

    await loadTenants();

  }catch(err){

    showMessage(
      err.message,
      false
    );

  }finally{

    btn.disabled = false;

    btn.textContent =
      "Create Company";

  }
}

async function loadTenants(){

  const body =
    document.getElementById(
      "tenantBody"
    );

  body.innerHTML =
    `<tr>
      <td colspan="6" class="empty">
        Loading companies...
      </td>
    </tr>`;

  try{

    const tenants =
      await api(
        "/api/platform-admin/tenants"
      );

    platformTenants =
      Array.isArray(tenants)
        ? tenants
        : [];

    if(
      !Array.isArray(tenants) ||
      !tenants.length
    ){

      body.innerHTML =
        `<tr>
          <td colspan="6" class="empty">
            No companies yet.
          </td>
        </tr>`;

      return;
    }

    body.innerHTML =
      tenants.map(t=>{

        const enabled =
          t.enabled !== false;

        const status =
          String(
            t.subscriptionStatus ||
            "ACTIVE"
          ).toUpperCase();

        const statusClass =
          status.toLowerCase();

        return `
          <tr>

            <td>
              ${escapeHtml(
                t.name || ""
              )}
            </td>

            <td>
              ${escapeHtml(
                t.slug || ""
              )}
            </td>

            <td>
              ${escapeHtml(
                t.timezone ||
                "America/Phoenix"
              )}
            </td>

            <td>
              <span
                class="status ${
                  enabled
                    ? "active"
                    : "disabled"
                }"
              >
                ${
                  enabled
                    ? "YES"
                    : "NO"
                }
              </span>
            </td>

            <td>
              <span
                class="status ${statusClass}"
              >
                ${escapeHtml(status)}
              </span>
            </td>

            <td>

              <button
                class="small-btn"
                onclick="toggleTenant('${t._id}', ${enabled})"
              >
                ${
                  enabled
                    ? "Disable"
                    : "Enable"
                }
              </button>

              <button
                class="small-btn"
                onclick="openSuperAdmins('${t._id}')"
              >
                Super Admins
              </button>

              <button
                class="small-btn delete-btn"
                id="deleteBtn-${t._id}"
                onclick="deleteTenant('${t._id}')"
              >
                Delete Tenant
              </button>

            </td>

          </tr>
        `;

      }).join("");

  }catch(err){

    body.innerHTML =
      `<tr>
        <td colspan="6" class="empty">
          ${escapeHtml(err.message)}
        </td>
      </tr>`;

  }
}

async function toggleTenant(
  tenantId,
  currentlyEnabled
){

  try{

    await api(
      `/api/platform-admin/tenants/${tenantId}/status`,
      {
        method:"PATCH",

        body:
          JSON.stringify({
            enabled:
              !currentlyEnabled
          })
      }
    );

    await loadTenants();

  }catch(err){

    showMessage(
      err.message,
      false
    );

  }
}


async function deleteTenant(
  tenantId
){

  const tenant =
    platformTenants.find(
      item =>
        String(item?._id || "") ===
        String(tenantId || "")
    );

  if(!tenant){

    alert(
      "Company information could not be found. Refresh the page and try again."
    );

    return;
  }

  const tenantName =
    String(
      tenant.name || ""
    ).trim();

  const tenantSlug =
    String(
      tenant.slug || ""
    )
    .trim()
    .toLowerCase();

  /*
    FIRST WARNING
  */

  const firstWarning =
    window.confirm(
      "⚠️ PERMANENT DELETE WARNING ⚠️\n\n" +
      "Company: " + tenantName + "\n" +
      "Slug: " + tenantSlug + "\n\n" +
      "Deleting this company will permanently remove ALL data that belongs to this tenant, including:\n\n" +
      "• Users and passwords\n" +
      "• Company / facility accounts\n" +
      "• Drivers\n" +
      "• Trips and trip history\n" +
      "• Dispatch records\n" +
      "• Billing history\n" +
      "• Driver schedules\n" +
      "• Pricing / overrides\n" +
      "• Stripe connection records\n" +
      "• Other records linked to this tenantId\n\n" +
      "This action CANNOT be undone.\n\n" +
      "Do you want to continue?"
    );

  if(!firstWarning){
    return;
  }

  /*
    SECOND WARNING:
    User must type the exact tenant slug.
  */

  const typed =
    window.prompt(
      "FINAL CONFIRMATION\n\n" +
      "To permanently delete \"" +
      tenantName +
      "\", type this company slug exactly:\n\n" +
      tenantSlug
    );

  if(typed === null){
    return;
  }

  if(
    String(typed)
      .trim()
      .toLowerCase() !==
    tenantSlug
  ){

    alert(
      "Delete cancelled.\n\nThe company slug did not match."
    );

    return;
  }

  const finalOk =
    window.confirm(
      "LAST WARNING\n\n" +
      "You are about to permanently delete:\n\n" +
      tenantName +
      "\n\nAll tenant data will be deleted permanently.\n\n" +
      "Press OK only if you are completely sure."
    );

  if(!finalOk){
    return;
  }

  const btn =
    document.getElementById(
      `deleteBtn-${tenantId}`
    );

  if(btn){
    btn.disabled = true;
    btn.textContent =
      "Deleting...";
  }

  try{

    const data =
      await api(
        `/api/platform-admin/tenants/${tenantId}`,
        {
          method:"DELETE",

          body:
            JSON.stringify({
              confirmSlug:
                tenantSlug
            })
        }
      );

    alert(
      data.message ||
      "Tenant permanently deleted."
    );

    showMessage(
      data.message ||
      "Tenant permanently deleted.",
      true
    );

    sessionStorage.removeItem(
      "platformSelectedTenantId"
    );

    await loadTenants();

  }catch(err){

    console.error(
      "DELETE TENANT ERROR:",
      err
    );

    alert(
      "Delete failed:\n\n" +
      (
        err.message ||
        "Unknown error"
      )
    );

    showMessage(
      err.message ||
      "Delete failed",
      false
    );

    if(btn){
      btn.disabled = false;
      btn.textContent =
        "Delete Tenant";
    }

  }

}


function openSuperAdmins(
  tenantId
){

  sessionStorage.setItem(
    "platformSelectedTenantId",
    tenantId
  );

  window.location.href =
    "/platform-admin/super-admins.html";
}

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

loadTenants();

</script>

</body>
</html>
